# D11 plan: Notes (bead dcm-bxp.10). Per-person bullet journals (a player's journal belongs to their character), pages
# (session logs linked to real sessions, collections, future log), bullets with signifiers and task states, migration, open
# threads, search, an @ picker for Characters & Locations, per-page sharing with chosen recipients, entries added by readers,
# a 30-day bin for torn-out pages, past journals of departed characters, and "Download my journal".
# Board: reference/designs/project/Notes.dc.html (the only Notes board; visual spec). Patch history:
#   reference/designs/tools/notes_profiles.py (per-person journals; its PIN is dropped, A1), tracker dh-009, dh-5p5.
# Analysis: .omc/autopilot/d11-analysis.md (board inventory, data model, visibility and action tables, conflicts).
# Format: docs/workflow.md. Extra keys per tracer (plan-check ignores them): title, size (S | M | L), foundation.
# Book pages: none. Notes has no game mechanic; Hope / Fear bullets are labels only (Q7). Nothing to quote.
# Paths: C = src/app/(gm)/campaigns/[campaignId] (written out in full below).
#
# Status: APPROVED FOR BUILD 2026-10-21. Every question is answered; no open questions remain. Answers marked (An) / (Qn),
#   defaults this plan adds marked (Dn); the coordinator's assumed defaults are part of the answers they belong to.
#
# USER ANSWERS (2026-10-21, binding):
#   A1  No PIN at all: no 'Lock with a PIN', 'Close & lock', locked card or PIN text (also decision 'Notes: NO PINs').
#   A2  Every account has its own notes section per campaign, plus a Shared section with the tabs 'Shared by players' and
#       'Shared by GM'. Refined by Q12 (a player's journal belongs to their character).
#   A3  A player's page is private, shared with the other players only (hidden from the GM), or shared with everyone.
#   A4  The GM reads players' pages by default; per page a player can hide it from the GM or show it to players only. The owner
#       always sees their page. The GM's pages are private by default and can be shared into 'Shared by GM'. Server-enforced.
#   A5  The GM can share a page with chosen players (one or more) besides everyone; only they see it in 'Shared by GM'.
#       Recipients are their own indexed table (journalPageRecipients), never an array in the page (rule 6).
#   Q1  Sharing is set per page (a page with its entries).
#   Q2  The GM sees players' pages everywhere: in 'Shared by players' and by opening any player's journal, unless hidden from
#       the GM.
#   Q3  Only the owner edits a page. The GM and any player who can read a page can ADD entries to it. An added entry has a
#       different colour and ends with '- <author>': the author's character name for a player (fallback account name), 'GM'
#       for the GM. Assumed defaults: an author edits and deletes their own added entries; the page owner can delete any added
#       entry but not edit it; an added entry is visible to whoever can read the page.
#   Q4  Players can also share a page with chosen players, using the same recipients table as the GM.
#   Q5  Session log pages are named after the real D10 session with its date; a new session log page links to the current or a
#       chosen session.
#   Q6  An @ picker stores the Codex entry id, so links survive renames; the current name is shown; viewers who cannot see the
#       entry get plain text.
#   Q7  Hope / Fear bullets are labels only (they never touch party Hope or GM Fear).
#   Q8  '<active character>’s Journal' / 'Player journal · <class>' (fallback account name / 'Player'); GM 'Game Master’s
#       Journal' / 'GM journal · private to the GM'.
#   Q9  Download allowed. Assumed default: 'Download my journal' exports your own pages as one Markdown file, generated in the
#       browser from data you can read; no server export of other people's pages.
#   Q10 Limits: MAX_PAGES 200 per journal (bin included), MAX_PAGE_ENTRIES 300, MAX_JOURNAL_ENTRIES 5000, TITLE_MAX 80,
#       TEXT_MAX 500 characters.
#   Q11 Tearing out a page gives a 10-second Undo and moves it to a bin for 30 days, restorable by the owner; then an internal,
#       batched, self-rescheduling cron in convex/crons.ts purges it (rule 8).
#   Q12 A player's journal is linked to their CHARACTER. When the player leaves or is removed, or the character dies or is
#       retired, the journal is kept, its pages become readable by everyone in the campaign and the GM can delete them; a
#       'Past journals' list in the Shared section names them after the character. Assumed defaults: pages marked Private
#       (hidden from everyone) stay private after departure; a new character gets a new journal; a player without a character
#       writes in an account journal that attaches to their first character; the GM's journal belongs to the GM account; a
#       departed player who rejoins gets their pages' previous visibility back.
#   Q13 Search and open threads cover your own journal only.
#   Q14 The sharing chip alone tells the owner who can read a page.
#
# DEFAULTS THIS PLAN ADDS (assumed defaults, each derived from an answer; analysis section 0.3):
#   D1  Departure is computed at read time, never stored: a player journal is departed when its owner has no campaign role
#       (convex/lib/permissions.ts campaignRole is null after members.removePlayer / leave), or its character is missing, has
#       status 'dead' or 'retired' (storedCharacterStatusValidator; no new state), or belongs to another account now. 'away'
#       (benched, X6, or a Castle High death move) is not a departure. A rejoin or a status set back to 'active' restores the
#       previous visibility by itself. No D11 tracer edits convex/members.ts or convex/characters.ts.
#   D2  A departed journal is frozen: nobody adds or edits entries, not even its owner (who still reads it while a member); the
#       GM may tear out its non-private pages into the bin (restorable by the GM, purged after 30 days).
#   D3  Attachment: an unattached player journal (characterId absent) belongs to the player's earliest character in the
#       campaign that is not departed and has no journal; the first write after that stores characterId. The current journal is
#       the active character's, else the newest non-departed character's, else an unattached one (created on first write).
#   D4  A player's 'chosen' page is hidden from the GM unless the player ticks the GM in the recipient picker.
#   D5  Added entries: text edit by the author; delete by the author or the page owner; bullet cycle by the owner or the author;
#       star and order by the owner only; migrated copies keep their author; a journal's open threads include added entries on
#       its own pages.
#   D6  Session log pages: title set at creation ('Session N', plus ': <session title>' when there is one), editable; the meta
#       shows the linked session's date live ('No date set'); players link only live / played sessions (D10 Q4), the GM any;
#       a deleted session leaves the page unlinked; the picker preselects the live session, else the newest visible one; the
#       default 'Session 1' page links to the live or newest visible session when one exists; migration to a new log page uses
#       the board title and no link.
#   D7  Mentions are stored in the entry text as '@[<name when written>](<codexEntryId>)' tokens (at most 10 per entry; the
#       server checks each id is a codex entry of the campaign the author can see, else INVALID); a viewer who can see the entry
#       gets a link with its current name, everyone else the stored name as plain text.
#
# Visibility (journalPages.visibility): player 'gm' (default) | 'private' | 'players' | 'everyone' | 'chosen'; GM 'private'
#   (default) | 'everyone' | 'chosen'. Readers besides the owner, journal present: gm -> GM; private -> nobody; players -> other
#   players, not the GM; everyone -> every member; chosen -> recipients (D4). Departed journal (D1): private stays owner-only,
#   every other value -> every member. The GM journal never departs. Binned pages: owner (and the GM for a departed journal's
#   page it tore out) only, in the bin. A page the caller may not read answers NOTE_PAGE_NOT_FOUND, exactly as a deleted one.
#
# Rules the board settles (binding; tracers quote the ones they implement in their task doc; line numbers in Notes.dc.html):
#   B1  Header (l.66-74): '<whoName>’s Journal', sub '<whoSub> · <N> pages · <M> entries', '🧵 Open threads · N' (aria-pressed,
#       accent fill when on). Dropped: 'Writing as' switcher (A2) and PIN controls (A1).
#   B2  Index (l.91-107): 'Search the journal'; groups 'Session logs' / 'Collections' / 'Future log' with '＋' ('New session
#       log', 'New collection', 'New future page'); page button = tape tab, title, count ('N open' / entry count / nothing);
#       'Nothing here yet.' / 'No matches.'; Quick keys card copy.
#   B3  Page (l.127-165): tape label; title input; meta '<session log | collection | future log> · <date>'; '🎀 Tape' (6 tapes);
#       '➜ Migrate open tasks' (disabled without open tasks; tooltips 'Copy open tasks to “<t>” and mark them > here' / 'Copy
#       open tasks to a new page and mark them > here'); 'Tear out page' -> 'Click again to tear out'; empty lines per kind; KEY.
#   B4  Entries (l.139-157, 195-280): task • / event ○ / note – / idea ! / Hope ✦ / Fear ☠ with the board's tooltips; task
#       open -> done (×) -> migrated (>) -> scheduled (<) -> struck -> open; others open <-> resolved; ★; ✎ or double-click edit
#       (Enter / Escape / blur); ↑; × (no confirm); 'Bullet type' chips; 'Write a <kind> and press Enter… (@ to link)'; quick
#       keys '* . o - ! + ^' + space.
#   B5  Open thread = open task or unresolved Fear. Threads view (l.111-120): tape 'Open threads', 'Every unfinished task and
#       every looming Fear, from all pages.', '<page title> →', 'Nothing dangling. Suspicious…'.
#   B6  Migrate (l.296-333): first later page of the same kind, else a new page ('Session <n>' / '<title> (cont.)'); open tasks
#       copied as new open entries (author kept, D5), originals migrated; target opens.
#   B7  New pages (l.285): 'New collection', 'Future log <n>', session logs per D6; tape = page count mod 6. Default pages: GM
#       'Session 1', 'Rumors & hooks', 'Loot & debts', 'Future log'; player 'Session 1', 'People we met', 'Clues & secrets', 'My
#       goals' (tapes l.223-224). New and default pages get the default visibility (A4).
#   B8  Tear out (l.326): rip animation (two clip-path halves, scraps) and synthesised tear sound; skipped under reduced motion.
#   B9  Search (l.251, 283): case-insensitive substring over titles and entry text; matching rows highlighted.
#
# Rules for every tracer (part of every acceptance list, not repeated):
#   - Every public function uses the wrappers in convex/lib/functions.ts: campaignQuery / campaignMutation /
#     keyedCampaignMutation with need 'view' (GM and players pass; outsiders NOT_FOUND, anonymous UNAUTHENTICATED). Page access
#     goes only through convex/lib/notes.ts pageAccess, which calls permissionFor on the 'journalPage' resource (CF2) and
#     returns { permission, departed, isAuthor... }; the action table in .omc/autopilot/d11-analysis.md 3.2 is enforced there.
#     The caller's identity comes from ctx.user only (CF3, CF4); recipient ids are validated as campaign members.
#   - `args` and `returns` validators on every new function, no v.any(); schema-guard RETURNS_PENDING never grows.
#   - Its own Convex test covers anonymous, outsider, owner player, second player, chosen player where relevant, and GM for each
#     new function, written as a table (function x role -> expected code) so D12 can fold it into
#     tests/convex/authz-matrix.test.ts (that file does not exist yet); assertions use ConvexError.data.code (errorCode
#     helper), never message text.
#   - Intents only: page ref + one field, entry id + one field, page + user for recipients. The server computes next states with
#     the N1 domain. Optimistic updates on bullet cycle, star, add, delete, move up, rename, tape, visibility and recipients,
#     with updaters in src/lib/optimistic/notes-<area>.ts.
#   - Indexed reads only (no .filter on queries; binnedAt is part of the list indexes); caps checked with counters, never
#     .collect().length.
#   - A new error code is one N0 defines in src/lib/errors/notes.ts; a code N0 did not add means stop and report.
#   - No new dependency. Pure logic lives in src/lib/domain/notes (N1), used by server and client alike.
#   - Every useQuery subtree sits inside an error boundary; loading uses the shared Loading with role=status.
#   - UI in the board's look: classes from C/notes/notes.css (N0: bj-paper, bj-tape, bj-row, bj-bul, bj-text, bj-act, bj-ib,
#     bj-chip, bj-mention, bj-add, bj-edit, bj-key, bj-in, bj-ghost, bj-lbl, bj-added (added-entry colour)); later tracers add CSS
#     only in their own colocated .css. 390 px (no board layout): one column, no horizontal page scroll, targets >= 44 px, row
#     actions visible on touch, labels on every control, keyboard reachable, reduced motion respected, native <dialog> via
#     src/components/brand/modal.tsx.
#   - Visual acceptance: the tracer's tests/e2e/visual/D11-<id>.spec.ts (tag @visual, E2E_VISUAL=1) shoots its regions at
#     1440x900 and 390x844; board counterparts from `node scripts/board-shots.mjs notes:<region>` (1440 only); regions that are
#     not on the board (sharing, Shared section, journals lists, pickers, bin, toast) are judged against the board's tokens; the
#     task doc docs/tasks/TASK-D11-<id>.md lists both sets with a verdict per region and every deliberate deviation.
#   - pnpm lint (zero warnings in convex/), pnpm typecheck, pnpm test and the tracer's own e2e specs pass in its worktree; the
#     orchestrator runs the full e2e suite after each wave.
#
# Data model (N0 creates every table and index; later tracers only add functions). Widen only.
#   journals              campaignId, userId, characterId? (D3), pageCount, entryCount, openCount, createdAt, updatedAt.
#                         Indexes by_campaign_user [campaignId, userId], by_character [characterId], by_campaign.
#   journalPages          campaignId, journalId, ownerId, kind ('log' | 'collection' | 'future'), title, tape (0-5), visibility,
#                         sessionId? (Q5), binnedAt?, binnedBy?, entryCount, openCount, createdAt, updatedAt. Indexes
#                         by_journal_binned [journalId, binnedAt], by_campaign_visibility_binned [campaignId, visibility,
#                         binnedAt], by_binned [binnedAt], by_campaign.
#   journalPageRecipients campaignId, pageId, userId, addedAt. Indexes by_page_user [pageId, userId], by_campaign_user
#                         [campaignId, userId], by_campaign. Rows exist only while the page is 'chosen'.
#   journalEntries        campaignId, journalId, pageId, authorId, authorCharacterId?, kind, state, star, text (D7 tokens), order,
#                         open, createdAt, updatedAt. Indexes by_page_order [pageId, order], by_journal_open [journalId, open],
#                         by_campaign; search index search_text (text; filter journalId).
#   Typed fields only (no blob, no schemaVersion). Counters exclude binned pages. purgeCampaign deletes all four tables' rows;
#   the bin cron (N7) purges pages binned > 30 days with their entries and recipients. First write creates the journal and its
#   default pages from template refs (CL6).
#
# Shared files: convex/schema.ts, convex/lib/permissions.ts, convex/cleanup.ts, src/lib/errors/app-error.ts,
#   src/lib/convex-errors.ts, tests/convex/schema-guard.test.ts, tests/convex/cleanup.test.ts, tests/convex/permissions.test.ts,
#   scripts/board-shots.mjs belong to N0. convex/crons.ts belongs to N7. C/notes/page.tsx belongs to N0, which mounts one stub
#   per feature folder (src/components/notes/{header,index-column,page,entries,threads,search,export,mentions,sharing,shared,bin,
#   journals}/index.tsx) with typed props from src/components/notes/slots.ts (campaignId, journalId?, pageId, view ('page' |
#   'threads' | 'shared-players' | 'shared-gm' | 'journal' | 'bin'), search, matchingPageIds, access, onPage, onView, onSearch);
#   page and view live in the URL (?page=<id>&view=...&journal=<id>). N9 may adjust C/notes/page.tsx and notes.css in wave 5.
#   C/codex/page.tsx belongs to N5 (one ?entry= read). docs/data-model.md is updated by the orchestrator. The static C/notes
#   route replaces the [section] placeholder for Notes; campaign-sections.ts is unchanged.
plan: d11-notes
waves:
  # ---------------------------------------------------------------- wave 1: foundation and pure domain, in parallel
  - wave: 1
    tracers:
      - id: N0
        foundation: true
        title: D11 foundation (tables, validators, error module, journalPage resource with visibility + departure in permissionFor, pageAccess and journal helpers, purge, route shell with stubs, board shots)
        size: L
        goal: The notes tables exist and are purged with their campaign, permissionFor and pageAccess decide every page read and action by the visibility, departure and authorship rules, the journal helpers (current journal, attachment, ensureJournal, template refs) are wired, and /campaigns/<id>/notes opens a board-look shell with stubs for GM and players.
        depends_on: []
        owns:
          - convex/schema.ts
          - convex/tables/notes.ts
          - convex/lib/validators/notes.ts
          - convex/lib/notes.ts
          - convex/lib/journalState.ts
          - convex/lib/permissions.ts
          - convex/cleanup.ts
          - src/lib/errors/notes.ts
          - src/lib/errors/app-error.ts
          - src/lib/convex-errors.ts
          - src/app/(gm)/campaigns/[campaignId]/notes/page.tsx
          - src/app/(gm)/campaigns/[campaignId]/notes/error.tsx
          - src/app/(gm)/campaigns/[campaignId]/notes/notes.css
          - src/components/notes/slots.ts
          - src/components/notes/header/index.tsx
          - src/components/notes/index-column/index.tsx
          - src/components/notes/page/index.tsx
          - src/components/notes/entries/index.tsx
          - src/components/notes/threads/index.tsx
          - src/components/notes/search/index.tsx
          - src/components/notes/export/index.tsx
          - src/components/notes/mentions/index.tsx
          - src/components/notes/sharing/index.tsx
          - src/components/notes/shared/index.tsx
          - src/components/notes/bin/index.tsx
          - src/components/notes/journals/index.tsx
          - scripts/board-shots.mjs
          - tests/convex/schema-guard.test.ts
          - tests/convex/cleanup.test.ts
          - tests/convex/permissions.test.ts
          - tests/convex/notes-lib.test.ts
          - tests/e2e/notes-shell.spec.ts
          - docs/tasks/TASK-D11-N0.md
        reads:
          - reference/designs/project/Notes.dc.html
          - .omc/autopilot/d11-analysis.md
          - convex/lib/functions.ts
          - convex/members.ts
          - convex/characters.ts
          - convex/lib/validators/characters.ts
          - convex/tables/characters.ts
          - convex/tables/campaigns.ts
          - convex/tables/files.ts
          - convex/tables/sessions.ts
          - convex/tables/codex.ts
          - src/lib/campaign-sections.ts
          - src/app/(gm)/campaigns/[campaignId]/campaign-shell.tsx
          - src/app/(gm)/campaigns/[campaignId]/sessions/page.tsx
          - tests/convex/helpers.ts
        acceptance:
          - "convex/tables/notes.ts defines journals, journalPages, journalPageRecipients, journalEntries with every field, index and the search index of the data model; convex/schema.ts composes them; caps (Q10, MAX_MENTIONS 10), kind / state / visibility validators, pageRefValidator (page id or { template: number }) and the D7 token format constant live in convex/lib/validators/notes.ts"
          - "convex/lib/journalState.ts: departed(ctx, campaign, journal) per D1 (campaignRole null; character missing, 'dead', 'retired' or owned by another account; 'away' and 'active' not departed; the GM journal never departs), at most three point reads, no write"
          - "convex/lib/permissions.ts: Resource gains { type: 'journalPage'; campaign; journal; page }; permissionFor returns owner for the page owner and view per the visibility table (A3, A4, A5, Q2, Q4, D4, Q12 departure: private stays owner-only, every other value readable by every member), else null; binned pages only for the owner and the binning GM; recipients read with one by_page_user point lookup"
          - "tests/convex/permissions.test.ts covers the full matrix: every visibility x {owner, GM, other player, chosen player, player not chosen, outsider} x {journal present, departed by removal, departed by 'dead', departed by 'retired', 'away' (not departed), rejoined}; a GM 'chosen' page is readable by the chosen player and not by a player who was not chosen; a player's 'chosen' page is hidden from the GM unless the GM is a recipient (D4); a departed player's 'players' page becomes readable by the GM and its 'private' page stays owner-only; after a rejoin the 'players' page is hidden from the GM again"
          - "convex/lib/notes.ts: currentJournal (D3: active character's journal, else newest non-departed character's, else unattached), ensureJournal (creates the journal and default pages from N1: GM template + 'private' when ctx.permission is campaign owner, else player template + 'gm'; stores characterId per D3), resolvePage (own page id or template index), pageAccess (permissionFor + departed + author flags; enforces the analysis 3.2 action table: canEditPage, canAdd, canEditEntry, canCycle, canDeleteEntry, canBin, canRestore; NOTE_PAGE_NOT_FOUND / NOTE_ENTRY_NOT_FOUND / NOTE_FORBIDDEN_ACTION / NOTE_JOURNAL_CLOSED), insertPage (NOTE_PAGE_LIMIT), deletePageRows (entries and recipients, bounded), bumpCounts; tests/convex/notes-lib.test.ts covers each, including attachment of an account journal to the first character and a new journal for a second character after the first died"
          - "src/lib/errors/notes.ts defines every code D11 needs (at least NOTE_PAGE_NOT_FOUND, NOTE_ENTRY_NOT_FOUND, NOTE_PAGE_LIMIT, NOTE_PAGE_FULL, NOTE_JOURNAL_FULL, NOTE_NOTHING_TO_MIGRATE, NOTE_VISIBILITY_INVALID, NOTE_RECIPIENT_INVALID, NOTE_FORBIDDEN_ACTION, NOTE_JOURNAL_CLOSED, NOTE_SESSION_INVALID, NOTE_MENTION_INVALID, NOTE_NOT_BINNED) and app-error.ts / convex-errors.ts combine them; no PIN code (A1)"
          - "purgeCampaign deletes every notes table's rows in bounded batches; schema-guard classifies the four tables as campaign-scoped and journalPages also as retention-managed (bin, N7); tests/convex/cleanup.test.ts covers the purge"
          - "The page shows the board's hero (campaign line, title and sub slots, actions slot), the index column (search slot, own-page groups slot, the Shared slot with tabs 'Shared by players' / 'Shared by GM', the journals slot, the bin slot, Quick keys card copy) and the paper column, driven by ?page, ?view and ?journal; 1440: 300 px + fluid as the board; 390: one column; error.tsx (CL1); title 'Notes · <campaign>' (CL15); no PIN control (A1)"
          - "Every slot stub renders its section's empty frame with typed props from src/components/notes/slots.ts, each in its own error boundary"
          - "board-shots: notes:empty (GM default pages), notes:page (every kind and state, a star, a mention), notes:threads, notes:search, notes:player (player default pages), notes:tear (mid-animation frame)"
          - "e2e notes-shell: the GM and a player each open Notes and see the shell with the two Shared tabs; an outsider gets the campaign not-found page"
      - id: N1
        title: Pure domain - bullets and states, quick keys, threads, migration, defaults and titles, visibility rules and labels, action rules, mention tokens, session-log titles, Markdown export, search match, header line
        size: M
        goal: A pure, tested TypeScript module answers every derived value the Notes board and its additions show, from plain journal, page, entry, session and character rows.
        depends_on: []
        owns:
          - src/lib/domain/notes/**
          - tests/unit/notes-domain.test.ts
          - docs/tasks/TASK-D11-N1.md
        reads:
          - reference/designs/project/Notes.dc.html
          - .omc/autopilot/d11-analysis.md
          - src/lib/domain/sessions/index.ts
        acceptance:
          - "bullets.ts: six kinds with glyph, colour, label and the board's tooltips; glyphFor; nextState (task cycle; others open <-> done); isStruck; bulletTip; isOpenThread - B4, B5; Hope / Fear labels only (Q7)"
          - "quick-keys.ts: parseQuickKey(text, selectedKind) for '* . o - ! + ^' + space - B4"
          - "migrate.ts: migrationTarget and newContinuationTitle - B6"
          - "defaults.ts: GM / player default pages, newPageTitle ('New collection', 'Future log <n>', 'Session <log pages + 1>' for unlinked logs), sessionLogTitle(session) ('Session N' / 'Session N: <title>', D6), newPageTape - B7, Q5"
          - "visibility.ts: allowedVisibilities(isGm) (player gm / private / players / everyone / chosen; GM private / everyone / chosen; Q4), defaultVisibility (A4), chip labels ('Private · GM can read', 'Private · hidden from everyone', 'Players only (hidden from the GM)', 'Everyone', 'Chosen players'; GM 'Private', 'Everyone', 'Chosen players'), effectiveReaders(visibility, departed) for the chip text and the departed rule (Q12)"
          - "actions.ts: the pure form of the analysis 3.2 action table (isOwner, isAuthor, departed, canRead) -> canEditPage, canAdd, canEditEntry, canCycle, canDeleteEntry, canBin, canRestore; used by convex/lib/notes.ts and the UI (D2, D5, Q3)"
          - "mentions.ts: token format '@[name](id)' (D7): parseTokens(text) -> parts, insertMention, countMentions (<= 10), toPlainText, renderParts(parts, visibleRefs) -> link with current name / plain stored name (Q6)"
          - "authors.ts: authorLabel (character name, else account name; 'GM' for the campaign owner) and the ' - <author>' suffix (Q3)"
          - "export.ts: journalToMarkdown(pages, entries) -> one Markdown document (page headings with kind and date, bullet glyphs and states, mentions as plain names, added entries with their author) (Q9)"
          - "summary.ts: headerLine, pageCountLabel, pageMeta (session date for linked logs, D6), emptyLine, matches - B2, B3, B9"
          - "Unit tests cover every function above, including a full task-state cycle, migration with and without a later page, every allowed / refused visibility per owner type, every action-table row, departed visibility, mention tokens with renamed and invisible entries, and a Markdown export snapshot"

  # ---------------------------------------------------------------- wave 2: own journal + pages, entries, in parallel
  - wave: 2
    tracers:
      - id: N2
        title: Own journal and pages - current journal, default pages, new page with session link, rename, tape, hero and index column
        size: M
        goal: Each person opens their current journal (the GM's account journal, a player's character journal) with the board's default pages, creates pages (session logs linked to a real session), renames and re-tapes them, and sees the hero and the index column with counts.
        depends_on: [N0, N1]
        owns:
          - convex/notes.ts
          - src/components/notes/header/**
          - src/components/notes/index-column/**
          - src/components/notes/page/**
          - src/lib/optimistic/notes-pages.ts
          - tests/convex/notes-pages.test.ts
          - tests/e2e/notes-pages.spec.ts
          - tests/e2e/visual/D11-N2.spec.ts
          - docs/tasks/TASK-D11-N2.md
        reads:
          - convex/lib/notes.ts
          - convex/lib/journalState.ts
          - convex/lib/validators/notes.ts
          - convex/tables/notes.ts
          - convex/characters.ts
          - convex/sessionRecords.ts
          - convex/tables/sessions.ts
          - src/lib/domain/notes/index.ts

# D11 plan: Notes (bead dcm-bxp.10). Per-person bullet journals: pages (session logs, collections, future log), bullets with
# signifiers and task states, migration of open tasks, open threads, search, @links to Characters & Locations, tear-out, and a
# Shared section ('Shared by players' / 'Shared by GM') with per-page visibility enforced on the server.
# Board: reference/designs/project/Notes.dc.html (the only Notes board; visual spec and data model). Patch history:
#   reference/designs/tools/notes_profiles.py (per-person journals; its PIN is dropped, A1), tracker dh-009, dh-5p5.
# Analysis: .omc/autopilot/d11-analysis.md (board inventory, data model, visibility model, conflicts, USER ANSWERS, OPEN QUESTIONS).
# Format: docs/workflow.md. Extra keys per tracer (plan-check ignores them): title, size (S | M | L), foundation.
# Book pages: none. Notes has no game mechanic; the Hope / Fear bullets are journal labels only (OQ7). Nothing to quote.
# Paths: C = src/app/(gm)/campaigns/[campaignId] (written out in full below).
#
# Status: DRAFT 2026-10-21. USER ANSWERS A1-A5 are binding. OPEN QUESTIONS OQ1-OQ14 carry defaults that are PENDING USER ANSWER;
#   the acceptance lists use those defaults and mark them (OQn). An answer that differs changes only the tracers citing it.
#   No tracer starts until the user has answered or accepted the open defaults.
#
# USER ANSWERS (2026-10-21, binding):
#   A1  No PIN at all: the board's 'Lock with a PIN', 'Close & lock', the locked card and every PIN text are dropped (also the
#       earlier decision 'Notes: NO PINs', docs/decisions-d3-d11.md).
#   A2  Every account has its own notes section per campaign, plus a Shared section with two tabs: 'Shared by players' and
#       'Shared by GM'.
#   A3  A player's note is private, shared with the other players only (hidden from the GM), or shared with everyone.
#   A4  By default the GM can read players' notes; per note a player can hide it from the GM or show it to the other players
#       only. The owner always sees their note. A player's private note: the GM reads it unless the player hid it. The GM's
#       own notes are private by default; the GM can share one into 'Shared by GM'. Everything is enforced on the server.
#   A5  The GM can share a note with chosen players (one or more, per note) besides everyone; it appears in 'Shared by GM' only
#       for the chosen players, server-enforced. Recipients are their own indexed table (journalPageRecipients), never an array
#       in the note (best-practices rule 6).
#
# Visibility model (from A2-A5; .omc/autopilot/d11-analysis.md section 3). journalPages.visibility, per page (a 'note' = a page
#   with its entries, OQ1):
#   player page: 'gm' (DEFAULT: owner + GM; in the GM's 'Shared by players' marked 'Private · GM can read', OQ2), 'private'
#                (owner only), 'players' (owner + other players, never the GM), 'everyone' (every member).
#   GM page:     'private' (DEFAULT: owner only), 'everyone' (every player; 'Shared by GM'), 'chosen' (only players with a
#                journalPageRecipients row for the page; 'Shared by GM' for them only).
#   A player may not set 'chosen' (OQ4 default no) and the GM may not set 'gm' / 'players': INVALID. Owner-is-GM comes from
#   ctx.permission (the wrapper's permissionFor result). Only the owner edits (OQ3). Entries follow their page.
#   permissionFor resource { type: 'journalPage', campaign, page }: owner -> owner; GM -> view for 'gm' | 'everyone'; player ->
#   view for 'players' | 'everyone', or 'chosen' with a recipient row (one point read on by_page_user); else null.
#   A page the caller may not read answers NOTE_PAGE_NOT_FOUND, exactly as a deleted one.
#
# OPEN QUESTIONS (full wording in .omc/autopilot/d11-analysis.md section 6; defaults pending user answer):
#   OQ1  A 'note' is (a) a page with its entries; (b) one entry. DEFAULT (a). Cited by N0, N6.
#   OQ2  Where the GM reads players' 'gm' pages: (a) in 'Shared by players', marked and grouped by player; (b) a separate
#        'Players' journals' tab. DEFAULT (a). Cited by N6.
#   OQ3  Editing someone else's shared note: (a) owner only, others read; (b) GM may edit readable player notes; (c) readers add
#        entries. DEFAULT (a). Cited by N0, N6.
#   OQ4  Players share with specific players: (a) no; (b) yes. DEFAULT (a) no. Cited by N0, N1, N6.
#   OQ5  Session log pages vs the Sessions tab: (a) board numbering, no link; (b) named after the live session. DEFAULT (a).
#        Cited by N1, N2.
#   OQ6  @links: (a) matched by name at render (board); (b) @ picker storing the entry id. DEFAULT (a). Cited by N1, N5.
#   OQ7  Bullet types, states and migration exactly as the board (six kinds; task open / done / migrated / scheduled / struck;
#        others open / resolved; migrate to the next page of the same kind or a new one; Hope / Fear are labels only):
#        (a) yes; (b) changes. DEFAULT (a). Cited by N1, N3.
#   OQ8  Player journal name: (a) '<active character>’s Journal' / 'Player journal · <class>', fallback account name / 'Player';
#        (b) account name. GM: 'Game Master’s Journal' / 'GM journal · private to the GM'. DEFAULT (a). Cited by N2.
#   OQ9  Export: (a) none in D11; D12 backup carries only the GM's own journal; (b) 'Download my journal'. DEFAULT (a). N7.
#   OQ10 Limits: (a) MAX_PAGES 200 per journal, MAX_PAGE_ENTRIES 300, MAX_JOURNAL_ENTRIES 5000, title 80 and entry 500
#        characters; recipients at most the campaign's players. DEFAULT (a). Cited by N0, N2, N3, N6.
#   OQ11 Tear out: (a) board (second click deletes for good, for every reader; animation + sound, none under reduced motion);
#        (b) + 10 s Undo; (c) 30-day bin. DEFAULT (a). Cited by N2.
#   OQ12 Player leaves / is removed: (a) pages kept, hidden from everyone, back on rejoin, purged with the campaign; (b) deleted.
#        DEFAULT (a). Cited by N0, N6.
#   OQ13 Search and open threads: (a) own journal only (board); (b) also readable shared pages. DEFAULT (a). Cited by N4.
#   OQ14 Telling the owner who can read: (a) the sharing chip always shows the state; (b) also a one-time notice to players.
#        DEFAULT (a). Cited by N6.
#
# Rules the board settles (binding; tracers quote the ones they implement in their task doc; line numbers in Notes.dc.html):
#   B1  Header (l.66-74): '<whoName>’s Journal', sub '<whoSub> · <N> pages · <M> entries', button '🧵 Open threads · N'
#       (aria-pressed, accent fill when on). Dropped: the 'Writing as' switcher (A2) and every PIN control (A1).
#   B2  Index (l.91-107): 'Search the journal'; groups 'Session logs' / 'Collections' / 'Future log', each with '＋' ('New session
#       log', 'New collection', 'New future page'); page button = tape tab, title, count ('N open', else entry count, else
#       nothing); empty 'Nothing here yet.' / 'No matches.'; the Quick keys card copy.
#   B3  Page (l.127-165): tape label with the title; title input; meta '<session log | collection | future log> · <date>';
#       '🎀 Tape' cycles 6 tapes; '➜ Migrate open tasks' (disabled without open tasks; tooltips 'Copy open tasks to “<t>” and
#       mark them > here' / 'Copy open tasks to a new page and mark them > here'); 'Tear out page' -> 'Click again to tear out';
#       empty lines per kind; KEY legend.
#   B4  Entries (l.139-157, 195-280): kinds task • / event ○ / note – / idea ! / Hope ✦ / Fear ☠ with the board's tooltips;
#       task states open -> done (×) -> migrated (>) -> scheduled (<) -> struck -> open; other kinds open <-> resolved
#       (struck); ★ priority; edit by ✎ or double-click (Enter saves, Escape cancels, blur saves); ↑ move up; × delete (no
#       confirm); add with the 'Bullet type' chips and 'Write a <kind> and press Enter… (@ to link)'; quick-key prefixes
#       '* . o - ! + ^' followed by a space.
#   B5  Open thread = an open task or an unresolved Fear entry. Threads view (l.111-120): tape 'Open threads', 'Every
#       unfinished task and every looming Fear, from all pages.', rows with '<page title> →', empty 'Nothing dangling.
#       Suspicious…'.
#   B6  Migrate (l.296-333): target = first page of the same kind created after this one, else a new page ('Session <n>' for
#       logs, '<title> (cont.)' otherwise); open tasks copied as new open entries, originals marked migrated; target opens.
#   B7  New pages (l.285): 'Session <log pages + 1>', 'New collection', 'Future log <n>'; tape = page count mod 6; opens.
#       Default pages: GM 'Session 1', 'Rumors & hooks', 'Loot & debts', 'Future log'; player 'Session 1', 'People we met',
#       'Clues & secrets', 'My goals' (tapes as in the board, l.223-224). New and default pages get the default visibility.
#   B8  @mentions (l.236-249): name match at render against Characters & Locations (longest full name, else first name of 2+
#       letters); tooltip = role, else 'Character' / 'Location'; players link only entries the GM made known.
#   B9  Search (l.251, 283): case-insensitive substring over titles and entry text; matching rows highlighted.
#
# Rules for every tracer (part of every acceptance list, not repeated):
#   - Every public function uses the wrappers in convex/lib/functions.ts: campaignQuery / campaignMutation /
#     keyedCampaignMutation with need 'view' (GM and players pass; outsiders NOT_FOUND, anonymous UNAUTHENTICATED). Own-journal
#     functions go through convex/lib/notes.ts loadOwnJournal / ensureJournal (found by (campaignId, ctx.user._id)); any read of
#     a page goes through permissionFor on the 'journalPage' resource (CF2); writes need 'owner' of the page (OQ3). No journal,
#     owner or user id of the caller ever comes from args (CF3, CF4); recipient user ids are validated as current players.
#   - A page or entry the caller may not read answers NOTE_PAGE_NOT_FOUND / NOTE_ENTRY_NOT_FOUND, exactly as a deleted one.
#   - `args` and `returns` validators on every new function, no v.any(); schema-guard RETURNS_PENDING never grows.
#   - Its own Convex test covers anonymous, outsider, player, a second player and GM for each new function, written as a table
#     (function x role -> expected code) so D12 can fold it into tests/convex/authz-matrix.test.ts (that file does not exist
#     yet); assertions use ConvexError.data.code (errorCode helper), never message text.
#   - Intents only: page ref + one field (renamePage = page + title; setVisibility = page + value; addRecipient = page + user;
#     cycle = entry id). The server computes next states with the N1 domain; the client never sends a page or entry snapshot.
#     Optimistic updates on bullet cycle, star, add, delete, move up, rename, tape and visibility, with updaters in
#     src/lib/optimistic/notes-<area>.ts.
#   - Indexed reads only (no .filter on queries); caps checked with counters on journals / journalPages, never .collect().length.
#   - A new error code is one N0 defines in src/lib/errors/notes.ts; a code N0 did not add means stop and report.
#   - No new dependency. Pure logic lives in src/lib/domain/notes (N1), used by server and client alike.
#   - Every useQuery subtree sits inside an error boundary; loading uses the shared Loading with role=status.
#   - UI in the board's look: tokens and classes from C/notes/notes.css (N0: bj-paper, bj-tape, bj-row, bj-bul, bj-text, bj-act,
#     bj-ib, bj-chip, bj-mention, bj-add, bj-edit, bj-key, bj-in, bj-ghost, bj-lbl; the accent from settings); each later tracer
#     adds CSS only in its own colocated .css. 390 px (the board has no mobile layout): one column, no horizontal page scroll,
#     touch targets >= 44 px, row actions visible on touch (pointer: coarse), labels on every control, keyboard reachable,
#     reduced motion respected, native <dialog> via src/components/brand/modal.tsx.
#   - Visual acceptance: the tracer's tests/e2e/visual/D11-<id>.spec.ts (tag @visual, E2E_VISUAL=1) shoots its regions at
#     1440x900 and 390x844; board counterparts from `node scripts/board-shots.mjs notes:<region>` (N0 adds them, 1440 only: the
#     board has no mobile layout, so 390 shots are judged against the 390 rules above; the Shared section and the sharing
#     control are not on the board and are judged against the board's tokens); the task doc docs/tasks/TASK-D11-<id>.md lists
#     both sets with a verdict per region and every deliberate deviation.
#   - pnpm lint (zero warnings in convex/), pnpm typecheck, pnpm test and the tracer's own e2e specs pass in its worktree; the
#     orchestrator runs the full e2e suite after each wave.
#
# Data model (N0 creates every table; later tracers only add functions). Widen only: no existing validator changes shape.
#   journals              campaignId, userId, pageCount, entryCount, openCount, createdAt, updatedAt. Indexes by_campaign_user
#                         [campaignId, userId], by_campaign (purge). One per (campaign, account) (A2).
#   journalPages          campaignId, journalId, ownerId, kind ('log' | 'collection' | 'future'), title, tape (0-5), visibility
#                         ('gm' | 'private' | 'players' | 'everyone' | 'chosen'), entryCount, openCount, createdAt, updatedAt.
#                         Indexes by_journal [journalId], by_campaign_visibility [campaignId, visibility], by_campaign (purge).
#   journalPageRecipients campaignId, pageId, userId, addedAt. Indexes by_page_user [pageId, userId], by_campaign_user
#                         [campaignId, userId], by_campaign (purge). The GM's chosen players (A5); rows exist only while the
#                         page is 'chosen'.
#   journalEntries        campaignId, journalId, pageId, kind ('task' | 'event' | 'note' | 'idea' | 'hope' | 'fear'), state
#                         ('open' | 'done' | 'migrated' | 'scheduled' | 'struck'), star, text, order, open (open task or
#                         unresolved Fear, B5), createdAt, updatedAt. Indexes by_page_order [pageId, order], by_journal_open
#                         [journalId, open], by_campaign (purge); search index search_text (text; filter journalId).
#   First open: no journal row -> notes.journal returns null + the N1 default templates; the first write carries a template ref
#   ({ template: i }) and ensureJournal creates the journal and its default pages (default visibility: player 'gm', GM
#   'private', A4) in that same mutation (CL6). Typed fields only: no blob, no schemaVersion. No table only grows (all purged
#   with the campaign, recipients and entries with their page), so no cron. grants is not used (analysis section 2).
#
# Shared files: convex/schema.ts, convex/lib/permissions.ts, convex/cleanup.ts, src/lib/errors/app-error.ts,
#   src/lib/convex-errors.ts, tests/convex/schema-guard.test.ts, tests/convex/cleanup.test.ts, tests/convex/permissions.test.ts,
#   scripts/board-shots.mjs belong to N0 only. C/notes/page.tsx belongs to N0, which mounts one stub per feature folder
#   (src/components/notes/{header,index-column,page,entries,threads,search,mentions,sharing,shared}/index.tsx) with typed props
#   from src/components/notes/slots.ts (campaignId, pageId, view ('page' | 'threads' | 'shared-players' | 'shared-gm'), search,
#   matchingPageIds, readOnly, onPage, onView, onSearch); the page keeps page and view in the URL (?page=<id>&view=...). N7 may
#   adjust C/notes/page.tsx and notes.css in wave 4. C/codex/page.tsx belongs to N5 (one ?entry= read, no other change).
#   docs/data-model.md is updated by the orchestrator. The static C/notes route replaces the [section] placeholder for Notes;
#   campaign-sections.ts is unchanged (Notes stays visible to players).
plan: d11-notes
waves:
  # ---------------------------------------------------------------- wave 1: foundation and pure domain, in parallel
  - wave: 1
    tracers:
      - id: N0
        foundation: true
        title: D11 foundation (tables, validators, error module, journalPage resource with the visibility model in permissionFor, purge, route shell with stubs, board shots)
        size: M
        goal: The notes tables exist and are purged with their campaign, permissionFor decides every journal-page read by the A2-A5 visibility model, the notes error codes and the loadOwnJournal / ensureJournal / resolvePage helpers are wired, and /campaigns/<id>/notes opens a board-look shell with stubs for GM and players alike.
        depends_on: []
        owns:
          - convex/schema.ts
          - convex/tables/notes.ts
          - convex/lib/validators/notes.ts
          - convex/lib/notes.ts
          - convex/lib/permissions.ts
          - convex/cleanup.ts
          - src/lib/errors/notes.ts
          - src/lib/errors/app-error.ts
          - src/lib/convex-errors.ts
          - src/app/(gm)/campaigns/[campaignId]/notes/page.tsx
          - src/app/(gm)/campaigns/[campaignId]/notes/error.tsx
          - src/app/(gm)/campaigns/[campaignId]/notes/notes.css
          - src/components/notes/slots.ts
          - src/components/notes/header/index.tsx
          - src/components/notes/index-column/index.tsx
          - src/components/notes/page/index.tsx
          - src/components/notes/entries/index.tsx
          - src/components/notes/threads/index.tsx
          - src/components/notes/search/index.tsx
          - src/components/notes/mentions/index.tsx
          - src/components/notes/sharing/index.tsx
          - src/components/notes/shared/index.tsx
          - scripts/board-shots.mjs
          - tests/convex/schema-guard.test.ts
          - tests/convex/cleanup.test.ts
          - tests/convex/permissions.test.ts
          - tests/convex/notes-lib.test.ts
          - tests/e2e/notes-shell.spec.ts
          - docs/tasks/TASK-D11-N0.md
        reads:
          - reference/designs/project/Notes.dc.html
          - .omc/autopilot/d11-analysis.md
          - convex/lib/functions.ts
          - convex/tables/files.ts
          - convex/tables/campaigns.ts
          - convex/tables/codex.ts
          - src/lib/campaign-sections.ts
          - src/app/(gm)/campaigns/[campaignId]/campaign-shell.tsx
          - src/app/(gm)/campaigns/[campaignId]/sessions/page.tsx
          - src/app/(gm)/campaigns/[campaignId]/[section]/page.tsx
          - tests/convex/helpers.ts
        acceptance:
          - "convex/tables/notes.ts defines journals, journalPages, journalPageRecipients, journalEntries with the fields, indexes and search index of the data model; convex/schema.ts composes them; caps (MAX_PAGES 200, MAX_PAGE_ENTRIES 300, MAX_JOURNAL_ENTRIES 5000, TITLE_MAX 80, TEXT_MAX 500; OQ10), kind / state / visibility validators and pageRefValidator (page id or { template: number }) live in convex/lib/validators/notes.ts"
          - "convex/lib/permissions.ts: Resource gains { type: 'journalPage'; campaign; page }; permissionFor: owner -> owner; GM -> view for player pages 'gm' | 'everyone' and nothing for 'private' | 'players'; player -> view for 'players' | 'everyone', or 'chosen' only with a journalPageRecipients row (by_page_user point read); else null; nobody but the owner gets edit (A3, A4, A5, OQ3)"
          - "tests/convex/permissions.test.ts covers the full matrix: every visibility value x {owner, GM, other player, chosen player, player not chosen, outsider}; a 'chosen' GM page is readable by the chosen player and not by a player who was not chosen; a player's 'players' page is readable by other players and not by the GM; a player's 'private' page by nobody but the owner; a GM 'private' page by no player"
          - "convex/lib/notes.ts: loadOwnJournal (by_campaign_user), ensureJournal (creates the journal and the caller's default pages from N1 defaults: GM template and visibility 'private' when ctx.permission is owner of the campaign, else the player template and 'gm'; B7, A4), resolvePage (own page id or template index; NOTE_PAGE_NOT_FOUND otherwise), loadReadablePage (permissionFor journalPage view; NOTE_PAGE_NOT_FOUND otherwise), loadOwnEntry (NOTE_ENTRY_NOT_FOUND), insertPage (NOTE_PAGE_LIMIT), deletePageRows (entries and recipients, bounded), bumpCounts (page and journal counters in the same mutation); tests/convex/notes-lib.test.ts covers each, including a second ensureJournal returning the existing journal"
          - "src/lib/errors/notes.ts defines every code D11 needs (at least NOTE_PAGE_NOT_FOUND, NOTE_ENTRY_NOT_FOUND, NOTE_PAGE_LIMIT, NOTE_PAGE_FULL, NOTE_JOURNAL_FULL, NOTE_NOTHING_TO_MIGRATE, NOTE_VISIBILITY_INVALID, NOTE_RECIPIENT_INVALID) and app-error.ts / convex-errors.ts combine them; no PIN code exists (A1)"
          - "purgeCampaign deletes every notes table's rows in bounded batches; schema-guard classifies the four tables as campaign-scoped; tests/convex/cleanup.test.ts covers it. Removing a player from the campaign leaves their journal (OQ12)."
          - "The page shows the board's hero (campaign name line, title and sub line slots, actions slot for the threads button), the index column (search slot, own-page groups slot, the Shared slot with the tabs 'Shared by players' / 'Shared by GM' (A2), the Quick keys card copy) and the paper column, driven by ?page and ?view; 1440: 300 px + fluid grid as the board; 390: one column; error.tsx (CL1); title 'Notes · <campaign>' (CL15); no PIN control anywhere (A1)"
          - "Every slot stub renders its section's empty frame with typed props from src/components/notes/slots.ts; each sits in its own error boundary"
          - "board-shots: notes:empty (GM default pages, empty Session 1), notes:page (seeded entries of every kind and state, a star, a mention), notes:threads, notes:search, notes:player (player default pages)"
          - "e2e notes-shell: the GM and a player each open Notes and see the shell with the two Shared tabs; an outsider gets the campaign not-found page"
      - id: N1
        title: Pure domain - bullets and states, quick keys, open threads, migration target, defaults and titles, visibility rules and labels, mentions parser, search match, header line
        size: S
        goal: A pure, tested TypeScript module answers every derived value the Notes board and the sharing control show, from plain page and entry rows.
        depends_on: []
        owns:
          - src/lib/domain/notes/**
          - tests/unit/notes-domain.test.ts
          - docs/tasks/TASK-D11-N1.md
        reads:
          - reference/designs/project/Notes.dc.html
          - .omc/autopilot/d11-analysis.md
        acceptance:
          - "bullets.ts: the six kinds with glyph, colour, label and the board's tooltips; glyphFor(kind, state); nextState (task: open -> done -> migrated -> scheduled -> struck -> open; others open <-> done); isStruck; bulletTip; isOpenThread (open task or unresolved Fear) - B4, B5; Hope / Fear are labels only (OQ7)"
          - "quick-keys.ts: parseQuickKey(text, selectedKind) -> { kind, text } for '* . o - ! + ^' followed by a space, trimmed; anything else keeps the selected kind - B4"
          - "migrate.ts: migrationTarget(pages, page) (first page of the same kind created later) and newContinuationTitle ('Session <n>' for logs, '<title> (cont.)' otherwise) - B6"
          - "defaults.ts: GM and player default pages with titles, kinds and tapes; newPageTitle(kind, pages) ('Session <log pages + 1>', 'New collection', 'Future log <n>') and newPageTape (page count mod 6) - B7, OQ5"
          - "visibility.ts: allowedVisibilities(isGm) (player: gm, private, players, everyone; GM: private, everyone, chosen; OQ4), defaultVisibility(isGm) (player 'gm', GM 'private'; A4), labels ('Private · GM can read', 'Private · hidden from the GM', 'Players only (hidden from the GM)', 'Everyone'; GM 'Private', 'Everyone', 'Chosen players') and sharedTab(page, gmId) ('players' | 'gm' | null) - A2-A5"
          - "mentions.ts: parseMentions(text, refs) -> parts (plain / link with ref id, kind, tooltip) with the board's longest-name and first-name rules - B8, OQ6"
          - "summary.ts: headerLine ('N pages · M entries'), pageCountLabel ('N open' / entry count / ''), pageMeta ('session log · <date>'), emptyLine per kind, matches(text, query) - B2, B3, B9"
          - "Unit tests cover every function above, including a full task-state cycle, a quick key without a following space, a migration with and without a later page, a mention of a first name followed by punctuation, and every allowed / refused visibility per owner type"

  # ---------------------------------------------------------------- wave 2: own journal + pages, entries, in parallel
  - wave: 2
    tracers:
      - id: N2
        title: Own journal and pages - default pages, new page, rename, tape, tear out, hero and index column
        size: M
        goal: Each person opens their own journal with the board's default pages, creates, renames, re-tapes and tears out pages, and sees the hero line and the index column with counts.
        depends_on: [N0, N1]
        owns:
          - convex/notes.ts
          - src/components/notes/header/**
          - src/components/notes/index-column/**
          - src/components/notes/page/**
          - src/lib/optimistic/notes-pages.ts
          - tests/convex/notes-pages.test.ts
          - tests/e2e/notes-pages.spec.ts
          - tests/e2e/visual/D11-N2.spec.ts
          - docs/tasks/TASK-D11-N2.md
        reads:
          - convex/lib/notes.ts
          - convex/lib/validators/notes.ts
          - convex/tables/notes.ts
          - convex/characters.ts
          - src/lib/domain/notes/index.ts
          - src/components/notes/slots.ts
          - reference/designs/project/Notes.dc.html
        acceptance:
          - "campaignQuery journal (returns validator): the caller's own journal: whoName / whoSub (GM 'Game Master' / 'GM journal · private to the GM'; player: active character's name and 'Player journal · <class>', else account name and 'Player'; OQ8), counts, pages (id, kind, title, tape, visibility, createdAt, entryCount, openCount) in created order; or { journal: null, templates } before the first write; never another person's pages"
          - "campaignMutation createPage (kind; title, tape and default visibility from N1; NOTE_PAGE_LIMIT past MAX_PAGES) returns the id; renamePage (page ref + title, 1-80 characters after trimming, INVALID otherwise); cycleTape (page ref); tearOutPage (page ref: deletes the page, its entries and recipients, fixes the journal counters; the page disappears for every reader too) - B3, B7, OQ10, OQ11"
          - "Each write accepts a template ref and creates the journal with its default pages in the same mutation (ensureJournal)"
          - "Role table in tests/convex/notes-pages.test.ts: anonymous UNAUTHENTICATED, outsider NOT_FOUND, player and GM succeed on their own journal; renaming, re-taping or tearing out someone else's page answers NOTE_PAGE_NOT_FOUND even when it is shared with the caller (owner-only edits, OQ3)"

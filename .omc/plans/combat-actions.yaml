          - src/lib/domain/adversaries/index.ts
          - src/lib/domain/combat-map/ranges.ts
          - src/lib/domain/combat-map/vision.ts
          - src/lib/domain/combat-map/sight.ts
          - src/lib/domain/dice/index.ts
          - src/lib/domain/characters/expiry.ts
          - src/lib/domain/card-effects/types.ts
          - src/lib/srd/adversary-resistance.ts
          - .omc/autopilot/combat-actions-analysis.md
        acceptance:
          - "tokenDistance counts squares between the nearest edges of two footprints (size 1-3), a diagonal = 1; rangeCheck returns the band and inRange, used as a warning only (Q1, CB p.103 quoted)"
          - "lineOfSight uses vision.los from the attacker's centre to any sample of the target footprint; cover between them returns disadvantage (Q2, CB p.104 quoted)"
          - "resolveHits(total, crit, targets) marks a target hit when total >= its Difficulty or on a critical (R1, CB p.96, p.90); one roll for all targets (R9)"
          - "applyDamageTo(target, amount, type) applies immunity, then resistance (halve, round down; both types needed for phy/mag), then thresholds 1/2/3 HP, none at 0 or less, no Massive; Minion targets are defeated and return extra-defeat counts per X; Stress over the track marks 1 HP (R3, R5, R10) - reusing encounters/damage.ts"
          - "cardAvailability(sheet, cardId) reads featureUses key card:<id> (until rest | longRest) and returns ready | exhausted with the reset label; 'on a success' limits are consumed only on success (Q3, Q4)"
          - "run(effect, context) returns an ordered plan (pay cost, roll, per-target outcome, self effects, tokens, manual prompts); spending Hope from the same roll is allowed (R8, CB p.90 quoted)"
          - "Every rule function cites its page in a comment and has a unit test whose expected values come from the book's own examples (CB p.98 Nolan 3d6+6 = 20; Rune crit 2d6+1 = 22; CB p.99 26 phy resisted = 13)"
          - "pnpm lint, typecheck and vitest pass; tracer-guard passes"
  # ---------------------------------------------------------------- wave 3: server attack + the ten domain tables (parallel)

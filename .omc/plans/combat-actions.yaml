    tracers:
      - id: CA1
        title: Combat engine and card-effect runner (pure)
        size: L
        goal: Pure functions decide range, line of sight, hit or miss per target, damage per target after resistance, HP or Stress marked (with Minion and Horde rules), once-per availability and costs, and turn a card effect plus a context into an ordered step plan.
        depends_on: [CA0, CA2]
        owns:
          - src/lib/domain/combat-actions/**
          - src/lib/domain/card-effects/run.ts
          - src/lib/domain/card-effects/availability.ts
          - tests/unit/combat-actions/**

        title: Map UI - attack bar, target picking, map dice box, mini feed, GM resolutions, mobile sheet
        size: L
        goal: On the Combat Map a player picks enemy tokens as targets, sees range and line-of-sight hints, attacks with a weapon, rolls free dice in a compact dice box whose rolls land in the shared feed, and the GM sees a Resolutions list with Undo; at phone width all of it lives in a bottom sheet.

          - convex/lib/rolls.ts
          - convex/combatActions.ts
          - convex/lib/combatActions.ts
          - convex/lib/actionLog.ts
          - tests/convex/combat-attack.test.ts
          - tests/convex/combat-attack-authz.test.ts
          - docs/tasks/TASK-CA-CA3.md
        reads:

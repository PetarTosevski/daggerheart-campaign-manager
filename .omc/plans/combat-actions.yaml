      - id: AA1
        title: Adversary-action engine and reaction window (pure)
        size: L
        goal: Pure functions roll an adversary attack against each target's Evasion, compute damage and the PC's severity from their thresholds, apply the Armor Slot step-down and direct damage, and run the reaction-window state machine that ends in the final HP / Stress / Armor marks.
        depends_on: [AA0, CA1]
        owns:
          - convex/lib/validators/encounters.ts
          - src/lib/domain/adversary-actions/**
          - src/lib/domain/adversary-effects/run.ts
          - tests/unit/adversary-actions/**
          - docs/tasks/TASK-CA-AA1.md
        reads:
          - src/lib/domain/adversary-effects/types.ts
          - src/lib/domain/card-effects/**
          - src/lib/domain/combat-actions/**
          - src/lib/domain/characters/index.ts
          - src/lib/domain/characters/derived.ts
          - src/lib/domain/encounters/**
          - src/lib/domain/adversaries/index.ts
          - src/components/adversaries/tracker/rules.ts
          - .omc/autopilot/combat-actions-analysis.md
        acceptance:
          - "adversaryAttack(atk, adv, experienceBonus, targets) rolls one d20 (two with advantage/disadvantage, keep high/low) for all targets; hit when total >= Evasion; a natural 20 always hits and crits (AR1, AR2, AR7; CB p.160, p.148, p.161 quoted)"
          - "Damage: stat-block dice with crit max + roll; Horde X once half the HP is marked; Minion Group Attack sums X per Minion in range (AR9, AR10; CB p.201, p.199)"
          - "pcSeverity(damage, thresholds) and the window plan: armor step-down by one threshold with one slot (not on direct damage, forced 'mark an Armor Slot without its benefit' handled), Stress overflow to HP, last HP flags a death move (AR3-AR5; CB p.91, p.114, p.99, p.92)"
          - "Reaction window: open(hit) lists responders (the target for armor; allies whose loadout has a card with a matching trigger and range); respond(armor | card | pass) folds in card outcomes such as redirectDamage and extraArmorSlots (I Am Your Shield, CB p.341); the window is complete when the target chose and every responder answered, or on resolveNow (Q13, Q17)"
          - "run(featureEffect, context) returns an ordered plan for actions, reactions and passives, including Fear and adversary-Stress costs and spotlight checks (AR6, AR8)"
          - "Unit tests take expected values from the book's examples (CB p.148: 2d8+2 crit with 5 and 7 = 30; CB p.114 Rune: Major with an Armor Slot = Minor)"
          - "pnpm lint, typecheck and vitest pass; tracer-guard passes"
  # ---------------------------------------------------------------- wave 4: card server, map UI, sheet once-per
  - wave: 4
    tracers:
      - id: CA4
        title: Server - use a domain card (costs, limits, rolls, targets, outcomes, tokens, manual steps)
        size: L
        goal: A player uses a loadout card from the map; the server checks the loadout and the once-per limit, pays Hope / Stress, rolls, applies damage, Stress and conditions to enemy instances and effects to self or allies, records the use, and logs public and GM rows that undo reverts.
        depends_on: [CA3]
        owns:
          - convex/combatCards.ts
          - convex/lib/cardRunner.ts
          - tests/convex/combat-cards.test.ts
          - tests/convex/combat-cards-authz.test.ts
          # ORCHESTRATOR NOTE 2026-10-22: the authz inventory guard is strict since H24/B6 - CA4 adds its matrix entries.
          - tests/convex/authz/combat.entries.ts
          - docs/tasks/TASK-CA-CA4.md
        reads:
          - convex/lib/combatActions.ts
          - convex/lib/rolls.ts
          - convex/lib/actionLog.ts
          - convex/characters.ts
          - src/lib/domain/card-effects/**
          - src/lib/domain/combat-actions/**
          - src/lib/srd/card-effects/**
          - .omc/autopilot/combat-actions-analysis.md
        acceptance:
          - "combatCards.hand {characterId}: the character's player and the GM (any character in the campaign) may read it; other players get FORBIDDEN (user answer 2026-10-22: the GM sees a selected PC's cards on the map); matrix entry and role tests"
          - "combatCards.useCard {characterId, mapId, cardId, spell?, targetTokenIds, choices} is a keyed campaign mutation (need edit); a card not in the loadout, out-of-combat, exhausted or unaffordable is refused with its code (CARD_NOT_IN_LOADOUT, CARD_NOT_COMBAT, CARD_EXHAUSTED, CARD_COST_UNPAID)"
          - "Hope and Stress costs are paid through the existing sheet helpers; Hope gained on the same roll can pay (R8); 'once per X' writes featureUses card:<id> with until rest | longRest, only on success for 'on a success' cards (Q3, Q4, R6)"
          - "Damage outcomes follow R2 (Proficiency / Spellcast trait count, crit max) and are applied with applyDamageTo; 'target marks N Stress' marks Stress with overflow to HP (R5); conditions set the instance condition; enemy reaction rolls are a server d20 vs the card's Difficulty, half or none on success as the card says (Q7, R12)"
          - "Self or ally effects become sheet effects with the card's until; tokens on the card update cardTokens; manual steps post a feed row 'Mira used <card>: <step text>' and need no server effect"
          - "The public row shows the roll, the damage total (Q5) and Hit / Miss / Defeated per target only (U1); the gm row shows the full resolution with adversaryBefore; actionLog undo restores everything including the featureUses entry and cardTokens (U4)"
          - "combatCards.hand {characterId} (need view on the character) returns the loadout and vault with per-card ready / exhausted / passive / outOfCombat state, reset label, tokens and recall cost; no enemy data"
          - "A table-driven test runs one card per domain from each CE table end to end against convex-test"
          - "combat-cards-authz.test.ts covers anonymous, outsider, player (own and other character) and GM for useCard and hand, asserting ConvexError.data.code"
          - "pnpm lint, typecheck and vitest pass; tracer-guard passes"

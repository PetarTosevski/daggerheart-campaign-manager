          - convex/lib/permissions.ts
          - convex/combatTokens.ts
          - convex/lib/combatVision.ts
          - convex/encounterTracking.ts
          - convex/lib/encounters.ts
          - convex/feed.ts
          - convex/actionLog.ts
          - src/lib/domain/combat-actions/**
          - src/lib/domain/dice/index.ts
          - .omc/autopilot/combat-actions-analysis.md
        acceptance:
          - "The duality and damage internals move from convex/rolls.ts to convex/lib/rolls.ts unchanged in behaviour (CF8); every existing rolls test passes untouched"
          - "combatActions.attack {characterId, mapId, targetTokenIds, slot, ...duality options} is a keyed campaign mutation with need edit on the character; the attacker is that character's PC token on the live map; targets must be enemy tokens linked to running encounter instances (else COMBAT_TARGET_INVALID)"
          - "No line of sight to a target refuses it with COMBAT_NO_LINE_OF_SIGHT (Q2); out of range is returned as a warning band, not refused (Q1)"
          - "One duality roll (Hope/Fear/crit effects, GM Fear, countdown ticks exactly as actionRoll); on any hit one damage roll at Proficiency with crit max (R2); each hit target takes the total through applyDamageTo; instances update hp/stress/defeated in the same mutation (U4)"
          - "One actionLog group: a public row whose summary and roll show the attack roll, the damage dice and total (Q5) and Hit / Miss / Defeated per target, with no HP, Stress, threshold or Difficulty value (U1); a gm row with damage, severity and HP marked per target, storing adversaryBefore"
          - "actionLog undo of the group (actor or GM) restores the sheet and every adversaryBefore row and takes back Fear; stale undo still refuses with UNDO_STALE (U4)"
          - "combatActions.targets {characterId, mapId} (need edit) returns for each visible enemy token only {tokenId, band, inRange, lineOfSight, cover}; its returns validator has no stat field (U1, CF6)"
          - "combatActions.pickMinions {entryId, instanceIds} lets the attacker defeat the extra Minions offered (within range, Difficulty beaten) once (Q6, CB p.201 quoted)"
          - "combat-attack-authz.test.ts covers anonymous, outsider, player (own and other character) and GM for attack, targets and pickMinions, asserting ConvexError.data.code"
          - "pnpm lint, typecheck and vitest pass; tracer-guard passes"

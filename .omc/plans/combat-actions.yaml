# Combat-actions plan: players hold their domain cards on the Combat Map and use them there, attack enemy tokens with weapon
# damage dice, roll dice from the map; enemies take the final damage against their thresholds (HP) or Stress automatically;
# once-per cards grey out until they come back.
# Status: APPROVED 2026-10-21. USER ANSWERS Q1-Q12 (binding): Q1 an attack or card use on a target outside its range needs the
#   GM's sanction (the action waits as a pending request; the GM approves or declines; nothing is rolled before approval);
#   Q2-Q11 the defaults below; Q12 adversary actions IN scope. Part B (adversary actions, tracers AA0-AA6 and AE-*) added
#   2026-10-21 with USER ANSWERS Q12-Q16; Q17-Q19 are open with defaults (Part B tracers that cite them wait for the answer).
# Former status: DRAFT. Analysis, inventory, quoted rules and QUESTIONS Q1-Q12:
#   .omc/autopilot/combat-actions-analysis.md. Defaults for open questions are written into acceptance lists and marked (Qn);
#   an answer that differs changes only the tracers that cite that Qn. Tracers do not start until the user has answered or
#   accepted the defaults.
# Format: docs/workflow.md. Extra keys per tracer (plan-check ignores them): title, size (S | M | L), foundation.
# Book pages: CB = Core Book, HF = Hope & Fear, PRINTED pages. In the extracted core.txt / hopefear.txt the "===== PAGE N ====="
#   block holds printed page N-1. Each tracer re-checks the pages it cites (.reference-private/, never commit the books) and
#   quotes them in its task doc.
# Paths: C = src/app/(gm)/campaigns/[campaignId] (written out in full below).
#
# USER ANSWERS (2026-10-21, binding; tracers quote the one they implement in their task doc):
#   U1  Players never see an enemy's HP, Stress or thresholds. They only learn hit or miss.
#   U2  Rolls made on the map also appear in the roll feed.
#   U3  Automate EVERY domain card usable in combat (196 of 210 by the analysis' classification; CA0 fixes the list), through a
#       per-card effect table split by domain so the domain tracers run in parallel.
#   U4  Damage applies automatically; the GM can undo it.
#   U5  Mechanics follow the book rules quoted in the analysis (R1-R12) wherever the book decides.
#
# Rules (binding; full quotes in the analysis section 2):
#   R1 attack vs Difficulty, one roll for all targets (CB p.96, p.193); crit counts as Hope success (CB p.90).
#   R2 damage = Proficiency x weapon dice + modifier; card dice "using your Proficiency / Spellcast trait"; crit = max dice + roll;
#      damage of one move is totalled before thresholds (CB p.98).
#   R3 Minor 1 / Major 2 / Severe 3 HP; 0 or less marks none (CB p.91); adversaries alike (CB p.193); Massive off for adversaries;
#      Minion (X) (CB p.201); Horde (X) (CB p.199).
#   R5 a full Stress track marks 1 HP instead (CB p.92).  R6 usage limits (CB p.101), rests (CB p.105).  R7 recall cost (CB p.101,
#      p.26).  R8 Hope features (CB p.90).  R9 multiple targets / groups (CB p.104).  R10 resistance / immunity (CB p.99).
#   R11 Defined Ranges and line of sight (CB p.103-104).  R12 adversary reaction rolls d20 (CB p.161).
#
# Defaults of open questions used below (analysis section 4): Q1 out-of-range needs GM sanction (user answer); Q2 line of sight required, cover gives
#   disadvantage; Q3 rest / long rest resets, shared featureUses keys card:<id>, session does not reset; Q4 "on a success" uses
#   only on success; Q5 player sees own damage total; Q6 player sees Defeated and picks extra Minions; Q7 server rolls enemy
#   reaction d20; Q8 SRD resistance table + GM toggle for conditional + custom picker; Q9 movement as prompts, manual steps
#   listed; Q10 no approval step, GM Resolutions list with Undo; Q11 mobile bottom sheet; Q12 adversary actions IN scope (user answer, Part B).
#
# PART B - adversary actions (analysis Part B; rules AR1-AR11 quoted there with printed pages):
#   AR1 d20 (+extra d20 for advantage/disadvantage) + ATK vs the PC's Evasion, Fear may add an Experience (CB p.160);
#   AR2 a natural 20 succeeds and crits: max dice + roll (CB p.148); AR3 PC thresholds 1/2/3 HP, last HP -> death move (CB p.91);
#   AR4 one Armor Slot per damage lowers severity one step, never on direct damage (CB p.114, p.99); AR5 Stress overflow to HP
#   (CB p.92), adversary Stress costs (CB p.194); AR6 Fear spends, spotlight, actions need the spotlight (CB p.153-154, p.194-195);
#   AR7 one roll vs every target (CB p.161), areas (CB p.196); AR8 reactions on triggers, no Fear unless stated (CB p.195);
#   AR9 Minion Group Attack, combined X damage (CB p.201); AR10 Horde X at half HP (CB p.199); AR11 PC reaction rolls (CB p.99).
# USER ANSWERS Part B (2026-10-21, binding):
#   Q12 "GM can use the encounter tab to use abilities, they will show up on combat, he can also use combat map if he wants".
#   Q13 The hit PC's player chooses whether to mark an Armor Slot; the damage waits for that choice. Allies may respond with
#       their abilities (e.g. "I Am Your Shield", CB p.341): a reaction window after each adversary hit, in which the target and
#       allies answer with eligible cards (closed vocabulary) before the damage resolves.
#   Q14 Players see that they were hit, not the attack roll. Decision (analysis B0): the hit PC's player sees the damage amount
#       and its severity against their own thresholds (they need it to choose armor); other players see only "X hit Y".
#   Q15 Automate EVERY adversary feature (267 SRD adversaries, 928 features; custom ones where structured), split by tier and
#       source into parallel tracers.
#   Q16 Fear and adversary control live on the Encounter tab with today's logic; the GM moves tokens, attacks, uses features and
#       spends Fear there, the visuals show on the Combat Map, and the map accepts the same GM actions.
# Open defaults Part B (analysis B4): Q17 the window resolves when the target chose armor and every eligible ally answered, or
#   on the GM's "Resolve now", no timer; Q18 without a live map the GM picks PCs from the party list, no range check; Q19 Fear is
#   spent only on an explicit GM tap (prompts for Fear features, extra spotlights, optional reactions), Momentum-style gains auto.
#
# Cross-plan sequencing (orchestrator): D12 H0 owns convex/schema.ts (AA0 waits for H0 or runs before it); D12 H21 owns
#   src/components/adversaries/**, adversaries/**, party/** and H22 owns src/components/combat-map/**, combat-map/**: every tracer
#   here owning files under those globs (CA0, CA5, CA6, CA7, AA3, AA4, AA5) runs before D12 wave 3 starts or after H21/H22 merge.
#   performance PF9 owns convex/characters.ts, which this plan only reads.
#
# In-flight tracers this plan avoids (2026-10-21): M1 (map-movement) owns src/components/combat-map/tokens/**,
#   map-view/{movement-overlay.tsx,paint-spec.ts,map-canvas.tsx}, src/lib/combat-map/painter.ts, src/lib/combat-map/sprites/**;
#   P10 (sprite-packs) owns e2e specs only; N9 (d11-notes) owns notes/page.tsx and notes.css. No tracer here owns those files.
#   CA5 and CA6 start only after M1 is merged (they read tokens/**). D12 owns tests/convex/authz-matrix.test.ts; the new public
#   functions are listed in the analysis section 6 for D12, and each tracer tests its own authz in its own test file.
#
# Shared files belong to CA0 only: convex/lib/validators/actionLog.ts, convex/lib/validators/characters.ts,
#   src/lib/validation/characters.ts, convex/lib/validators/encounters.ts, src/lib/errors/app-error.ts, src/lib/convex-errors.ts,
#   C/combat-map/page.tsx, src/components/combat-map/slots.ts, tests/convex/schema-guard.test.ts. docs/data-model.md is updated
#   by the orchestrator.
# ORCHESTRATOR NOTE (2026-10-21, from CA2's questions; follows Q15 'automate every adversary feature'): the AE-* tracers automate
#   Hydra's magic immunity after magic damage, Cult Adept's Shroud of the Fallen (resistance granted to an ally instance),
#   'takes double (magic|fire) damage' and the damage-halving reactions (Vampire Mistform, Flickerfly, Crimson Lepus) as features;
#   CA2's conditional entries stay as GM toggles only where the condition isn't trackable (underground, within stone, cloud form);
#   Phoenix's Smoldering Egg is a conditional entry on the same instance.
# USER ANSWERS Q17-Q19 (2026-10-21, binding): Q17 (a) the reaction window closes when the target chose armor and every eligible
#   ally answered Use/Pass; the GM can 'Resolve now' anytime; no timer. Q18 (a) with no live map the GM targets PCs from the party
#   list with no range or line-of-sight restrictions. Q19 (a) Fear spent only on the GM's tap; Fear-cost features and a second
#   spotlight ask first; optional ones are a one-tap prompt defaulting to No; Fear gains automatic. Plan status: APPROVED.
# ORCHESTRATOR NOTES (2026-10-21, from AA0):
#   - Open combatRequests are closed (status declined, resolvedAt set) when their encounter ends; AA2 owns that in its encounter-end
#     path, CA3 for sanctions on the map. No open-row sweep in the cron.
#   - Stat-block tokens ('Pool' etc.): AA1 also owns convex/lib/validators/encounters.ts for a widen-only optional `tokens` field on
#     encounter instances so those features can be automated.
#   - CA3 also owns convex/lib/validators/combatRequests.ts for widen-only edits if its attack args differ from AA0's stored shape.
plan: combat-actions
waves:
  # ---------------------------------------------------------------- wave 1: foundation, resistance table
  - wave: 1
    tracers:
      - id: CA0
        foundation: true
        title: Combat-actions foundation (widened validators, error codes, effect vocabulary types, card classification, empty domain tables, stub slots)
        size: M
        goal: The actionLog row can carry the adversaries' before-state for undo, the sheet can carry tokens on cards, encounter instances and custom adversaries can carry resistances; the combat-actions error codes exist; the card-effect vocabulary types and an empty per-domain registry exist; every one of the 210 cards is classified combat / passive / out-of-combat; the Combat Map page mounts the actions stubs.
        depends_on: []
        owns:
          - convex/lib/validators/actionLog.ts
          - convex/lib/validators/characters.ts
          - convex/lib/validators/encounters.ts
          - src/lib/validation/characters.ts
          - src/lib/errors/combatActions.ts
          - src/lib/errors/app-error.ts
          - src/lib/convex-errors.ts
          - src/lib/domain/card-effects/types.ts
          - src/lib/srd/card-effects/index.ts
          - src/lib/srd/card-effects/classification.ts
          - src/lib/srd/card-effects/arcana.ts
          - src/lib/srd/card-effects/blade.ts
          - src/lib/srd/card-effects/bone.ts
          - src/lib/srd/card-effects/codex.ts
          - src/lib/srd/card-effects/grace.ts
          - src/lib/srd/card-effects/midnight.ts
          - src/lib/srd/card-effects/sage.ts
          - src/lib/srd/card-effects/splendor.ts
          - src/lib/srd/card-effects/valor.ts
          - src/lib/srd/card-effects/dread.ts
          - src/app/(gm)/campaigns/[campaignId]/combat-map/page.tsx
          - src/components/combat-map/slots.ts
          - src/components/combat-map/actions/index.tsx
          - src/components/combat-map/actions/attack/index.tsx
          - src/components/combat-map/actions/hand/index.tsx
          - src/components/combat-map/actions/dice/index.tsx
          - src/components/combat-map/actions/targets/index.tsx
          - src/components/combat-map/actions/gm/index.tsx
          - src/components/combat-map/actions/adversary/index.tsx
          - src/components/combat-map/actions/reactions/index.tsx
          - tests/convex/schema-guard.test.ts
          - tests/unit/card-classification.test.ts
          - docs/tasks/TASK-CA-CA0.md
        reads:
          - .omc/autopilot/combat-actions-analysis.md
          - src/lib/srd/domain-cards.ts
          - src/lib/srd/types.ts
          - convex/lib/actionLog.ts
          - src/lib/domain/characters/expiry.ts
          - convex/tables/encounters.ts
          - src/components/combat-map/**
          - docs/best-practices.md
        acceptance:
          - "actionLog rows accept an optional adversaryBefore list ({instanceId, hp, stress, defeated, minionCount?}); existing rows still validate (widen only, rule 7)"
          - "The sheet validator accepts optional cardTokens [{cardId, count}]; encounterAdversaries and customAdversaries accept optional resistance {physical, magic: none|resistant|immune} and a conditional flag (Q8); old rows read back unchanged"
          - "src/lib/errors/combatActions.ts defines COMBAT_TARGET_INVALID, COMBAT_NO_LINE_OF_SIGHT, CARD_NOT_IN_LOADOUT, CARD_EXHAUSTED, CARD_NOT_COMBAT, CARD_COST_UNPAID, COMBAT_NOT_YOUR_CHARACTER, wired into AppErrorCode and the client message map"
          - "card-effects/types.ts defines the closed vocabulary from the analysis section 3.1 (costs, limit incl. onSuccess, roll, targets, per-hit outcomes, self/ally effects, tokens, manual, passive) with no any; it also has triggers for reaction cards (whenAllyWouldTakeDamage, whenYouWouldTakeDamage, whenAttacked, afterAllyRolls) and outcomes redirectDamage (become the target) and extraArmorSlots, so 'I Am Your Shield' (CB p.341) is expressible (Q13)"
          - "classification.ts lists all 210 card ids as combat | passive | outOfCombat; a unit test checks the count matches DOMAIN_CARDS and that the 14 out-of-combat cards of the analysis are listed (the task doc lists every card for the user to review)"
          - "The ten per-domain files export empty readonly arrays; index.ts merges them into a map by card id"
          - "The Combat Map page mounts ActionsPanel from actions/index.tsx in the player column, Resolutions and AdversaryPanel (actions/adversary) in the GM column and IncomingHit (actions/reactions) for players (stubs render nothing harmful); slots.ts documents the new slots"
          - "pnpm lint, typecheck and vitest pass; tracer-guard passes"
      - id: CA2
        title: Adversary resistance table from stat-block text
        size: S
        goal: Every SRD adversary whose feature text grants an always-on resistance or immunity has a typed entry; conditional ones are flagged for the GM toggle.
        depends_on: []
        owns:
          - src/lib/srd/adversary-resistance.ts
          - tests/unit/adversary-resistance.test.ts
          - docs/tasks/TASK-CA-CA2.md
        reads:
          - src/lib/srd/adversaries.ts
          - src/lib/srd/types.ts
          - .omc/autopilot/combat-actions-analysis.md
        acceptance:
          - "ADVERSARY_RESISTANCE maps adversary id to {physical, magic: none|resistant|immune, conditional?: string} for every feature text with 'resistan' or 'immune' to damage (CB p.99 quoted); 'immune to abilities … thoughts' and 'double damage from fire' are excluded and listed in the task doc"
          - "A unit test fails when an SRD feature mentions resistance or immunity to damage without a table entry or an explicit exclusion"
          - "pnpm lint, typecheck and vitest pass; tracer-guard passes"
  # ---------------------------------------------------------------- wave 2: pure engine and effect runner
  - wave: 2
    tracers:
      - id: CA1
        title: Combat engine and card-effect runner (pure)
        size: L
        goal: Pure functions decide range, line of sight, hit or miss per target, damage per target after resistance, HP or Stress marked (with Minion and Horde rules), once-per availability and costs, and turn a card effect plus a context into an ordered step plan.
        depends_on: [CA0, CA2]
        owns:
          - src/lib/domain/combat-actions/**
          - src/lib/domain/card-effects/run.ts
          - src/lib/domain/card-effects/availability.ts
          - tests/unit/combat-actions/**
          - tests/unit/card-effects/run.test.ts
          - docs/tasks/TASK-CA-CA1.md
        reads:
          - src/lib/domain/encounters/damage.ts
          - src/lib/domain/adversaries/index.ts
          - src/lib/domain/combat-map/ranges.ts
          - src/lib/domain/combat-map/vision.ts
          - src/lib/domain/combat-map/sight.ts
          - src/lib/domain/dice/index.ts
          - src/lib/domain/characters/expiry.ts
          - src/lib/domain/card-effects/types.ts
          - src/lib/srd/adversary-resistance.ts
          - .omc/autopilot/combat-actions-analysis.md
        acceptance:
          - "tokenDistance counts squares between the nearest edges of two footprints (size 1-3), a diagonal = 1; rangeCheck returns the band and inRange, used by the server to route out-of-range actions to GM sanction (Q1, CB p.103 quoted)"
          - "lineOfSight uses vision.los from the attacker's centre to any sample of the target footprint; cover between them returns disadvantage (Q2, CB p.104 quoted)"
          - "resolveHits(total, crit, targets) marks a target hit when total >= its Difficulty or on a critical (R1, CB p.96, p.90); one roll for all targets (R9)"
          - "applyDamageTo(target, amount, type) applies immunity, then resistance (halve, round down; both types needed for phy/mag), then thresholds 1/2/3 HP, none at 0 or less, no Massive; Minion targets are defeated and return extra-defeat counts per X; Stress over the track marks 1 HP (R3, R5, R10) - reusing encounters/damage.ts"
          - "cardAvailability(sheet, cardId) reads featureUses key card:<id> (until rest | longRest) and returns ready | exhausted with the reset label; 'on a success' limits are consumed only on success (Q3, Q4)"
          - "run(effect, context) returns an ordered plan (pay cost, roll, per-target outcome, self effects, tokens, manual prompts); spending Hope from the same roll is allowed (R8, CB p.90 quoted)"
          - "Every rule function cites its page in a comment and has a unit test whose expected values come from the book's own examples (CB p.98 Nolan 3d6+6 = 20; Rune crit 2d6+1 = 22; CB p.99 26 phy resisted = 13)"
          - "pnpm lint, typecheck and vitest pass; tracer-guard passes"
      - id: AA0
        foundation: true
        title: Adversary-actions foundation (combatRequests table, cleanup cron, error codes, adversary effect vocabulary types, empty per-group tables)
        size: M
        goal: The combatRequests table holds GM sanctions (Q1) and incoming hits waiting in a reaction window (Q13) and is swept by a cron; the adversary-actions error codes exist; the adversary effect vocabulary types and an empty registry of eight tier/source tables exist.
        depends_on: [CA0]
        owns:
          - convex/schema.ts
          - convex/tables/combatRequests.ts
          - convex/lib/validators/combatRequests.ts
          - convex/cleanup.ts
          - convex/crons.ts
          - src/lib/errors/adversaryActions.ts
          - src/lib/errors/app-error.ts
          - src/lib/convex-errors.ts
          - src/lib/domain/adversary-effects/types.ts
          - src/lib/srd/adversary-effects/index.ts
          - src/lib/srd/adversary-effects/t1-core.ts
          - src/lib/srd/adversary-effects/t1-hf.ts
          - src/lib/srd/adversary-effects/t2-core.ts
          - src/lib/srd/adversary-effects/t2-hf.ts
          - src/lib/srd/adversary-effects/t3-core.ts
          - src/lib/srd/adversary-effects/t3-hf.ts
          - src/lib/srd/adversary-effects/t4-core.ts
          - src/lib/srd/adversary-effects/t4-hf.ts
          - tests/convex/schema-guard.test.ts
          - tests/convex/cleanup.test.ts
          - tests/unit/adversary-effects-types.test.ts
          - docs/tasks/TASK-CA-AA0.md
        reads:
          - .omc/autopilot/combat-actions-analysis.md
          - src/lib/domain/card-effects/types.ts
          - src/lib/srd/adversaries.ts
          - src/lib/srd/types.ts
          - convex/tables/actionLog.ts
          - docs/best-practices.md
        acceptance:
          - "combatRequests {campaignId, encounterId?, mapId?, kind: sanction | incomingHit, status: open | resolved | declined, createdBy, payload (typed union, no v.any), responses[], resolvedAt?} with indexes by_campaign_status and by_status_resolved; schemaVersion on the payload (rule 7)"
          - "An internal, batched, self-rescheduling cron deletes resolved / declined rows older than a day (rule 8); purgeCampaign removes the campaign's rows; cleanup tests cover both"
          - "src/lib/errors/adversaryActions.ts defines ADVERSARY_NOT_SPOTLIT, ADVERSARY_FEATURE_UNAVAILABLE, NOT_ENOUGH_FEAR, REQUEST_NOT_OPEN, NOT_A_RESPONDER, wired into AppErrorCode and the client message map"
          - "adversary-effects/types.ts reuses the card vocabulary's outcome steps and adds costs (spend N Fear, mark N adversary Stress), needsSpotlight, reaction triggers (onDamaged, onHit, onMarkHp, allyDealtDamage, onDefeated), passives as modifiers (resistance, attack bonus, hordeX, minionX, relentless), group attack, summon prompt, countdown prompt, manual; no any"
          - "The eight tier/source files export empty readonly arrays; index.ts maps adversary id to its feature effects"
          - "pnpm lint, typecheck and vitest pass; tracer-guard passes"
  # ---------------------------------------------------------------- wave 3: server attack + the ten domain tables (parallel)
  - wave: 3
    tracers:
      - id: CA3
        title: Server - weapon attacks on enemy tokens with automatic damage and undo
        size: L
        goal: A player attacks one or more enemy tokens from their PC token with a weapon; the server rolls, decides hit or miss per target, rolls damage, marks HP on the encounter instances, and writes a public feed row (hit or miss only) and a GM row (damage, severity, HP) that the existing undo reverts.
        depends_on: [CA1, AA0]
        owns:
          - convex/lib/validators/combatRequests.ts
          - convex/rolls.ts
          - convex/lib/rolls.ts
          - convex/combatActions.ts
          - convex/lib/combatActions.ts
          - convex/lib/actionLog.ts
          - convex/combatRequests.ts
          - convex/lib/combatRequests.ts
          - tests/convex/combat-attack.test.ts
          - tests/convex/combat-attack-authz.test.ts
          - docs/tasks/TASK-CA-CA3.md
          # ORCHESTRATOR NOTE 2026-10-22: follow-up after the first commit - matrix entries, encounter-end close, docs.
          - tests/convex/authz/combat.entries.ts
          - convex/encounters.ts
          - convex/tables/combatRequests.ts
          - docs/data-model.md
        reads:
          - convex/lib/functions.ts
          - convex/lib/permissions.ts
          - convex/combatTokens.ts
          - convex/lib/combatVision.ts
          - convex/encounterTracking.ts
          - convex/lib/encounters.ts
          - convex/feed.ts
          - convex/actionLog.ts
          - src/lib/domain/combat-actions/**
          - src/lib/domain/dice/index.ts
          - .omc/autopilot/combat-actions-analysis.md
        acceptance:
          - "The duality and damage internals move from convex/rolls.ts to convex/lib/rolls.ts unchanged in behaviour (CF8); every existing rolls test passes untouched"
          - "combatActions.attack {characterId, mapId, targetTokenIds, slot, ...duality options} is a keyed campaign mutation with need edit on the character; the attacker is that character's PC token on the live map; targets must be enemy tokens linked to running encounter instances (else COMBAT_TARGET_INVALID)"
          - "No line of sight to a target refuses it with COMBAT_NO_LINE_OF_SIGHT (Q2); an out-of-range target turns the action into a pending GM-sanction request (Q1): the GM approves (then it resolves as normal) or declines; nothing is rolled or charged before approval; role tests for request, approve, decline; requests are combatRequests rows (kind sanction); combatRequests.sanction {requestId, approve} (GM) and combatRequests.mine (the player's open requests) exist"
          - "One duality roll (Hope/Fear/crit effects, GM Fear, countdown ticks exactly as actionRoll); on any hit one damage roll at Proficiency with crit max (R2); each hit target takes the total through applyDamageTo; instances update hp/stress/defeated in the same mutation (U4)"
          - "One actionLog group: a public row whose summary and roll show the attack roll, the damage dice and total (Q5) and Hit / Miss / Defeated per target, with no HP, Stress, threshold or Difficulty value (U1); a gm row with damage, severity and HP marked per target, storing adversaryBefore"
          - "actionLog undo of the group (actor or GM) restores the sheet and every adversaryBefore row and takes back Fear; stale undo still refuses with UNDO_STALE (U4)"
          - "combatActions.targets {characterId, mapId} (need edit) returns for each visible enemy token only {tokenId, band, inRange, lineOfSight, cover}; its returns validator has no stat field (U1, CF6)"
          - "combatActions.pickMinions {entryId, instanceIds} lets the attacker defeat the extra Minions offered (within range, Difficulty beaten) once (Q6, CB p.201 quoted)"
          - "combat-attack-authz.test.ts covers anonymous, outsider, player (own and other character) and GM for attack, targets and pickMinions, asserting ConvexError.data.code"
          - "pnpm lint, typecheck and vitest pass; tracer-guard passes"
      - id: CE-arcana
        title: Card effects - Arcana (21 cards)
        size: M
        goal: Every combat or passive Arcana card from classification.ts has an effect entry that the runner can execute; whatever the vocabulary cannot express is a manual step with a note.
        depends_on: [CA1]
        owns:
          - src/lib/srd/card-effects/arcana.ts
          - tests/unit/card-effects/arcana.test.ts
          - docs/tasks/TASK-CA-CE-arcana.md
        reads:
          - src/lib/domain/card-effects/**
          - src/lib/srd/card-effects/classification.ts
          - src/lib/srd/domain-cards.ts
          - .omc/autopilot/combat-actions-analysis.md
        acceptance:
          - "Every Arcana card classified combat or passive has exactly one entry; a test fails on a missing or extra id"
          - "Each entry quotes its card text in a comment; its test runs the effect through run() with a fixed RNG and checks costs, limit, roll, targets and outcomes against the text"
          - "The task doc lists every manual step and every ruling the text leaves open (Q9) for the user; a bead is filed for each vocabulary gap; the vocabulary types are not changed"
          - "pnpm lint, typecheck and vitest pass; tracer-guard passes"
      - id: CE-blade
        title: Card effects - Blade (21 cards)
        size: M
        goal: Every combat or passive Blade card from classification.ts has an effect entry that the runner can execute; whatever the vocabulary cannot express is a manual step with a note.
        depends_on: [CA1]
        owns:
          - src/lib/srd/card-effects/blade.ts
          - tests/unit/card-effects/blade.test.ts
          - docs/tasks/TASK-CA-CE-blade.md
        reads:
          - src/lib/domain/card-effects/**

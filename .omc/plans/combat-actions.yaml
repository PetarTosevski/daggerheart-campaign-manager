          - "The public row shows the roll, the damage total (Q5) and Hit / Miss / Defeated per target only (U1); the gm row shows the full resolution with adversaryBefore; actionLog undo restores everything including the featureUses entry and cardTokens (U4)"
          - "combatCards.hand {characterId} (need view on the character) returns the loadout and vault with per-card ready / exhausted / passive / outOfCombat state, reset label, tokens and recall cost; no enemy data"

# Combat-actions plan: players hold their domain cards on the Combat Map and use them there, attack enemy tokens with weapon
# damage dice, roll dice from the map; enemies take the final damage against their thresholds (HP) or Stress automatically;
# once-per cards grey out until they come back.
# Status: DRAFT: QUESTIONS pending user answer. Analysis, inventory, quoted rules and QUESTIONS Q1-Q12:
#   .omc/autopilot/combat-actions-analysis.md. Defaults for open questions are written into acceptance lists and marked (Qn);
#   an answer that differs changes only the tracers that cite that Qn. Tracers do not start until the user has answered or
#   accepted the defaults.
# Format: docs/workflow.md. Extra keys per tracer (plan-check ignores them): title, size (S | M | L), foundation.
# Book pages: CB = Core Book, HF = Hope & Fear, PRINTED pages. In the extracted core.txt / hopefear.txt the "===== PAGE N ====="
#   block holds printed page N-1. Each tracer re-checks the pages it cites (.reference-private/, never commit the books) and
#   quotes them in its task doc.
# Paths: C = src/app/(gm)/campaigns/[campaignId] (written out in full below).
#
# USER ANSWERS (2026-10-21, binding; tracers quote the one they implement in their task doc):
#   U1  Players never see an enemy's HP, Stress or thresholds. They only learn hit or miss.
#   U2  Rolls made on the map also appear in the roll feed.
#   U3  Automate EVERY domain card usable in combat (196 of 210 by the analysis' classification; CA0 fixes the list), through a
#       per-card effect table split by domain so the domain tracers run in parallel.
#   U4  Damage applies automatically; the GM can undo it.
#   U5  Mechanics follow the book rules quoted in the analysis (R1-R12) wherever the book decides.
#
# Rules (binding; full quotes in the analysis section 2):
#   R1 attack vs Difficulty, one roll for all targets (CB p.96, p.193); crit counts as Hope success (CB p.90).
#   R2 damage = Proficiency x weapon dice + modifier; card dice "using your Proficiency / Spellcast trait"; crit = max dice + roll;
#      damage of one move is totalled before thresholds (CB p.98).
#   R3 Minor 1 / Major 2 / Severe 3 HP; 0 or less marks none (CB p.91); adversaries alike (CB p.193); Massive off for adversaries;
#      Minion (X) (CB p.201); Horde (X) (CB p.199).
#   R5 a full Stress track marks 1 HP instead (CB p.92).  R6 usage limits (CB p.101), rests (CB p.105).  R7 recall cost (CB p.101,
#      p.26).  R8 Hope features (CB p.90).  R9 multiple targets / groups (CB p.104).  R10 resistance / immunity (CB p.99).
#   R11 Defined Ranges and line of sight (CB p.103-104).  R12 adversary reaction rolls d20 (CB p.161).
#
# Defaults of open questions used below (analysis section 4): Q1 range warns only; Q2 line of sight required, cover gives
#   disadvantage; Q3 rest / long rest resets, shared featureUses keys card:<id>, session does not reset; Q4 "on a success" uses
#   only on success; Q5 player sees own damage total; Q6 player sees Defeated and picks extra Minions; Q7 server rolls enemy
#   reaction d20; Q8 SRD resistance table + GM toggle for conditional + custom picker; Q9 movement as prompts, manual steps
#   listed; Q10 no approval step, GM Resolutions list with Undo; Q11 mobile bottom sheet; Q12 adversary attacks out of scope.
#
# In-flight tracers this plan avoids (2026-10-21): M1 (map-movement) owns src/components/combat-map/tokens/**,
#   map-view/{movement-overlay.tsx,paint-spec.ts,map-canvas.tsx}, src/lib/combat-map/painter.ts, src/lib/combat-map/sprites/**;
#   P10 (sprite-packs) owns e2e specs only; N9 (d11-notes) owns notes/page.tsx and notes.css. No tracer here owns those files.
#   CA5 and CA6 start only after M1 is merged (they read tokens/**). D12 owns tests/convex/authz-matrix.test.ts; the new public
#   functions are listed in the analysis section 6 for D12, and each tracer tests its own authz in its own test file.
#
# Shared files belong to CA0 only: convex/lib/validators/actionLog.ts, convex/lib/validators/characters.ts,
#   src/lib/validation/characters.ts, convex/lib/validators/encounters.ts, src/lib/errors/app-error.ts, src/lib/convex-errors.ts,
#   C/combat-map/page.tsx, src/components/combat-map/slots.ts, tests/convex/schema-guard.test.ts. docs/data-model.md is updated
#   by the orchestrator.

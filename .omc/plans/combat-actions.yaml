        acceptance:
          - "Starts after M1 is merged. A player taps or clicks an enemy token (vision-layer's selection) to add it as a target; selected targets get a ring drawn by actions/targets (own overlay, not map-canvas); each shows its band and 'Out of range' or 'No line of sight' / 'Cover: disadvantage' from combatActions.targets (Q1, Q2)"
          - "The Attack bar shows the primary and secondary weapon with damage at Proficiency (e.g. '2d8+3 phy'), the duality options of the sheet dice box (experiences, advantage, help), and fires combatActions.attack once per click with an optimistic 'Rolling…' state (rule 12)"
          - "The result shows the duality dice, the outcome, the damage total and Hit / Miss / Defeated per target, never HP or thresholds (U1, Q5); a Minion offer opens the pick dialog (Q6)"

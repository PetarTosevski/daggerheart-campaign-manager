        title: Server - weapon attacks on enemy tokens with automatic damage and undo
        size: L
        goal: A player attacks one or more enemy tokens from their PC token with a weapon; the server rolls, decides hit or miss per target, rolls damage, marks HP on the encounter instances, and writes a public feed row (hit or miss only) and a GM row (damage, severity, HP) that the existing undo reverts.

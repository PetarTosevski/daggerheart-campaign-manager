          - "convex/lib/actionLog.ts logAction(...) and undoEntry(...); convex/actionLog.ts `undo` (keyedUserMutation, returns validator): the actor or the GM undoes a row only while it is the latest un-undone undoable row of each character in its group (else UNDO_STALE); it restores each `before` through readSheet, reverts fearDelta through revertFear (floor 0, history action \"undo\") and sets undoneAt"
          - "tests/convex/action-log.test.ts: undo happy path, stale row, Fear floor at 0, group undo across two characters, a player cannot undo another player's row or a GM row, and anonymous/outsider/player/GM results"
          - "Error modules (as const): actionLog (UNDO_STALE, CHARACTER_UNAVAILABLE), dice, levelUp, rests, death, wither, classFeatures, photoImport, each with at least its *_RULE code; AppErrorCode includes keyof each module and convex-errors merges them (convex-errors unit test: no code defined twice)"

        acceptance:
          - "Pure resolver (injectable RNG) in src/lib/domain/dice: 2d12 + trait + modifiers against Difficulty; matching dice = critical success, +1 Hope and clear 1 Stress; Hope higher = +1 Hope; Fear higher = GM +1 Fear (CB 94-95); Hope capped at hopeMax"
          - "An Experience costs 1 Hope and adds its value, also on reaction rolls (CB 90; settled rule); reaction rolls give no Hope or Fear and allow no help (CB 99); advantage and disadvantage cancel one for one to a single d6, Help an Ally adds advantage dice and keeps the highest (CB 100); crit damage = maximum dice value + the roll (CB 98); weapon damage rolls Proficiency-many weapon dice (CB 109 Proficiency) plus hook weaponOverrides and rollOptions"
          - "rolls.actionRoll, rolls.damageRoll and rolls.manualRoll (keyedUserMutation, rateLimit roll, loadCharacter edit, assertCanAct): server dice from convex/lib/dice.ts (manual rows store typed values and are marked manual), Fear through gainFear, one public actionLog row with before and fearDelta, returns the roll"
          - "rolls.tagTeam: 3 Hope, once per session per player (featureUses key tagTeam until session), two rolls and one result for both; with Hope every involved PC gains Hope, with Fear the GM gains 1 Fear per involved PC (CB 97); logged on both characters in one group"
          - "rolls.gmRoll (keyedGmMutation) writes a visibility gm row; rolls.reveal (gmMutation) makes it public; feed.list (campaignQuery need view, enough owner, paginated, returns union) serves players only by_campaign_visibility_at public and the GM by_campaign_at; feed.test proves a player's direct API call never returns a gm row"
          - "UI: the dice box in the sheet slot (trait, modifier, Difficulty, Experience, advantage and disadvantage steppers, reaction, damage with crit), hook prompts from afterDualityRoll rendered generically, the roll feed on the dashboard with Undo for the roller and the GM, a per-device 3D toggle and sound saved in localStorage (try/catch), and an animation seam dice/dice3d/index.ts that T1b fills (no three import in T1)"
          - "tests/unit/dice.test.ts covers the outcome matrix; tests/convex/rolls.test.ts: a player's Fear roll raises GM Fear, a reaction roll does not, undo reverts Hope, Stress and Fear, an unconscious character gets CHARACTER_UNAVAILABLE"

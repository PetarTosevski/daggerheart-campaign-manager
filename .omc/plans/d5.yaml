        acceptance:
          - "Dependencies: three@0.160.0, cannon-es@0.20.0 and @types/three (matching 0.160) are installed under minimumReleaseAge; nothing imports them yet"
          - "convex.config.ts declares ANTHROPIC_API_KEY and ANTHROPIC_MODEL as optional env; RATE_LIMITS gains `roll` (token bucket, 60 per minute, capacity 120) and `photoImport` (10 per hour, decision 14: one call per click)"
          - "convex/tables/actionLog.ts: actionLog {campaignId, characterId?, actorId, kind (roll|gmRoll|feature|levelUp|rest|death|wither|session|import), visibility (public|gm), summary <= 300 chars, roll? (typed: kind action|reaction|damage|free, dice [{sides, value, role hope|fear|advantage|disadvantage|help|extra|damage, dropped?}], modifier, total, difficulty?, outcome critical|successHope|successFear|failHope|failFear|none, manual), groupId?, before? (stored sheet as a string), fearDelta?, undoable, undoneAt?, undoneBy?, at}; indexes by_campaign_at [campaignId, at] (GM feed, purge), by_campaign_visibility_at [campaignId, visibility, at] (player feed), by_character_at [characterId, at] (undo, character feed), by_campaign_group [campaignId, groupId] (group undo)"
          - "convex/tables/rests.ts: rests {campaignId, kind short|long, status open|finished|interrupted, startedBy, startedAt, finishedAt?, gmOverride?, fearRoll?, fearGained?, groupId?} with by_campaign_status_started [campaignId, status, startedAt] (the open rest) and by_campaign_started [campaignId, startedAt] (short rests since the last long rest); restChoices {campaignId, restId, characterId, moves (at most 2: move literal, targetId?, countdownId?), updatedBy, updatedAt} with by_rest_character [restId, characterId] and by_campaign [campaignId]"

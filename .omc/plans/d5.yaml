# D5 plan: level-up, dice and roll feed, Hope/class features, rests, death moves, Wither, equipment tiers, photo import.
# Format: docs/workflow.md. Binding: docs/best-practices.md, AGENTS.md, docs/decisions-d3-d11.md ("D5 decisions (defaults,
#   2026-10-18)" and "Rules settled from the books"), which override .omc/autopilot/d5-spec.md wherever they differ.
#
# Extra keys per tracer (plan-check ignores them): title, size (S | M | L), timing:
#   core       = D5 gameplay; starts as soon as its depends_on are merged.
#   polish     = can slip to the end of D5 without blocking anything (3D dice).
#   end-of-D5  = built last on purpose (photo import, decision "build at end of D5").
# Book pages: CB = Core Book (printed page = PDF page), HF = Hope & Fear interactive PDF page. Each tracer re-checks the text
#   of the pages it cites (.reference-private/, extract with pdfjs-dist, never commit the books) and quotes them in its task doc.
# Every tracer also owns docs/tasks/TASK-D5-<id>.md. The orchestrator updates docs/data-model.md at merge time from the
#   tracer's report, regenerates convex/_generated, and closes beads (dcm-mf7, dcm-bxp.13, dcm-bxp.14) after the user confirms.
# Paths: C = src/app/(gm)/campaigns/[campaignId] (written out in full below); sheet folder = C/party/[characterId].
#
# Rules for every tracer (part of every acceptance list, not repeated):
#   - Every new public function is built with the wrappers in convex/lib/functions.ts (userQuery/userMutation/
#     keyedUserMutation/campaignQuery/gmQuery/keyedGmMutation/userAction), authorizes only through permissionFor (campaign
#     wrappers' `need`, or loadCharacter(ctx, ctx.user, id, need) from convex/lib/characterSheet.ts), and declares `args` and
#     `returns` validators with no v.any() (tests/convex/schema-guard.test.ts: RETURNS_PENDING only shrinks, so new
#     mutations need `returns` too).
#   - Its own Convex test covers anonymous, outsider, player and GM for each new function (H25 folds them into
#     tests/convex/authz-matrix.test.ts after D5) and asserts ConvexError.data.code, never message text.
#   - Server-enforced visibility: GM free rolls are visible only to the GM until revealed; player character rolls are public.
#     Characters that are dead, away (Castle High) or unconscious cannot roll or use features (decision 9): the server
#     refuses with CHARACTER_UNAVAILABLE, and the UI disables the buttons.
#   - Every automated state change writes an actionLog row through convex/lib/actionLog.ts, and is undoable unless the
#     tracer's acceptance says otherwise. Fear gained goes through gainFear (convex/lib/fear.ts), so `history` keeps the
#     Fear trail, and undo goes through revertFear.
#   - A new error code goes into the tracer's own src/lib/errors/<domain>.ts (`as const`); T0 wires those modules into
#     AppErrorCode and src/lib/convex-errors.ts, so no tracer after T0 edits either file.
#   - A sheet field T0 did not add means stop and report to the orchestrator; only T0 (wave 1) and T9 (wave 3) edit
#     src/lib/validation/characters.ts.
#   - pnpm lint (zero warnings in convex/), pnpm typecheck, pnpm test and the tracer's own e2e spec pass in its worktree.
#
# Shared files: package.json, pnpm-lock.yaml, convex/convex.config.ts, convex/schema.ts, convex/lib/functions.ts
#   (RATE_LIMITS), src/lib/convex-errors.ts, src/lib/errors/app-error.ts and tests/convex/schema-guard.test.ts belong to T0
#   only. eslint.config.mjs needs no D5 change; if a tracer finds it does, the orchestrator edits it at merge.
# Hotspots and how T0 defuses them:
#   - Sheet page files: T0 mounts one slot component per feature in sheet.tsx and page-one.tsx; each slot is a stub in
#     src/components/party/<feature>/ that receives typed SlotProps (src/components/party/slots.ts: campaignId, character
#     view, canEdit, isGm, hopeAndFear), so feature tracers own only their folder. After T0, page-one.tsx and page-three.tsx
#     belong to T6 alone (equipment picker, subclass ranks) and damage-calculator.tsx to T5 alone (Withered source).
#   - Dashboard (C/page.tsx), party card (src/components/party/party-card.tsx) and roster (C/party/page.tsx, roster.tsx):
#     T0 mounts the roll feed, rest launcher, session buttons, card badges, "Party levels up" and photo-import slots once.
#   - convex/characters.ts: T0 moves readSheet/storedSheet/saveSheet/loadCharacter/editable into
#     convex/lib/characterSheet.ts; after that only T5 (wave 2, applyDamage) and T9 (wave 3, Motherboard draft, moveCard)
#     edit characters.ts.
#   - Class features: T0 creates the hook contract (src/lib/domain/class-features/types.ts, hooks.ts, empty registry in
#     index.ts). Dice, rests and sessions call the hooks; T8a fills the registry with 13 class files; T8b and T8c each own
#     a disjoint set of class files.
#
# Changed or dropped from .omc/autopilot/d5-spec.md because of the hardening work:
#   1. Package 0's `characterLog` becomes `actionLog`, a table of its own, NOT an extension of `history`, because:
#      (a) `history` is a GM-only audit trail (history.list is a gmQuery) of Fear, countdowns and time, while the feed is
#      read by players and needs a per-row visibility (GM free rolls hidden) with its own index; (b) undo needs sheet
#      snapshots and roll dice, which do not belong in history's small typed before/after union; (c) every roll writes a
#      row, so the feed's volume would swamp the audit trail. Fear changes made by rolls, rests or undo still write
#      `history` rows through gainFear/revertFear. GM free rolls have no characterId, so the table is not named per character.
#   2. The spec's untyped `payload` and `before` become a typed `roll` object plus `summary`, and `before` is the stored
#      sheet serialized as a string, restored through readSheet, so a later SHEET_VERSION bump cannot invalidate old log
#      rows (a v.object snapshot would fail schema validation of existing rows on the next narrow).
#   3. `levelHistory[].before` snapshots are dropped: the sheet keeps a small `advancements` list (at most 9) and
#      level undo inverts the latest advancement (dcm-mf7), so rolls made after the level-up are not reverted.
#   4. The `rests.picks` map keyed by character id becomes a `restChoices` table (CD6: ids are fields, never keys; CD10:
#      each player writes their own row). `campaignState.shortRestsSinceLong` is dropped; it is derived from the `rests`
#      index.
#   5. `classState` discriminated per class becomes generic sheet lists with an `until` field (`effects`, `heldDice`,
#      `featureUses`) plus a small flat `classState`, so rests and session end expire them through one pure function
#      (src/lib/domain/characters/expiry.ts) without class-specific code.
#   6. `curses` (Weredragon) is dropped from D5; the Weredragon tracker owns curses.
#   7. `convex/lib/characterAccess.ts` is named convex/lib/characterSheet.ts; loadCharacter already authorizes through
#      permissionFor since H11. The `validateEquipment` extraction is dropped: T6 is the only page-one editor in wave 2.
#   8. `@anthropic-ai/sdk` is dropped: the photo-import action calls the Messages API with fetch (no new dependency, CH11).
#   9. The spec's wave-3 "integration agent" is dissolved: each tracer owns its e2e spec, the orchestrator runs the full
#      suite after each wave, and closes beads at merge.
#  10. Advantage follows the settled rule (cancel one for one, then a single d6; Help an Ally adds dice and keeps the
#      highest), not the spec's "up to 3 dice".
#  11. Simplified, with follow-up beads filed by the tracer: Blaze of Glory records a narrated critical success and then
#      death (no auto-crit flag inside the dice box); Druid Evolution is an effect with an End button (no beastform-panel
#      link); Age of Umbra's Strength of Hate damage bonus is deferred (its last-slot scar uses the journey-ends flag,
#      labelled "succumbed"); rest undo restores sheets and Fear only, while countdown ticks and frame-tracker changes
#      keep their own history and controls.
#  12. Added: moveCard's `duringRest` flag is client-trusted today; T9 checks it against the open rest.
# Open questions (none block the plan):
#   - actionLog grows with play and its `before` snapshots are the bulk. It is campaign-scoped like `history`; whether to
#     strip snapshots older than 7 days by cron is a follow-up decision (T0 files a bead).
#   - Horizon questions (dcm-bxp.20) stay open; T3b implements only the book's rest rules for Horizon (HF 176-179).
plan: d5

      - id: T2
        title: Level-up engine and stepper, including dcm-mf7
        timing: core
        size: L
        goal: After the GM flags the party, each owner levels up their character through a stepper with two picks per level, achievements, trait marks, domain card and optional trade, can undo the latest level repeatedly, and the GM can correct a level directly.
        depends_on: [T0]
        owns:

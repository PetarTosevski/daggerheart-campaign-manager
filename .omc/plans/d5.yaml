        title: Server dice, manual entry and the roll feed (2D)
        timing: core
        size: L
        goal: A player rolls Duality or damage dice from the sheet (or types in physical dice, marked manual), the server rolls and applies Hope, Fear, crits and Stress, every member sees the roll in the dashboard feed, GM free rolls stay hidden until revealed, and the roller or GM can undo.

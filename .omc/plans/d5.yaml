          - "Domain card option and the level's card: level or lower from the class domains, up to level 4 in tier 2 and 7 in tier 3; the multiclass domain up to half the level rounded up; optional trade of one card for one of equal or lower level (CB 110-111; settled rule)"
          - "Upgraded subclass moves subclassRank foundation -> specialization -> mastery and crosses out that tier's multiclass; multiclass from level 5, once, class feature only (no second Hope feature), crosses out mastery and the other multiclass option (CB 110-111; settled rule)"
          - "levelUp.apply (keyedUserMutation, loadCharacter edit; requires levelUpPending unless the caller is GM) raises the level by one, appends one advancement and clears the flag; levelUp.undoLast (owner or GM) reverts the latest advancement and is repeatable (decision 4); levelUp.correctLevel (GM) sets the level with no automation; levelUp.partyLevelUp (keyedGmMutation) flags every active, non-away character (decision 5, CB 109); each writes a public actionLog row with undoable false (level undo is its own path)"
          - "UI: stepper in the level-up slot (achievements, two picks, pickers, card and trade, summary), the tier grid as read-only history (board :1949), a pending badge on the party card and roster, and the GM \"Party levels up\" button"

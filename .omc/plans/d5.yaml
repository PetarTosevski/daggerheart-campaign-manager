          - "schema.ts composes the new tables; schema-guard classifies actionLog, rests and restChoices as campaign-scoped, and convex/cleanup.ts purges them by campaignId index (cleanup test proves it); no prefix-duplicate index"
          - "Sheet fields, all optional or defaulted so stored version-2 sheets parse unchanged (no SHEET_VERSION bump) and mirrored in sheetValidator: hopeSlotBonus 0..1 (hope max widens to 7, dcm-bxp.14), subclassRank foundation|specialization|mastery (CB 110), multiclass? {classId, domainId, subclassId} (CB 110-111), advancements (at most 9: level, picks, cardId, tradeOut?, tradeIn?, experienceId?), levelUpPending, conditions (vulnerable|restrained|hidden|cloaked|unconscious|distracted), effects (at most 20: id, source, text, until rest|longRest|session|hit|scene|manual, mods? evasion|attack|damage|trait), heldDice (at most 20: id, kind rally|prayer|patron|combo, sides, value?, until session|longRest|manual, fromCharacterId?), featureUses (at most 20: key, until rest|longRest|session), classState (flat optional fields from the spec's section C table), wither (0..99, no per-PC cap, CB 261), journeyEnds (CB 106)"
          - "tests/unit/sheet-d5-fields.test.ts: a stored version-2 sheet without the new fields parses with their defaults, round-trips through storedSheet, and passes characterViewValidator"
          - "Domain: hopeMax = 6 + hopeSlotBonus - scars and applyResourceDelta caps Hope at it (CB 20 Hope slots; dcm-bxp.14); clearing a Hit Point removes `unconscious` (CB 106, Avoid Death); expiry.ts expire(sheet, shortRest|longRest|session|hit) removes effects, heldDice and featureUses by `until` (CB 105 rests refresh rest features); effects.ts withEffects(sheet) adds effect mods to evasion, attack and traits without changing base stats; duality.ts dualityOutcome(hope, fear) gives critical on matching dice, else hope or fear by the higher die (CB 94-95)"

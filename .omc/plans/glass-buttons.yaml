# Glass buttons plan (2026-11-04): roll the user's "Arcane Glass Buttons" design (reference/designs/buttons/arcane-glass.html)
# out to every page outside the Combat HUD, which already uses it (commit 6d1d2929, src/components/brand/glass-button.*,
# hudButtonClass in src/components/combat-map/hud/ui/popup.tsx). Bead dcm-q861 ("Button overhaul part 2").
# Briefs, inventory, role map, risks and the open questions: .omc/plans/glass-buttons-briefs.md.
# Format: docs/workflow.md. Extra keys (plan-check ignores them): title, size, batch, mode, conditional.
#
# START: wave 1 starts only after the journal plan's JX2 is merged into rebuild. JX1 / JX2 own campaign-shell.tsx,
# campaign-sections.ts, wither-panel.tsx, the /sessions and /notes routes and many specs, and JX2 deletes
# src/components/sessions/** (except session-chip.tsx). Nothing here touches src/components/sessions/** but session-chip.tsx.
#
# Waves: 1 the foundation (brandButton becomes glass, the viewer is set once in the campaign shell); 2 every page area in
# parallel (owns never overlap; launch in batches of at most 5, see the briefs); 3 the clean-up and the full checks.
#
# Rules for every tracer (details in the briefs):
#   - Built on the briefs' recommended answers (Qn). A tracer whose acceptance names a question is rewritten by the
#     orchestrator first if the user picks another option. G14 and G15 (character sheets) run only if the user answers
#     Q3 (b); with the default (a) they are skipped.
#   - Roles come from the briefs' role map: the main action = confirm, back out = cancel, removes or ends something =
#     danger, the GM's answer to a player's request = allow / deny, settings and everything without a side = neutral,
#     toolbar icons = tool, the roll toggle = normal / advantage / disadvantage.
#   - Use brandButton / BrandButton (src/components/brand/buttons.tsx) for every action button; glassButtonClass only
#     where a class string is needed outside React props. No new hand-styled button classes. Delete the CSS classes your
#     area no longer uses (in your own .css files).
#   - Do not restyle: the HUD (src/components/combat-map/hud/**), the card face (hero-card, card-dialog, .hc-face),
#     tokens, banners and map art, HP / Stress / Hope pips, page tabs (role=tab), list rows that open something, and
#     plain text links. These keep their look (design: "out of scope").
#   - 44 px targets at 1024x768, 768x1024 and 390x844; axe clean in both viewers and in the hovered state; motion off
#     under prefers-reduced-motion.
#   - Every UI tracer writes tests/e2e/visual/GLASS-<ID>.spec.ts (runs with E2E_VISUAL=1): GM and player shots at
#     1440x900, 1024x768 and 390x844, plus one hovered confirm and one keyboard-focused button; copies them to
#     /mnt/c/Users/Petar/Downloads/dcm-screens/glass-<id>/ (id in lower case, e.g. glass-g3).
plan: glass-buttons
waves:
  # ------------------------------------------------------------------ wave 1: foundation
  - wave: 1
    tracers:
      - id: G0
        title: "Foundation: brandButton draws the glass button, the viewer is set once per campaign, 44 px on touch"
        goal: "Every BrandButton / brandButton in the app renders as an arcane glass button with no call-site edit (variant mapped to a role), new explicit roles exist for the area tracers, and every page inside a campaign knows its viewer (data-viewer gm / player on the campaign shell), so confirm and cancel take the right colours; the HUD looks exactly as before"
        size: M
        mode: replace
        depends_on: []
        owns:
          - src/components/brand/buttons.tsx
          - src/components/brand/glass-button.ts
          - src/components/brand/glass-button.css
          - src/components/brand/viewer.tsx
          - src/components/brand/modal.tsx
          - src/app/(gm)/campaigns/[campaignId]/campaign-shell.tsx
          - tests/unit/brand/**
          - tests/unit/hud/glass-button.test.ts
          - tests/e2e/glass-foundation.spec.ts
          - tests/e2e/visual/GLASS-G0.spec.ts
          - docs/tasks/TASK-GLASS-G0.md
        reads:
          - reference/designs/buttons/arcane-glass.html
          - src/components/combat-map/hud/ui/popup.tsx
          - src/components/combat-map/hud/ui/ui.css
          - src/components/combat-map/hud/shell.tsx
          - src/app/globals.css
          - tests/e2e/a11y.ts
          - tests/e2e/visual/helpers.ts
          - .omc/plans/glass-buttons-briefs.md
        acceptance:
          - "brandButton keeps its signature (variant, size, className) and returns glass classes: primary -> confirm (lg), solid -> confirm, outline -> neutral, pill -> neutral (shape per Q8), danger and dangerSolid -> danger; sizes sm -> gb-sm, md -> 44 px, lg and xl -> gb-lg; a unit test covers the whole table; typecheck passes with no call-site edit"
          - "New variants for the area tracers: confirm, cancel, neutral, tool, danger, allow, deny, normal, advantage, disadvantage, plus an icon (44 x 44) and a round option; the old names stay as aliases until GZ"
          - "Viewer: the campaign shell's root element carries data-viewer='gm' for the GM and 'player' for everyone else (Q1); outside a campaign there is no attribute and the player's colours apply (Q2); src/components/brand/viewer.tsx gives portalled content (createPortal to body) the same attribute from useCampaign(); Modal (native dialog, stays inside the shell) inherits it; Modal's close X becomes a round cancel icon button"
          - "Touch: a small glass button is 44 px tall at max-width 1100 px or pointer coarse; labels that can wrap are not clipped (min-height, wrapping allowed) where brandButton is used; a call site's layout classes (w-full, self-start, ml-auto, flex-1) still apply (the cascade choice is written in the task doc)"
          - "HUD unchanged: hud-shell, hud-tablet, hud-phone, hud-result, hud-answers, hud-dock specs pass and tests/unit/hud/glass-button.test.ts passes; HUD shots before / after in the task doc"
          - "tests/e2e/glass-foundation.spec.ts: on the dashboard the same confirm button has a Hope rim for a player and a Fear rim for the GM; a hovered confirm and a focused button pass axe; reduced motion has no transition; a11y-smoke, a11y-entry, a11y-signin pass"
          - "GLASS-G0 visual shots (sign-in, main menu, dashboard as GM and as player, at 1440x900, 1024x768, 390x844) copied to /mnt/c/Users/Petar/Downloads/dcm-screens/glass-g0/"

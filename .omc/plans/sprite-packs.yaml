        goal: pnpm sprites:build cuts the user's 60 sheets into trimmed, keyed, resized, content-hashed WebP sprites and seam-fixed terrain swatches under public/sprite-packs, writes the built-in manifest, and leaves a review report with a contact sheet per sheet; the result is committed (sprites + manifest, never the raw sheets) after the user has seen the contact sheets.

          - src/app/(gm)/campaigns/[campaignId]/combat-map/packs/page.tsx
          - src/app/(gm)/campaigns/[campaignId]/combat-map/packs/error.tsx
          - src/components/combat-map/slots.ts
          - src/components/combat-map/style/index.tsx
          - src/components/combat-map/packs/index.tsx

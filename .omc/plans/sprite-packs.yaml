          - "Review report sprite-sheets/_out/report.html: per sheet a contact sheet on a checkerboard (index, name, size, sight, light, the app shadow preview) and per terrain a 3 x 3 tiled preview; flags count mismatches, border touches, removed grid lines, fringe scores and low tileability, and prints a summary; every flag from P2's known issues is either fixed or listed with the override that resolves it"
          - "scripts/sprite-packs/build-pack.ts (pnpm sprites:build): writes public/sprite-packs/<setting>/<slug>.<hash8>.webp (objects at SPRITE_PX_PER_SQUARE 160 px per square side, textures 512 px per TEXTURE_SQUARES), and src/lib/sprite-packs/builtin/manifest.ts (schemaVersion 1); rerunning with --setting rebuilds only that setting and keeps keys (D8)"
          - "tests/unit/sprite-builtin-pack.test.ts: the manifest passes P1's schema, every catalog item has a file (or is listed as missing in the task doc), every file exists and is referenced, each object WebP <= 80 KB and texture <= 200 KB, public/sprite-packs <= 24 MB in total, no file under sprite-sheets/ is tracked"

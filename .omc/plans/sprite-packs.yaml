          - "gmQuery settings (campaign): built-in settings plus the campaign's packs that are settings of their own, and for packs that extend a built-in setting, the setting they add to (Q3)"
          - "campaignQuery spriteSources (map id): style, resolved setting, and the uploaded sprites the map can use (GM: the setting's extending packs and every ref on the map, with traits and getUrl links) or, for a player, only the live map and only the uploaded sprites it references (D10); built-in sprites come from the static manifest on the client"
          - "convex/lib/spriteSources.ts: resolveRefs(ctx, refs) loads uploaded rows by id (bounded by MAX_COMBAT_OBJECTS + MAX_TEXTURE_PALETTE distinct ids), unknown or deleted refs resolve to null (D9)"
          - "convex/lib/combatVision.ts passes VisionTraits for sprite objects into prepareMap (P3), so playerView, previewAs and toggleLight follow the manifest; P1's traits type is assignable to P3's VisionTraits (compile-time check)"
          - "Tests: a sprite wall section hides a token behind it for the player, a sprite pool does not, a deleted uploaded sprite falls back to its classic kind, a player cannot read spriteSources of a non-live map, the read-cost of spriteSources and playerView on a 300-object map stays within the C1 budget"


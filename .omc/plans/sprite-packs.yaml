        acceptance:
          - "convex/lib/validators/combatMaps.ts gains spriteRefValidator, settingRefValidator, mapStyleValidator; combatMapFields gain style?, setting?, settingPicked?, texturePalette?; combatAreaValidator gains texture?; combatObjectFields gain sprite?; cellLayerValidator gains \"texture\" (widen only, schemaVersion stays 1, E3)"
          - "convex/tables/spritePacks.ts defines spritePacks and spritePackSprites with the fields and indexes in the data model; validators and caps (MAX_SPRITE_PACKS, MAX_PACK_SPRITES, MAX_TEXTURE_PALETTE, MAX_SPRITE_BYTES, MAX_SPRITE_PX, name caps, size 1..4) live in convex/lib/validators/spritePacks.ts; files.kind gains \"sprite\""
          - "src/lib/errors/spritePacks.ts defines every code the plan needs (at least SPRITE_PACK_NOT_FOUND, SPRITE_PACK_LIMIT, SPRITE_NOT_FOUND, SPRITE_LIMIT, SPRITE_UNKNOWN for a built-in key not in the manifest, SPRITE_SETTING_UNKNOWN, SPRITE_PALETTE_FULL) and convex-errors combines them; upload rejections reuse the existing attach codes"
          - "RATE_LIMITS gains spriteUpload (token bucket 200 per hour, capacity 64: one sheet is up to 16 uploads)"
          - "convex/combatMaps.ts (get / live / list) and convex/combatVision.ts return the new fields (widened returns validators); duplicate copies style, setting, settingPicked, texturePalette, area textures, object sprites and texture cells (E8); tests/convex/sprite-fields.test.ts writes rows with every new field and reads them back through each query, and shows a D9 row without them still reads (E3, E4)"
          - "purgeCampaign deletes spritePacks, spritePackSprites and their sprite files; tests/convex/cleanup.test.ts covers it"
          - "package.json: devDependency sharp pinned to the version already in node_modules (Q5), scripts sprites:cut and sprites:build pointing at scripts/sprite-packs/ (P4 fills them); how the scripts run TypeScript is decided and documented (Node 24 type stripping, with tsconfig allowImportingTsExtensions only if needed)"
          - "next.config.ts serves /sprite-packs/* with Cache-Control public, max-age=31536000, immutable (files are content-hashed, D8)"
          - "slots.ts documents StyleSwitch (P6) and PacksLink (P8) props; the page mounts them in their own error boundaries; the packs route renders a GM-only shell (players are sent back to the Combat Map; the server functions refuse them anyway); tests/e2e/sprite-packs-shell.spec.ts covers GM and player"

      - id: P1
        title: Pure catalog - settings, per-item traits from the prompts doc, mapping tables, keyword setting picker, sprite traits
        size: M
        goal: A pure, tested module names every built-in setting and every sprite the prompts doc asks for, with its size, sight, light, shadow height, footprint and Classic fallback, maps Classic kinds and terrains to each setting's sprites and textures, picks a setting from a description by keywords, and resolves a sprite ref to the traits the vision engine needs.
        depends_on: []
        owns:
          - src/lib/sprite-packs/index.ts
          - src/lib/sprite-packs/settings.ts
          - src/lib/sprite-packs/manifest.ts
          - src/lib/sprite-packs/catalog/**
          - src/lib/sprite-packs/mapping.ts
          - src/lib/sprite-packs/pick-setting.ts
          - src/lib/sprite-packs/traits.ts
          - tests/unit/sprite-catalog.test.ts
          - docs/tasks/TASK-SP-P1.md
        reads:
          - docs/sprite-packs/prompts.md
          - src/lib/domain/combat-map/spec.ts
          - src/lib/domain/combat-map/sight.ts
          - src/lib/domain/combat-map/light.ts
          - src/lib/combat-map/fallback-layout.ts
        acceptance:
          - "settings.ts: the 19 built-in settings (id = folder name, label) plus common, which is never offered as a setting (D7)"
          - "catalog/<folder>.ts per folder (20 files): props (16), large (9), terrain (4) in the prompts doc's grid order; each entry has key (D8), name, sheet, index, w x h (D4), sight (D3), light (Q1 default list), height (D5), footprint, classic {kind, variant?} (D2); textures add terrain class and rotatable (D6)"
          - "tests/unit/sprite-catalog.test.ts parses docs/sprite-packs/prompts.md and asserts each catalog list equals the doc's list in order (the cutter labels sprites by this order), keys are unique, every light sprite's classic kind is a light kind with the same reach and no other sprite maps to a light kind (D2), sizes are within 1..4"
          - "mapping.ts: per setting, Classic kind -> candidate sprite keys and Classic terrain -> texture keys (setting first, then common); pickSprite(kind, variant, setting, objectId, seed) and pickTexture(terrain, setting, x, y, seed) are deterministic; a kind or terrain with no candidate returns null (the painter draws it Classic, D1)"
          - "pick-setting.ts: keyword scorer over the description (and map name), mirroring fallback-layout's keyword families (forest, snow, swamp, coast, cave, dungeon, ship, tavern, temple, ...); no match gives grassland-and-road (D7); unit tests for ten descriptions"
          - "manifest.ts: zod schema of the generated built-in manifest (schemaVersion 1; per sprite key, file, px size, variants, seam score) and a lookup joining it with the catalog; an empty manifest is valid (P4 fills it)"
          - "traits.ts: spriteTraits(ref, lookup) -> {sight, light, height, footprint, w, h} for built-in keys (catalog) and uploaded rows (passed in); a structural type compatible with P3's VisionTraits (P5 checks assignability)"
          - "The task doc tables every sight, light, size and height assignment for the user to review (D3, D4, Q1)"

      - id: P2
        title: Pure cut core - magenta keying, defringe, grid-line removal, cell finding, trimming, terrain swatches
        size: M
        goal: A pure, tested module turns an RGBA sheet buffer into labelled-order sprite cuts with clean transparent edges (props 4x4, large 3x3, single sprites) or into four terrain swatches, and reports what it had to fix, coping with JPEG fringes, drawn grid lines, an extra object, an object touching the border and an uneven grid.
        depends_on: []
        owns:
          - src/lib/sprite-packs/cut/**
          - tests/unit/sprite-cut.test.ts
          - tests/fixtures/sprite-sheets/**
          - docs/tasks/TASK-SP-P2.md
        reads:
          - docs/sprite-packs/prompts.md
        acceptance:
          - "Works on a plain {width, height, data: Uint8ClampedArray} buffer, no Node or DOM imports, so the offline script (sharp) and the browser (canvas ImageData, P8) share it"
          - "key.ts: magenta distance key with a soft alpha ramp (tolerant of JPEG noise), despill of magenta from edge pixels, 1 px alpha erosion; also accepts sheets that are already transparent (GM uploads)"
          - "lines.ts: removes thin drawn grid lines (long, few px thick, spanning most of the sheet; grassland-and-road/large) before cell finding"
          - "cells.ts: finds sprites by row and column bands of the non-background mask (works for uneven grids, dungeon/large), unions fragments inside one band cell (sparks, scattered bones), falls back to connected components with nearest-merge when the band count differs from the expected count; returns cuts in reading order with flags: count mismatch (snow-and-tundra/large: 10 found, 9 expected), touches border (mountain-and-cliffs/large; kept, not dropped), lines removed, fringe score"
          - "trim.ts: trims each cut to its alpha bounds plus a 2 px margin and reports its pixel size"
          - "terrain.ts: finds the four swatches between the magenta cross and any flat outer frame (the user's terrain sheets have a white frame), insets past JPEG bleed, returns them square; seamFix (offset by half, cross-blend) and a tileability score (D6)"
          - "tests/unit/sprite-cut.test.ts uses small synthetic sheets (generated in the test or committed fixtures under 200 KB total) for: a clean 4x4, JPEG-like noise on the magenta edge (no magenta left in edge pixels), drawn grid lines, 10 objects for 9 names, an object touching the border, an uneven 3x3, fragments in one cell, an already-transparent sheet, and a framed 2x2 terrain sheet"

      - id: P3
        title: Vision reads sprite traits (C1 extension)
        size: S
        goal: The vision engine takes optional per-object traits (sight default, light, footprint and size) so sprite objects block sight, give cover or light exactly as their manifest says, including long rectangular footprints, while maps without traits give identical results.
        depends_on: []
        owns:
          - src/lib/domain/combat-map/traits.ts
          - src/lib/domain/combat-map/sight.ts
          - src/lib/domain/combat-map/light.ts
          - src/lib/domain/combat-map/vision.ts
          - src/lib/domain/combat-map/index.ts
          - tests/unit/combat-map-vision-traits.test.ts
          - docs/tasks/TASK-SP-P3.md
        reads:
          - tests/unit/combat-map-vision.test.ts
          - tests/unit/combat-map-spec.test.ts
          - docs/sprite-packs/prompts.md
        acceptance:
          - "traits.ts: VisionTraits {sight, light: none | torch | campfire, footprint: circle | rect, w, h}; VisionObject gains optional traits and optional rot"
          - "sightOf: override ?? traits.sight ?? the kind's R7 default (D3); light: traits.light maps to MAP_LIGHT_REACH torch / campfire (Q1), else the kind (D2); isLit keeps `lit === false` as off"
          - "prepareMap blocks a rotated rectangle of w x h squares (scaled by r) for rect footprints (wall sections, bridges are none, counters cover) and a circle for circle footprints, using blockRadiusFactor for circles as today"
          - "tests/unit/combat-map-vision.test.ts and combat-map-spec.test.ts pass unchanged (E5); new tests: a sprite tree blocks, a sprite pool does not, an override beats the manifest, a rotated wall section blocks along its length only, a brazier sprite lights like a torch at night, a candle sprite lights nothing (Q1), the speed budget with 300 sprite objects"


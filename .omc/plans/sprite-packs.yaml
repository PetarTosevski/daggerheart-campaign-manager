# Sprite-packs plan: Combat Map sprite packs (bead dcm-bxp.56). The user's 60 AI-generated sprite sheets (20 folders x props /
# large / terrain) become built-in sprite packs; every map is drawn either "Classic" (today's procedural painter, D9 C2) or
# "Sprites" (pack sprites with app-added shadows and blended, tiled terrain textures); the Scene card gets a Setting picker; Claude
# and the keyword fallback lay out sprite maps from the chosen setting's kinds; the vision engine reads sight and light from the
# pack manifest; GMs upload their own sheets or single sprites per campaign and label them in an upload screen.
# Sources: docs/sprite-packs/prompts.md (sheet format, style block, per-setting lists in grid order), the D9 plan
#   .omc/plans/d9-combat-map.yaml (R1-R12, Q1-Q6) and its code (C1 src/lib/domain/combat-map/*, C2 src/lib/combat-map/*, C3
#   convex/combatMaps.ts + src/components/combat-map/map-view/**, C4 convex/combatMapGenerate.ts, C5 convex/combatMapEdit.ts +
#   src/components/combat-map/editor/**, C7 convex/combatVision.ts + convex/lib/combatVision.ts), convex/lib/files.ts.
# Format: docs/workflow.md. Extra keys per tracer (plan-check ignores them): title, size (S | M | L), foundation.
# Paths: C = src/app/(gm)/campaigns/[campaignId] (written out in full below).
# Status: APPROVED 2026-10-21 (Q1 = b; Q2-Q5 defaults). Defaults for the QUESTIONS below are written into the acceptance lists and marked (Qn); an answer
#   that differs changes only the tracers that cite that Qn. Tracers do not start until the user has answered or accepted them.
#
# User decisions (2026-10-21, binding; tracers quote the one they implement in their task doc):
#   P1  The Scene card gets a Setting picker (forest, tavern, dungeon, ... from the packs), defaulting to "Let Claude choose", in
#       which case Claude picks the setting from the description.
#   P2  The user's 60 sheets are built into the app as the default packs for every campaign: processed offline into cut, trimmed,
#       keyed-to-transparency, resized WebP sprites plus a manifest, which ARE committed; the raw 2048 px sheets are NOT committed
#       (they stay in the git-ignored sprite-sheets/ folder; the user's copies are in /mnt/c/Users/Petar/sprite-sheets/<setting>/
#       <props|large|terrain>.jpg). GMs can ALSO upload their own sheets or single sprites per campaign (files table, image
#       allowlist, size caps), cut and labelled in an upload screen (name / kind, size in squares, blocks sight / cover / none,
#       gives light).
#   P3  Both styles stay: each map is drawn in "Classic" (today's procedural painter) or "Sprites", chosen per map by the GM. The
#       user decides later which one they prefer, so switching is one click and Classic stays fully working.
#   Earlier (bead dcm-bxp.56 and the brief to this plan): the app adds its own shadows (sprites have none) with one light
#       direction; terrain textures are tiled with edge blending and variant mixing so seams and repetition do not show; sprite
#       kinds beyond the fixed 22 need sight defaults, sizes and light flags (a pack manifest per setting); the vision engine (C1)
#       reads sight / light from the manifest for sprite objects; Claude's layout prompt gets the chosen setting's kinds; the
#       keyword fallback also works with packs.
#
# Derived rules (follow from P1-P3 and the D9 code; binding unless the user objects):
#   D1  One layout serves both styles. Every map object keeps a Classic `kind` (one of the 22) and MAY carry a `sprite` ref; every
#       area keeps a Classic `terrain` (one of the 14) and MAY carry a `texture` ref. Classic draws kind / terrain and ignores the
#       refs; Sprites draws the refs and, where an object or area has none, maps the Classic kind / terrain to the map's setting
#       through the catalog's mapping tables (deterministic per object id and seed), else to `common`, else draws that one object
#       or terrain the Classic way. So Classic -> Sprites -> Classic loses nothing and never rewrites rows: `setStyle` writes only
#       the map's `style` field.
#   D2  Each manifest entry gives a Classic fallback (kind + variant) whose light behaviour equals the sprite's: a sprite that gives
#       light maps to a Classic light kind with the same reach (torch / walltorch / campfire), a sprite that gives no light never
#       maps to one. So C7's toggleLight and C1's isLit work unchanged on sprite objects; a catalog unit test enforces it.
#   D3  Sight for a sprite object = the GM's per-object override (existing `sight` field, R7) ?? the sprite's manifest default ??
#       the Classic kind's R7 default. Manifest sight defaults follow R7's own test: "anything big enough to hide behind blocks
#       sight" (trees, wagons, tents, walls, statues, columns, huts, stalls...), furniture and low objects are cover (tables, beds,
#       benches, counters, crates, barrels, small rocks...), flat things are none (rugs, pools, pits, bridges, stages, chasms,
#       puddles, tracks, bones, stains, lily pads). The P1 task doc lists every assignment for the user to review.
#   D4  Size: props are 1 x 1 square; large objects 2 x 2, except long items 2 x 1 (bridges, wall / channel / boardwalk sections,
#       bookshelf, bar counter, long tables and benches, pew row, cannon pair); terrain swatches tile at TEXTURE_SQUARES (4) squares
#       per swatch. An object's `r` scales its sprite (default r = max(w, h) / 2); `rot` rotates it.
#   D5  Shadows: drawn by the app from each sprite's alpha, one light direction from the top-left (the style block's light), so
#       shadows fall to the bottom-right; blur and offset by the manifest's `height` (flat = no shadow, low, tall). Constants in one
#       module (SHADOW_DIR, SHADOW_ALPHA, SHADOW_BLUR, offsets per height) so the user can tune them.
#   D6  Terrain: textures are tiled in world space; a terrain class with several textures (the setting's + common's) is mixed by a
#       seeded low-frequency noise mask; rotatable textures (manifest flag; not planks, tiles or paths) get a seeded rotation /
#       flip per tile; boundaries between terrains are feathered with a noisy alpha mask (about 0.35 square); terrains with no
#       texture in the setting (wall, void, deep, lava when absent) are painted the Classic way and feathered the same way. The
#       import (P4) also runs a seam-fix pass on each swatch (offset by half, cross-blend the seam) and reports tileability.
#   D7  The setting: built-in settings are the 19 setting folders; `common` is not a setting, it is always added to the chosen
#       setting. A map stores its resolved setting (`setting`) and whether the GM picked it (`settingPicked`; false = Claude or the
#       keyword picker chose). Maps without a setting (all D9 maps) resolve it at paint time with the keyword picker on the map's
#       prompt and name, else grassland-and-road; switching to Sprites stores that resolution. Changing the setting re-maps only
#       objects and areas without a ref (D1); refs to another setting's sprites stay.
#   D8  Built-in keys are stable: `<setting>/<slug of the prompts-doc name>` (e.g. forest/oak-tree). A regenerated sheet keeps its
#       keys, so placed objects survive a re-import; WebP files are content-hashed (`<slug>.<hash8>.webp`) so they can be served
#       immutable. Extra cut sprites beyond a list (snow-and-tundra/large's extra igloo) become numbered variants of the named
#       sprite (`igloo`, variant 2) through scripts/sprite-packs/overrides.json and are mixed like terrain variants.
#   D9  Uploaded sprites are cut in the browser (the same pure cut core as the offline script, on canvas ImageData); only the cut,
#       re-encoded sprites are uploaded (WebP, PNG where the browser cannot encode WebP), never the sheet. Each sprite is one
#       `files` row (kind "sprite") claimed by its `spritePackSprites` row (CF16, CF17). Deleting an uploaded sprite or pack leaves
#       objects that referenced it in place; they resolve to their Classic kind (D1), never an error.
#   D10 Players get exactly what they got before plus the sprite URLs needed to draw the live map; pack lists, labels and the
#       upload screen are GM-only.
#
# Existing behaviour to keep (tests exist; tracers extend, never weaken):
#   E1  Every D9 rule R1-R12 and answered Q1-Q6 works on Sprites maps exactly as on Classic maps: grid, several maps and one live,
#       range circles, tokens linked to the tracker and sheets, facing, vision cones, R7 sight, R8 phases (Nautical Dawn is day),
#       R9 light reaches, R10 dim reveals, R11 per-player view and explored areas, R12 GM preview and fog brush, Q1 hidden edges.
#   E2  Classic maps paint exactly as today: src/lib/combat-map/painter.ts, raster.ts and fallback-layout.ts are not changed by any
#       tracer; tests/unit/combat-map-painter.test.ts and the C3-C8 visual specs pass unchanged.
#   E3  Map rows without `style` are Classic; rows without `setting` / `texturePalette`, objects without `sprite`, areas without
#       `texture` read and paint as today. No migration is needed (all new fields are optional; combatMaps keeps schemaVersion 1).
#   E4  Every existing public function keeps accepting its current arguments (new arguments optional), so tests/convex/
#       {combat-maps,combat-map-generate,combat-map-edit,combat-tokens,combat-vision}.test.ts pass unchanged.
#   E5  For maps without sprite objects the vision engine returns identical results (tests/unit/combat-map-vision.test.ts and
#       combat-map-spec.test.ts unchanged); the C1 speed budget (44 x 32 map, 300 objects, one viewer < 50 ms) holds with sprite
#       traits resolved.
#   E6  Classic generation: the layout prompt (scenePrompt) and the keyword layout stay word for word; only the setting step (Q2)
#       is added around them. Regenerating keeps tokens (clamped) and clears explored areas and fog marks, in both styles.
#   E7  Uploads follow CF16 / CF17: access-checked, rate-limited upload URLs; size and png/jpeg/webp/gif allowlist checked after
#       upload (never image/*, never SVG); a rejected file is deleted and the mutation RETURNS {ok:false, code}; a storage id is
#       never proof of access.
#   E8  Duplicating a map copies its new fields too (style, setting, texture palette, sprite and texture refs, texture cells).
#
# ORCHESTRATOR NOTE (2026-10-21, after P3 merged): light can now come from a sprite's traits (`givesLight`, `mapLightReach` in
#   src/lib/domain/combat-map/light.ts; trait "faintglow" clear 1 / dim 3). Every place that asks "is this a switchable light?"
#   must use givesLight({kind, lit, traits}) instead of the Classic kind alone: convex/combatVision.ts toggleLight (P0 or P5),
#   src/components/combat-map/editor/edit-model.ts isSwitchableLight and edit-tools-panel.tsx's reach label via mapLightReach (P9),
#   and the play-mode light switches in src/components/combat-map/vision/vision-layer.tsx (P6). P5 passes resolved traits and `rot`
#   on every object given to prepareMap (convex/lib/combatVision.ts).
# QUESTIONS (ANSWERED by the user 2026-10-21; binding):
#   ANSWER Q1 = (b): the torch-like and campfire-like kinds of (a), PLUS a new "faint glow" map-light reach for things that only
#       glow (candles, candelabra, glowing mushrooms, luminous moss, crystals, wisps, lava, glowing lichen...): FAINT_GLOW_REACH =
#       clear to 1 square (Melee), dim to 3 squares (Very Close), one named constant in src/lib/domain/combat-map/light.ts next to
#       MAP_LIGHT_REACH (tunable; the orchestrator told the user this value). Faint-glow lights are switchable like other map lights
#       and follow R9-R11 (dim hides tokens at night). Owned by P3 (vision traits) and P1 (catalog flags); the GM can set any
#       sprite to none / faint glow / torch / campfire in P8's labelling screen and P9's editor.
#   ANSWER Q2 = (a) two calls, one generation. ANSWER Q3 = (c) per-pack New setting / Add to <built-in>. ANSWER Q4 = (a) Classic for new
#       maps until the user picks. ANSWER Q5 = (a) sharp pinned to Next's 0.34.5 as a devDependency.
# (Original question text kept below for reference.)
#   Q1  Light from sprite kinds beyond R9. R9 defines three map lights: wall torch / torch [6, 12], campfire [12, 24]. The packs add
#       braziers, standing torches, street lamps, lanterns on posts, fireplaces, forges, stoves, candles, candelabras, glowing
#       mushrooms, luminous moss, crystals, will-o'-wisps, lava pools. Options: (a) only R9's two reaches exist: torch-like
#       (standing torch, iron brazier, burning brazier, lantern on a post, street lamp, floor brazier, drow lantern) and
#       campfire-like (campfire burning, campfire in snow, hearth fireplace, grand fireplace, fireplace grate, blacksmith forge,
#       forge of the fire giants, kitchen stove); everything that only glows (candles, candelabra, mushrooms, moss, crystals,
#       wisps, lava) gives no light by default, and the GM may set any sprite to torch or campfire in the upload screen or per
#       object; (b) (a) plus a new "faint glow" light (e.g. clear 1, dim 3) for the glowing things, a new rule value;
#       (c) only the sprites named torch / campfire give light. DEFAULT (a): no new rule values, every reach is R9's. Cited by
#       P1, P3, P8.
#   Q2  How Claude picks the setting ("Let Claude choose", P1). Listing every setting's kinds in one prompt is about 580 names.
#       Options: (a) two calls: a short classification call (description + the setting names, max a few tokens out) picks the
#       setting, then the layout call gets only that setting's and common's kinds; the rate limit counts the pair as one
#       generation; (b) one call with every setting's kinds; (c) the keyword picker chooses, Claude only lays out. Also: Classic
#       maps run the same classification step (their layout prompt stays unchanged, E6), so a later switch to Sprites already has
#       the right setting. DEFAULT (a), classification for both styles. Cited by P7.
#   Q3  What an uploaded pack is in the Setting picker. Options: (a) always a setting of its own (with common added); (b) always an
#       extension of one built-in setting; (c) the GM chooses per pack: "New setting" or "Add to <built-in setting>" (optional
#       `extends`). DEFAULT (c). Cited by P0, P5, P7, P8.
#   Q4  Style of new maps. Options: (a) Classic until the user picks a favourite (P3), the GM switches per map; (b) Sprites;
#       (c) the style the GM last used (per-viewer localStorage). DEFAULT (a). Existing maps are Classic either way (E3). Cited
#       by P5, P6.
#   Q5  Image library for the offline cutter (decode JPEG, encode WebP, resize). Options: (a) `sharp` as a devDependency, pinned
#       to the version Next 16 already installs (sharp 0.34.5 is in node_modules; no new download, respects minimumReleaseAge);
#       (b) a pure-JS decoder / encoder (new dependencies, slower, worse WebP). DEFAULT (a). The browser path (P8) uses canvas
#       and needs no library. Cited by P0, P4.
#
# Rules for every tracer (part of every acceptance list, not repeated):
#   - Every new public function uses the wrappers in convex/lib/functions.ts (campaignQuery / gmQuery / gmMutation /
#     keyedGmMutation / campaignMutation / userAction); authorization only through permissionFor via the wrappers. Style,
#     setting, generation, editing and every pack / upload function are GM-only; players get read-only campaignQuery results
#     filtered on the server (D10). Outsiders get NOT_FOUND, anonymous UNAUTHENTICATED (as the wrappers do).
#   - `args` and `returns` validators on every new function, no v.any(); schema-guard RETURNS_PENDING never grows.
#   - Its own Convex test covers anonymous, outsider, player and GM for each new function (tests/convex/authz-matrix.test.ts
#     does not exist yet; D12 folds these in) and asserts ConvexError.data.code (errorCode helper), never message text.
#   - Intents only: ids and single fields (setStyle = map id + style; setSetting = map id + setting ref; updateSprite = sprite
#     id + one field); never a whole map, object list, manifest or pack. Optimistic updates on the style switch, the setting
#     picker, sprite label edits and sprite / pack deletes.
#   - Indexed reads only (no .filter on queries); caps checked with an index `.take`: MAX_SPRITE_PACKS 20 per campaign,
#     MAX_PACK_SPRITES 64 per pack, MAX_TEXTURE_PALETTE 16 per map, sprite size 1..4 squares per side, uploaded sprite at most
#     MAX_SPRITE_BYTES 1 MB and 1024 px per side, pack and sprite names 60 characters. Existing D9 caps unchanged.
#   - A new error code is one P0 defines in src/lib/errors/spritePacks.ts; a code P0 did not add means stop and report.
#   - Only the dependency Q5 allows (P0 adds it). Pure logic (catalog, mapping, setting picker, cut core, traits, sprite layout
#     cleaning) lives in framework-free src/lib/** with relative imports (CH6), used by the scripts, the server and the client.
#   - Every useQuery subtree sits inside an error boundary; loading uses the shared Loading with role=status. Sprite images load
#     asynchronously: until a sprite has loaded its object is drawn the Classic way, then that area is repainted (no blank map).
#   - UI in the Combat Map's look: tokens and classes from C/combat-map/combat-map.css (cm-card, cm-btn, cm-lbl, --cm-*); each
#     tracer adds CSS only in its own colocated .css. 1440 and 1024 px layouts; 390 px: no horizontal page scroll, touch targets
#     >= 44 px, labels on every control, keyboard reachable, native <dialog> modals via src/components/brand/modal.tsx.
#   - Visual acceptance: the tracer's tests/e2e/visual/SP-<id>.spec.ts (tag @visual, E2E_VISUAL=1) shoots its regions at
#     1440x900, 1024x768 and 390x844. There is no design board for sprites: the counterparts are the same map in Classic and the
#     P4 contact sheets; the task doc docs/tasks/TASK-SP-<id>.md lists both sets with a verdict per region and every deliberate
#     deviation.
#   - pnpm lint (zero warnings in convex/), pnpm typecheck, pnpm test and the tracer's own e2e specs pass in its worktree; the
#     orchestrator runs the full e2e suite after each wave. Raw sheets are never committed (the tracer guard rejects any file
#     under sprite-sheets/); worktrees read them from /mnt/c/Users/Petar/sprite-sheets with the scripts' --src flag.
#   - Every tracer owns docs/tasks/TASK-SP-<id>.md.
#
# Data model (P0 creates every table and field; later tracers only add functions). Widen only: no existing validator changes
#   shape, every new field is optional, combatMaps keeps schemaVersion 1 (E3).
#   spriteRef         union {builtin: string (catalog key, D8)} | {uploaded: id("spritePackSprites")} (CD6: uploaded refs are ids).
#   settingRef        union {builtin: string (setting id)} | {pack: id("spritePacks")}.
#   combatMaps        widened: style? ("classic" | "sprites"; absent = classic, Q4), setting? (settingRef), settingPicked?
#                     (bool, D7), texturePalette? (array of spriteRef, <= MAX_TEXTURE_PALETTE; the texture cell layer's codes
#                     index into it).
#   combatMaps.areas  each area widened: texture? (spriteRef; Classic ignores it, D1).
#   combatMapObjects  widened: sprite? (spriteRef). `kind` stays the Classic fallback (D1, D2); `sight` stays the GM override (D3).
#   combatMapCells    layer widened with "texture" (hand-painted textures for Sprites maps: one character per square indexing
#                     texturePalette, "." = none); painting a texture also paints its terrain class on the "terrain" layer so
#                     vision and Classic stay right (P9).
#   spritePacks       one row per GM pack: campaignId, name, extends? (built-in setting id, Q3), createdBy, createdAt, updatedAt.
#                     Index by_campaign_updated. At most MAX_SPRITE_PACKS per campaign.
#   spritePackSprites one row per uploaded sprite: campaignId, packId, fileId (files row), name, slug, category ("object" |
#                     "texture"), w, h (squares, 1..4), sight ("block" | "cover" | "none"), light ("none" | "torch" | "campfire",
#                     Q1), height ("flat" | "low" | "tall", D5), footprint ("circle" | "rect"), classicKind, classicVariant?,
#                     terrain? (texture class, one of the 14 terrains), rotatable? (textures), px {w, h}, order, createdAt.
#                     Indexes by_pack_order, by_campaign. Typed, no blob. Own table: a pack grows to 64 rows (CD8).
#   files.kind        widened with "sprite" (refId = the spritePackSprites id).
#   Built-in manifest src/lib/sprite-packs/builtin/manifest.ts (generated by P4, committed): schemaVersion 1, per setting the
#                     cut sprites (key, file, px size, variants, seam score) joined at runtime with the hand-curated catalog
#                     (P1: names, sizes, sight, light, height, footprint, classic fallback, terrain class). Read by server and
#                     client alike; validated by a zod schema in src/lib/sprite-packs/manifest.ts.
#   Purge: purgeCampaign deletes spritePacks, spritePackSprites and their "sprite" files. No table only grows (packs and sprites
#   are capped and deleted by the GM; orphaned upload blobs are already swept by `sweep orphan uploads`), so no new cron.
#
# Shared files: package.json, pnpm-lock.yaml, tsconfig.json, next.config.ts, convex/schema.ts, convex/cleanup.ts,
#   convex/lib/functions.ts (rate limit spriteUpload), convex/tables/combatMaps.ts, convex/tables/files.ts, convex/lib/files.ts,
#   convex/lib/validators/combatMaps.ts, src/lib/errors/app-error.ts, src/lib/convex-errors.ts, tests/convex/schema-guard.test.ts,
#   tests/convex/cleanup.test.ts belong to P0 only. P0 also widens the returns validators and projections that echo map, area,
#   object and cell rows (convex/combatMaps.ts, convex/combatVision.ts) so a row with a new field never breaks a read, and copies
#   the new fields in `duplicate` (E8). C/combat-map/page.tsx and src/components/combat-map/slots.ts belong to P0, which adds
#   two stub slots (src/components/combat-map/style/index.tsx: StyleSwitch; src/components/combat-map/packs/index.tsx: PacksLink)
#   and the GM-only route shell C/combat-map/packs/{page.tsx,error.tsx}. docs/data-model.md is updated by the orchestrator.
plan: sprite-packs
waves:
  # ---------------------------------------------------------------- wave 1: foundation, catalog, cut core, vision traits
  - wave: 1
    tracers:
      - id: P0
        foundation: true
        title: Sprite-packs foundation (fields, tables, validators, errors, rate limit, files kind, purge, widened reads, stub slots, packs route shell, tooling)
        size: M
        goal: The new map, area, object and cell fields and the spritePacks / spritePackSprites tables exist, are read back by every existing map query without error, are copied by duplicate and purged with their campaign; the error codes, the spriteUpload rate limit and the "sprite" files kind are wired; the Combat Map page mounts the StyleSwitch and PacksLink stubs and /campaigns/<id>/combat-map/packs opens a GM-only shell.
        depends_on: []

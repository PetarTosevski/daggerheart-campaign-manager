      - id: P5
        title: Server side - map style, setting, sprite sources for GM and players, traits in server vision
        size: M
        goal: The GM switches a map between Classic and Sprites and sets its setting with one intent each, the client gets one query with everything needed to draw a map's sprites (built-in keys, the setting, uploaded sprite URLs) filtered for players to the live map, and the server's player view resolves sprite traits so what players see on Sprites maps follows the manifest.

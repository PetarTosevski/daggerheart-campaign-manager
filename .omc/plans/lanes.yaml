# Lanes plan: every open bead (2026-10-30) split into lanes that run in parallel worktrees.
# Each lane = one tracer here; its beads carry the label lane:<label> (bd list --label lane:<label>).
# A lane runs as one or more tracers in order; it may split into smaller tracers at start, but the split
# stays inside the lane's owns. Format: docs/workflow.md. Extra keys (plan-check ignores them): title, label, size.
#
# Why lanes split by ENGINE PART and not by card / feature / adversary: the same gap appears in all three systems,
# and all three share src/lib/domain/card-effects/types.ts. One owner per hot file:
#   types.ts (all three)            -> V only           convex/lib/combatActions.ts -> E1
#   incomingHits / window / severity -> A (wave 1), E2  card-effects/run.ts         -> E3
#   convex/lib/cardRunner.ts         -> A, DA19, V, E4  availability.ts / numbers.ts -> E5
#   expiry / cardRows / combatFeatures -> E6            adversary engine            -> E7
#   delegate / featureRunner / rests -> E8
#
# Rules for every lane in wave 4:
#   - Never edit the three effect types.ts files. A gap V missed: write a manual step and file a bead labelled
#     vocabulary-gap with the lane label (the DA0 rule).
#   - Never edit src/lib/srd/** data files. Engine + tests with fixture entries only; wave 5 data lanes switch the
#     SRD entries over to the new vocabulary, one file per tracer.
#   - A change needed in another lane's file: file a follow-up bead with that lane's label; don't edit it.
#
# Verified 2026-10-30 by two audit agents (close list, file collisions); their fixes are applied here.
# DA10 (branch da10, 615745e) and DA13 (branch da13, 02089a0) are built but not merged into rebuild.
# Paths: C = src/app/(gm)/campaigns/[campaignId] (written out in full below).

        acceptance:
          - "Every open engine-side bead labelled lane:w1-e1-triggers-rolls done or split with a follow-up (V2 table)"
          - "No edits to types.ts or src/lib/srd/**; data switches go to wave 9"
          - "lint, typecheck, tests pass"

    tracers:
      - id: E1
        label: w1-e1-triggers-rolls
        title: "Triggers, rolls, the Hand and moveCard: round-2 beads (incl. dcm-cfpv recall riders, dcm-jog/3ou die bonus answer)"
        goal: "Triggers, rolls, the Hand and moveCard: round-2 beads (incl. dcm-cfpv recall riders, dcm-jog/3ou die bonus answer)"
        size: M
        depends_on: []
        owns:

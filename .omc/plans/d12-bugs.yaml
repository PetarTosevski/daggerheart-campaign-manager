  - wave: 2
    tracers:
      - id: B4
        title: Players switch doors and lights only from Melee range; a light they switch stays theirs like a door
        size: M
        # USER ANSWERS (2026-10-22, binding): "yes to both" - (1) a door a player switches is stored as explored (B2's
        #   reading of D8 confirmed); (2) apply the same fix to light switches. "Make sure that player tokens need to be in
        #   melee range to interact with doors or light sources (turn on off close open)".
        # DEFAULTS (orchestrator, reported to the user): Melee = 1 square (CB p.103 Defined Ranges), measured Chebyshev
        #   from any square of one of the player's character tokens on the live map to any square of the object's
        #   (rotated) footprint, so adjacent incl. diagonal or overlapping counts. The GM is never range-limited. Seeing
        #   the object (D8) is still required too. The server refuses with a new code COMBAT_OUT_OF_REACH (no position in
        #   the payload). The vision panel and on-map door clicks show an out-of-reach switch disabled with the text
        #   "Move next to it" (not colour only); a carried light (setCarriedLight) is not an object and is unaffected.
        goal: toggleDoor and toggleLight require a player's character token within Melee of the object (server and UI), and toggleLight stores the light as explored like B2 did for doors.
        depends_on: [B2]
        owns:
          - convex/combatVision.ts
          - convex/lib/combatVision.ts
          - src/lib/domain/combat-map/reach.ts
          - src/lib/errors/combatMap.ts
          - src/components/combat-map/vision/**
          - src/components/combat-map/tokens/**
          - src/components/combat-map/map-view/**
          - tests/convex/combat-doors.test.ts
          - tests/convex/combat-lights*.test.ts
          - tests/convex/combat-vision*.test.ts
          - tests/convex/authz/combat.entries.ts
          - tests/unit/combat-reach.test.ts
          - tests/e2e/combat-movement.spec.ts
          - tests/e2e/combat-vision*.spec.ts
          - tests/e2e/sprite-packs-flow.spec.ts
          - tests/e2e/live-combat*.spec.ts
          - docs/data-model.md
          - docs/tasks/TASK-BUG-B4.md
        reads:

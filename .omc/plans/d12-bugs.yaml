          - docs/tasks/TASK-PF-PF2.md
          - src/proxy.ts
          - src/app/convex-client-provider.tsx
          - src/lib/errors/common.ts
        acceptance:
          - "An UNAUTHENTICATED error in any route segment signs the user out locally and lands on /signin?next=<path>; signing in returns to that path; other codes still show the error screen; unit tests for the decision (incl. never redirecting from /signin)"
          - "e2e: a signed-in GM on a campaign page whose session is revoked server-side (delete the auth session row via a test-only path that already exists, or expire it) ends on /signin with next set, signs in and is back on the page; no redirect loop; at 1440 and 390"
          - "auth-single-run.spec.ts still passes (B3's retry and PF3's single Authenticate kept)"
          - "pnpm lint, typecheck, vitest pass; tracer-guard passes"

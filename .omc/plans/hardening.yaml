# Hardening plan: turns the findings of .omc/audit/*.md into tracers (docs/workflow.md format).
# Rulebook: docs/best-practices.md (rule ids such as CF3 or CD10 are cited in the goals).
#
# Extra keys per tracer (ignored by plan-check): title, timing (before-D5 | after-D5), size (S | M | L).
#   before-D5 = changes tables or functions that D5 builds on, or fixes security. D5 may start once wave 6 is merged.
# External prerequisites:
#   - foundation:T1 (.omc/plans/foundation.yaml) splits convex/tables/* and src/lib/errors/*; every tracer from wave 2 on needs it merged.
#   - The CI + pre-commit + e2e port-isolation work (another agent) must be merged before wave 9; it currently edits package.json,
#     eslint.config.mjs, playwright.config.ts and scripts/e2e-*.mjs.
# Assumed table-file names from foundation:T1: campaigns.ts (campaigns, campaignMembers, campaignInvites, campaignState),
#   countdowns.ts, campaignTime.ts, characters.ts, trackers.ts (frameTrackers), maps.ts, codex.ts, files.ts, grants.ts,
#   settings.ts, operations.ts. If T1 names them differently, rename the owns entries before wave 3 and rerun plan-check.
# Every tracer also owns its own docs/tasks/TASK-hardening-<id>.md. The orchestrator updates docs/data-model.md at merge time.
# Shared files (package.json, pnpm-lock.yaml, eslint.config.mjs, convex/convex.config.ts, convex/schema.ts composition,
#   .gitignore, .github/workflows/*) are owned by a W<n>-T0 tracer or marked "orchestrator edits at merge".
# Paths: C = src/app/(gm)/campaigns/[campaignId] is written out in full below.
plan: hardening
waves:
  # ---------------------------------------------------------------- wave 1: security
  - wave: 1
    tracers:
      - id: H01
        title: Invites count only for verified emails
        timing: before-D5
        size: S
        goal: An unverified password account whose email the GM invited gets NOT_FOUND and gains no membership; verified (Google) invitees still join (convex-functions M2, CF3).
        depends_on: []
        owns:
          - convex/lib/access.ts
          - convex/campaigns.ts
          - tests/convex/invite-verification.test.ts
        reads:
          - convex/lib/users.ts
          - convex/lib/permissions.ts
          - convex/members.ts
          - convex/auth.ts
        acceptance:
          - "campaignRole, campaigns.list and campaigns.markOpened honour an invite only when user.emailVerificationTime is set"
          - "tests/convex/invite-verification.test.ts: an unverified invited password user gets NOT_FOUND on campaigns.get, the campaign is missing from campaigns.list, and markOpened creates no campaignMembers row; a verified invitee still becomes a member; joinByCode is unaffected"
          - "pnpm lint, pnpm typecheck and pnpm test pass"
      - id: H02
        title: Sign-up, seed-account and env hardening
        timing: before-D5
        size: S
        goal: Sign-up no longer reveals allowlist or registration state, seed accounts exist only on e2e deployments, and Convex reads env through the typed env (convex-functions L4, L5, L6; CF19, CF20).
        depends_on: []
        owns:
          - convex/lib/users.ts
          - convex/lib/allowlist.ts
          - convex/lib/auth.ts
          - convex/accounts.ts
          - convex/auth.ts
          - convex/convex.config.ts
          - tests/unit/allowlist.test.ts
          - tests/convex/create-or-update-user.test.ts
          - tests/convex/require-user.test.ts
        reads:
          - convex/_generated/server.d.ts
          - src/app/signin/password-form.tsx
        acceptance:
          - "Not allowlisted and already registered return the same error code"
          - "allowedEmails includes SEED_ACCOUNTS only on an e2e deployment, and accounts:seed refuses to run against *.convex.cloud (unit test)"
          - "No process.env reads in convex/ except auth.config.ts; env vars are declared and read inside handlers (if the installed convex version cannot declare env, record that in the task doc and keep the reads inside handlers)"
          - "pnpm lint, pnpm typecheck and pnpm test pass"
      - id: H03
        title: Upload type allowlist and logged blob deletes
        timing: before-D5
        size: S
        goal: The three attach mutations accept only png/jpeg/webp/gif through one shared check, and failed blob deletes are logged rather than swallowed (convex-functions L2, L11; CF16).
        depends_on: []
        owns:
          - convex/lib/files.ts
          - convex/maps.ts
          - convex/codex.ts
          - convex/characters.ts
          - tests/convex/upload-claims.test.ts
        reads:
          - src/lib/codex/schema.ts
        acceptance:
          - "image/svg+xml and image/x-foo are rejected and deleted, while png, jpeg, webp and gif are accepted (upload-claims test)"
          - "No .catch(() => undefined) remains around ctx.storage.delete"
          - "pnpm lint, pnpm typecheck and pnpm test pass"
      - id: H04
        title: Bind the rulebook in agent files (dcm-bxp.22)
        timing: before-D5
        size: S
        goal: AGENTS.md carries the Top 15 rules and a link to docs/best-practices.md; CLAUDE.md points to AGENTS.md, so every D5 agent works under the rulebook.
        depends_on: []
        owns:
          - AGENTS.md
          - CLAUDE.md
        reads:
          - docs/best-practices.md
          - docs/workflow.md
        acceptance:
          - "AGENTS.md has a 'Best practices' section with the Top 15 rules, verbatim from docs/best-practices.md"
          - "The duplicate Beads block in AGENTS.md is removed, and docs/data-model.md is no longer described as '(once created)'"
          - "CLAUDE.md template placeholders are replaced by a pointer to AGENTS.md (the Beads block stays)"
          - "Close bead dcm-bxp.22 after the user confirms; the lint and memory parts are covered by tracers W2-T0, W8-T0 and W9-T0"

  # ---------------------------------------------------------------- wave 2: auth wrappers (dcm-bxp.21)
  - wave: 2
    tracers:
      - id: W2-T0
        foundation: true
        title: Dependencies, Convex components and the raw-builder warning
        timing: before-D5
        size: S
        goal: convex-helpers, @convex-dev/rate-limiter and @convex-dev/migrations are installed and registered, and ESLint warns on raw query/mutation/action outside the allowed files (CF1).
        depends_on: [H02]
        owns:
          - package.json
          - pnpm-lock.yaml
          - eslint.config.mjs
          - convex/convex.config.ts
        reads:
          - docs/best-practices.md
        acceptance:
          - "pnpm install succeeds under minimumReleaseAge, and npx convex codegen succeeds with both components registered"
          - "no-restricted-imports warns (not errors) on query/mutation/action imported from */_generated/server, except in convex/lib/functions.ts, convex/auth.ts and convex/http.ts; internal* builders are not flagged"
          - "pnpm lint exits 0"
      - id: H05
        title: Wrapper core on permissionFor; Fear converted end to end
        timing: before-D5
        size: L
        goal: userQuery/userMutation/userAction/maybeUserQuery and campaign wrappers ({need}) built only on permissionFor exist, with idempotency, rate limits and error normalisation; convex/fear.ts uses them end to end (dcm-bxp.21; CF1, CF2, CF4, CF12, CF13, CF14, CF15).
        depends_on: [W2-T0, H01]
        owns:
          - convex/lib/functions.ts
          - convex/lib/permissions.ts
          - convex/lib/access.ts
          - convex/lib/auth.ts
          - convex/lib/operations.ts
          - convex/lib/mechanics.ts
          - convex/lib/fear.ts
          - convex/fear.ts
          - src/lib/errors/app-error.ts
          - src/lib/errors/common.ts
          - tests/convex/functions.test.ts
          - tests/convex/fear.test.ts
          - tests/convex/permissions.test.ts
          - tests/convex/run-rollback.test.ts
        reads:
          - .omc/audit/convex-functions.md
          - convex/convex.config.ts
          - src/lib/domain/**
          - src/lib/convex-errors.ts
        acceptance:
          - "The wrappers put user, campaign and permission on ctx; the campaign role comes from permissionFor (lib/access.ts becomes a shim over it, removed in H17)"
          - "An edit grant on a resource raises access through the wrappers (test)"
          - "The keyed variant exposes ctx.once: a replay by a different user is rejected, and requestHash is a SHA-256 (test)"
          - "A RuleError or ZodError becomes ConvexError {code, message}, and a TypeError is rethrown unchanged (test)"
          - "A rateLimit option rejects with RATE_LIMITED past its limit (test)"
          - "AppError/AppErrorCode are exported from src/lib/errors, all payloads are objects, and NOT_FOUND reads 'That no longer exists.'"
          - "convex/fear.ts has no raw builders, and fear e2e (dashboard.spec.ts) passes"
          - "pnpm lint, pnpm typecheck and pnpm test pass"

  # ---------------------------------------------------------------- wave 3: migrations framework + domain conversions
  - wave: 3
    tracers:
      - id: H06
        title: Migrations framework and versioned blob reader
        timing: before-D5
        size: M
        goal: Data migrations run through @convex-dev/migrations from convex/migrations/<domain>.ts, and convex/lib/blobs.ts gives every blob reader parseOrCorrupt plus schemaVersion dispatch (convex-data H1 step 1, L7; CD2, CD3, CD5).
        depends_on: [H05]
        owns:
          - convex/migrations.ts
          - convex/migrations/run.ts
          - convex/migrations/uploads.ts
          - convex/lib/migrations.ts
          - convex/lib/blobs.ts
          - tests/convex/migrations.test.ts
          - tests/unit/blobs.test.ts
        reads:
          - convex/convex.config.ts
          - convex/lib/files.ts
        acceptance:
          - "convex/migrations.ts is replaced by convex/migrations/run.ts (runner) and convex/migrations/uploads.ts (moveUploadsToFiles, batched, still idempotent)"
          - "readVersioned(schemaByVersion, raw, code) upgrades an old-shape document and throws *_CORRUPT on a bad one (unit test)"
          - "A dry run and a resume are documented in the task doc"
          - "pnpm lint, pnpm typecheck and pnpm test pass"
      - id: H07
        title: Campaigns on wrappers; GM-open churn removed
        timing: before-D5
        size: M
        goal: Campaign functions use the wrappers; opening a campaign writes a throttled campaignOpens row instead of the campaign document; deleted campaigns are indexed for purge; the join code is created with the campaign (convex-data M1, L1; client M4; CD10, CD11).
        depends_on: [H05]
        owns:
          - convex/campaigns.ts
          - convex/tables/campaigns.ts
          - convex/lib/validators/campaigns.ts
          - src/lib/errors/campaigns.ts
          - tests/convex/campaigns.test.ts
          - tests/convex/options.test.ts
          - tests/convex/tome.test.ts
        reads:
          - convex/lib/functions.ts
          - convex/lib/permissions.ts
          - src/lib/validation/campaigns.ts
        acceptance:
          - "markOpened writes campaignOpens {userId, campaignId, lastOpenedAt} (indexes by_user_campaign, by_user_lastOpened), skips the write when the stored value is under 5 minutes old, and never patches campaigns (test)"
          - "campaigns.list order is unchanged, falling back to campaigns.lastOpenedAt for campaigns with no campaignOpens row"
          - "No .filter() in campaigns.ts; deletedAt is part of the owner indexes, and campaigns has a by_deletedAt index"
          - "campaigns.create sets joinCode and is rate-limited"
          - "No raw builders in campaigns.ts; pnpm lint, pnpm typecheck and pnpm test pass"
      - id: H08
        title: Members on wrappers with rate limits and returns
        timing: before-D5
        size: S
        goal: Member and invite functions use the wrappers, joinByCode and invite are rate-limited, and the roster's returns validator keeps emails away from players (convex-functions L3, M4; convex-data L2; CF6, CF15).
        depends_on: [H05]
        owns:
          - convex/members.ts
          - src/lib/errors/members.ts
          - tests/convex/members.test.ts
        reads:
          - convex/lib/functions.ts
          - convex/tables/campaigns.ts
        acceptance:
          - "members.ts queries use by_campaign_user and by_campaign_email with a prefix, so the short indexes can be dropped in H17"
          - "joinByCode (10/min per user) and invite are rate-limited (test)"
          - "The roster has a returns validator, and players receive no email field (test)"
          - "No raw builders in members.ts; pnpm lint, pnpm typecheck and pnpm test pass"
      - id: H09
        title: Countdowns, campaign time, settings and users on wrappers
        timing: before-D5
        size: M
        goal: These domains use the wrappers, viewer becomes maybeUserQuery, and the countdown list reads through an owner index instead of collecting every countdown (convex-data L5; convex-functions d3; CD11, CD12).
        depends_on: [H05]
        owns:
          - convex/countdowns.ts
          - convex/campaignTime.ts
          - convex/settings.ts
          - convex/users.ts
          - convex/tables/countdowns.ts
          - convex/tables/history.ts
          - convex/history.ts
          - convex/fear.ts
          - convex/lib/fear.ts
          - tests/convex/history.test.ts
          - tests/convex/fear.test.ts
          - src/lib/errors/countdowns.ts
          - src/lib/errors/campaign-time.ts
          - src/lib/errors/settings.ts
          - tests/convex/countdowns.test.ts
          - tests/convex/campaign-time.test.ts
        reads:
          - convex/lib/functions.ts
          - src/lib/validation/countdowns.ts
          - src/lib/validation/campaign-time.ts
        acceptance:
          - "History tables (dcm-bxp.26): every Fear change, countdown change and campaign-time change writes an event row (campaignId, kind, before, after, by, at) indexed by [campaignId, at]; a GM-only paginated query lists them; tests prove each mutation writes one row and players can't read them"
          - "countdowns has a by_campaign_owner index; the dashboard list reads ownerKey undefined and excludes cancelled countdowns without collecting the whole table"
          - "users.viewer returns null when signed out instead of throwing UNAUTHENTICATED"
          - "Player-facing queries declare returns validators"
          - "No raw builders in these four files; pnpm lint, pnpm typecheck and pnpm test pass"

  # ---------------------------------------------------------------- wave 4: data model D5 builds on
  - wave: 4
    tracers:
      - id: H10
        title: World map split into rows
        timing: before-D5
        size: L
        goal: The World map is stored as maps (scalars) + mapTokens + mapHexes + mapTerrain tiles, edits patch only the rows they touch, and maps.get still returns the same shape, so the world UI is unchanged (convex-data H2; CD8, CD9, CD10).
        depends_on: [H06]
        owns:
          - convex/maps.ts
          - convex/lib/maps.ts
          - convex/tables/maps.ts
          - convex/lib/validators/maps.ts
          - convex/migrations/maps.ts
          - src/lib/world/map-state.ts
          - src/lib/errors/maps.ts
          - tests/convex/maps.test.ts
          - tests/convex/maps-migration.test.ts
          - tests/unit/world-map-state.test.ts
        reads:
          - convex/codex.ts
          - convex/lib/blobs.ts
          - convex/lib/functions.ts
          - src/app/(gm)/campaigns/[campaignId]/world/**
        acceptance:
          - "mapTokens (by_campaign), mapHexes (by_campaign_q_r) and mapTerrain tiles (by_campaign_tile) exist; paintCells writes only the touched tiles, and addToken/updateToken write one row (test counts writes)"
          - "lib/maps.ts keeps a listMapTokens(ctx, campaignId) helper, so codex.ts works unchanged and tests/convex/codex.test.ts passes"
          - "The migration turns an existing map document into rows, and the old document reads the same afterwards (maps-migration test)"
          - "The rules arg is typed (no v.any); the player view has a returns validator; mapImageUploadUrl is rate-limited"
          - "No raw builders in maps.ts; tests/e2e/world.spec.ts passes; pnpm lint, pnpm typecheck and pnpm test pass"
      - id: H11
        title: Characters on wrappers, typed sheet and intent mutations
        timing: before-D5
        size: L
        goal: Characters use the wrappers with typed args, a versioned sheet with stable list ids, and intent mutations (adjustGold, setTrait, add/removeInventory, setExperience), so concurrent edits never revert each other (convex-data H1, M4; client H2 server side, L7; CL3).
        depends_on: [H06]
        owns:
          - convex/characters.ts
          - convex/tables/characters.ts
          - convex/lib/validators/characters.ts
          - convex/migrations/characters.ts
          - src/lib/validation/characters.ts
          - src/lib/errors/characters.ts
          - tests/convex/characters.test.ts
          - tests/convex/character-intents.test.ts
        reads:
          - convex/lib/blobs.ts
          - convex/lib/functions.ts
          - convex/lib/permissions.ts
          - src/lib/domain/**
        acceptance:
          - "The sheet has schemaVersion; experiences and inventory items carry stable ids; the migration backfills both (test)"
          - "The draft and patch args are typed (no v.any)"
          - "Two intents built from the same stale snapshot both apply (character-intents test)"
          - "One corrupt sheet does not fail listByCampaign: the other characters are returned and the bad one is marked"
          - "loadCharacter asks for edit, not owner, where owner-level access is unused; get/listByCampaign have returns validators and send no storageId to players; portraitUploadUrl is rate-limited"
          - "No raw builders in characters.ts; pnpm lint, pnpm typecheck and pnpm test pass"
      - id: H12
        title: Frame trackers on wrappers with validated, versioned reads
        timing: before-D5
        size: M
        goal: Every tracker reads through a schema (TRACKER_CORRUPT on bad data), shares one frameTrackerMutation scaffold, carries schemaVersion and uses the wrappers (testing H1, M7; convex-data L3; convex-functions M5; CD2, CD7).
        depends_on: [H06, H09]
        owns:
          - convex/trackers/**
          - convex/lib/trackers.ts
          - convex/tables/trackers.ts
          - convex/migrations/trackers.ts
          - src/lib/errors/trackers.ts
          - tests/convex/andaluria.test.ts
          - tests/convex/weredragon.test.ts
          - tests/convex/colossus.test.ts
          - tests/convex/age-of-umbra.test.ts
          - tests/convex/five-banners.test.ts
          - tests/convex/horizon.test.ts
        reads:
          - convex/lib/blobs.ts
          - convex/lib/functions.ts
          - convex/tables/countdowns.ts
          - src/lib/frames/trackers/**
        acceptance:
          - "readTracker takes a schema; no 'row.data as T' and no bare .parse() remain; there is one corrupt-data test per tracker"
          - "andaluria and weredragon use the shared frameTrackerMutation; only RuleError/ZodError are converted"
          - "weredragon authorId and fiveBanners pick.id go through normalizeId; fiveBanners reads countdowns by_campaign_owner"
          - "Tracker get/state queries have GM/player union returns validators"
          - "No raw builders in convex/trackers/**; pnpm lint, pnpm typecheck and pnpm test pass"
      - id: H13
        title: permissionFor read cost
        timing: before-D5
        size: S
        goal: For a campaign-scoped resource, permissionFor does at most 4 point reads ({user} and {campaign of the resource}) instead of collecting all of the caller's campaigns and memberships (convex-data M6; CD13).
        depends_on: [H05]
        owns:
          - convex/lib/permissions.ts
          - tests/convex/permissions.test.ts
        reads:
          - convex/tables/files.ts
          - convex/lib/functions.ts
        acceptance:
          - "principals() and its .collect() calls are gone; a counting ctx.db wrapper test shows at most 4 reads for a campaign-scoped resource"
          - "The permission matrix tests are unchanged and green"
          - "pnpm lint, pnpm typecheck and pnpm test pass"

  # ---------------------------------------------------------------- wave 5: data model, continued
  - wave: 5
    tracers:
      - id: H14
        title: Character extras in a typed table
        timing: before-D5
        size: M
        goal: Character extras move from encoded frameTrackers keys to a characterExtras table with v.id references, typed args and access through permissionFor; deleting a character removes its extras by index (convex-data M5, M4; convex-functions d1; CD6).
        depends_on: [H11, H12]
        owns:
          - convex/characterExtras.ts
          - convex/characters.ts
          - convex/tables/characters.ts
          - convex/lib/validators/characterExtras.ts
          - convex/migrations/characterExtras.ts
          - src/lib/frames/extras/common.ts
          - src/lib/errors/character-extras.ts
          - tests/convex/character-extras.test.ts
        reads:
          - convex/lib/blobs.ts
          - convex/lib/functions.ts
          - convex/lib/trackers.ts
          - src/lib/frames/extras/**
        acceptance:
          - "characterExtras {campaignId, characterId: v.id('characters'), extra: literal union, schemaVersion, data} has a by_character_extra index"
          - "The migration moves every character:<id>:* frameTrackers row into the table and deletes the old row (test); beastFeast.cookbook stays campaign-level"
          - "All 7 v.any args are typed; an edit grant on a character allows editing its extras (test)"
          - "characters.remove deletes extras through by_character_extra (test)"
          - "No raw builders in characterExtras.ts; pnpm lint, pnpm typecheck and pnpm test pass"
      - id: H15
        title: codex.list read cost
        timing: before-D5
        size: M
        goal: codex.list returns summary fields from a bounded read (pins from mapTokens, long text in codexEntryText, count from a counter doc), and new campaigns are seeded on create instead of by a client effect (convex-data H3; client M4; CD12, CD14, TE6).
        depends_on: [H10, H07]
        owns:
          - convex/codex.ts
          - convex/tables/codex.ts
          - convex/lib/codex.ts
          - convex/lib/validators/codex.ts
          - convex/migrations/codex.ts
          - convex/campaigns.ts
          - src/app/(gm)/campaigns/[campaignId]/codex/entry-detail.tsx
          - src/lib/codex/view.ts
          - src/lib/errors/codex.ts
          - tests/convex/codex.test.ts
          - tests/convex/codex-read-budget.test.ts
        reads:
          - convex/lib/maps.ts
          - convex/lib/blobs.ts
          - convex/lib/functions.ts
          - src/lib/codex/schema.ts
          - src/lib/codex/seed.ts
        acceptance:
          - "gmn and pdesc live in codexEntryText, loaded by a codex.entryText query that entry-detail uses; codex.list never reads the map document"
          - "create, seed and importPins check the entry count through a per-campaign counter, not a full collect"
          - "With 500 max-size entries, codex.list stays under the read budget (codex-read-budget test)"
          - "campaigns.create seeds the frame's characters through lib/codex.ts seedCodex; codex.seed stays idempotent for older campaigns"
          - "The patch arg is typed; entries have schemaVersion; imageUploadUrl is rate-limited; the player list has a returns validator"
          - "tests/e2e/codex.spec.ts passes; pnpm lint, pnpm typecheck and pnpm test pass"

  # ---------------------------------------------------------------- wave 6: cleanup + close out the wrapper migration
  - wave: 6
    tracers:
      - id: H16
        title: Cleanup crons (operations TTL, campaign purge, orphan uploads)
        timing: before-D5
        size: M
        goal: Internal crons expire operations after 7 days, purge campaigns deleted more than 30 days ago (every campaignId row and its blobs), and sweep storage blobs that no files row claims (convex-data M2, M3; convex-functions M1, L9; CD17, CD18).
        depends_on: [H07, H10, H11, H14, H15]
        owns:
          - convex/crons.ts
          - convex/cleanup.ts
          - convex/tables/operations.ts
          - tests/convex/cleanup.test.ts
        reads:
          - convex/schema.ts
          - convex/tables/**
          - convex/lib/files.ts
          - convex/lib/operations.ts
        acceptance:
          - "No cron is pinned to minute 0; every job is internal, deletes in batches of at most 500 and reschedules itself until done"
          - "operations has a by_createdAt index; rows older than 7 days are deleted (test with fake timers)"
          - "After a purge, no table whose validator has a campaignId field holds the purged id, and its files blobs are gone (the test iterates the schema tables)"
          - "An unclaimed _storage blob older than 2 hours is deleted, while a claimed one is kept (test)"
          - "The task doc lists the docs/data-model.md changes for the orchestrator (no hard delete becomes a 30-day purge; operations is no longer a trail)"
          - "pnpm lint, pnpm typecheck and pnpm test pass"
      - id: H17
        title: Retire lib/access.ts, drop redundant indexes, add a schema guard
        timing: before-D5
        size: S
        goal: The last role-only authorization path is gone, prefix-duplicate indexes are dropped, and a schema guard test locks in no v.any, no duplicate indexes and a retention list (convex-data L2; convex-functions d1; CD1, CD15, CF2).
        depends_on: [H07, H08, H09, H10, H11, H12, H14, H15]
        owns:
          - convex/lib/access.ts
          - convex/tables/campaigns.ts
          - eslint.config.mjs
          - tests/convex/schema-guard.test.ts
        reads:
          - convex/**
        acceptance:
          - "convex/lib/access.ts is deleted, with no importers left"
          - "campaignMembers.by_campaign and campaignInvites.by_campaign are removed"
          - "The schema guard fails on a v.any field outside the allowlist (operations.result), on a prefix-duplicate index, and on a growing table missing from the retention list"
          - "pnpm lint reports zero raw-builder warnings in convex/ (the rule stays a warning by decision); no-restricted-syntax warns on v.any in args and on 'as Id<'"
          - "pnpm lint, pnpm typecheck and pnpm test pass"

  # ---------------------------------------------------------------- wave 7: client, part 1
  - wave: 7
    tracers:
      - id: H18
        title: Error and loading boundaries; campaign preload
        timing: after-D5
        size: M

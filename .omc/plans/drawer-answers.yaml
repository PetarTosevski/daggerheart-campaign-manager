# Drawer-answers plan (follow-up to plan sheet-drawer, bead dcm-bxp.99.19): every user answer of 2026-10-29 / 2026-10-30
# that needs a code change, the Beastform integration (dcm-bxp.99.19.6, B1), the runner gap dcm-d95 (Warden's Protection),
# and the orchestrator wiring and bugs left over from SD4 / SD5 / SD6 / SD8 / CA8.
# Status: DRAFT 2026-10-30, for the user to approve.
# Format: docs/workflow.md. Extra keys per tracer (plan-check ignores them): title, size (S | M | L), foundation, closes.
# Book pages: CB = Core Book, HF = Hope & Fear, PRINTED pages ("===== PAGE N =====" in .reference-private/text holds printed
#   page N-1). Each tracer re-checks the pages it cites and quotes them in its task doc; never commit the books.
#
# Binding carry-overs (plan sheet-drawer and combat-actions): U1 players see hit / miss only; U4 automatic, GM undo; Q1
#   out-of-range -> GM sanction; Q2 line of sight; Q6 every halving rounds up; Q13 situational conditions are a check box;
#   CB p.107 "the player controlling the effects ... can apply the effects in any order".
#
# Cross-plan sequencing (orchestrator):
#   - sheet-drawer waves 5-6 (SD7, SD-C, SD-A, SD-H, SD9) stay in sheet-drawer.yaml; the answers that belong to them are
#     extra acceptance lines there (see the planner's report), not tracers here.
#   - Overlaps with sheet-drawer wave 5: SD-H owns src/components/combat-map/actions/hand/roll-options.tsx (inside DA6's
#     actions/hand/**) and convex/lib/rolls.ts; SD-A owns convex/lib/featureRunner.ts and convex/lib/combatVision.ts
#     (DA10 / DA12 own featureRunner.ts); SD7 owns src/components/combat-map/drawer/use/** (no tracer here owns it).
#     Run SD-H after DA6, and SD-A after DA12, or not at the same time.
#   - Vocabulary rule (as SD0 / SD1): only DA0 changes src/lib/domain/card-effects/types.ts here, widen only. A tracer that
#     finds another gap writes a manual step and files a bead labelled feature-effects vocabulary-gap.
#   - No tracer here changes convex/schema.ts: stored additions are optional fields on existing validators (widen only, rule
#     7) or new kinds of combatRequests rows. docs/data-model.md is updated by the orchestrator from each tracer's report.
# Paths: C = src/app/(gm)/campaigns/[campaignId] (written out in full below).

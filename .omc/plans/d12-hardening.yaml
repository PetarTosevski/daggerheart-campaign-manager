          - "a11y.ts exports expectNoSeriousA11yViolations(page, { include?, exclude?, reason? }) with tags wcag2a, wcag2aa, wcag21a, wcag21aa, wcag22aa (an exclude without a reason throws), TABLET_VIEWPORTS (768x1024, 1024x768), expectFitsViewport(page) and expectTouchTargets(locator, 44)"

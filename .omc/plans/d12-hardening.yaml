# QUESTIONS pending user answer, defaults in d12-analysis.md
#
# D12 plan: Hardening and docs (bead dcm-bxp.11). Roadmap row: live-update e2e, unauthenticated sweep test, accessibility
# and tablet pass, settings backup/restore, README and AGENTS (docs/design-port-roadmap.md).
# Analysis: .omc/autopilot/d12-analysis.md (function inventory: 355 wrapped public functions in 54 modules + 3 Convex Auth
#   exports; matrix design; sweep; live-update scope; a11y/tablet scope; backup options; table removal; error list; QUESTIONS).
# Folded beads: dcm-bxp.51, .57, .64, .79, .88 (authz-matrix entries), .23 (deprecated upload tables), .29 (string-payload
#   errors and RETURNS_PENDING), dcm-t30 (unit timeouts under load). dcm-bxp.21 is already done (analysis section 9; H24 closes it).
# Absorbed from .omc/plans/hardening.yaml (never built): H18 (route error boundaries, rule 11), H24 (axe), H25 (authz matrix),
#   H33 (README). The rest of hardening waves 7-12 stays there (Q8).
# Starts after: N9 (d11-notes), P10 (sprite-packs), M1 (map-movement) are merged. Their files (e2e specs,
#   src/components/combat-map/tokens/**, map-view/**, src/lib/combat-map/painter.ts and sprites/**, notes page.tsx/notes.css)
#   are free again by then; no D12 tracer starts before they merge.
# Format: docs/workflow.md. Extra keys per tracer (plan-check ignores them): title, size (S | M | L), foundation.
# Every tracer owns its docs/tasks/TASK-D12-<id>.md. The orchestrator updates docs/data-model.md at merge time unless the
#   tracer owns it (only H16 does).
# Matrix rule for every area tracer (H5-H14): own only tests/convex/authz/<area>.entries.ts and <area>.test.ts; move every
#   name of the area from `pending` to `entries`; leave `pending` empty. A real authorization bug is NOT fixed in the area
#   tracer (it owns no convex/ file): file a bead, give the entry the CORRECT expectation plus `knownBug: "<bead id>"` (the
#   harness runs it as it.fails), and list it in the task doc.
# Paths: C = src/app/(gm)/campaigns/[campaignId] (written out in full below).
# USER ANSWERS (2026-10-21, binding): "default" for all 15 QUESTIONS in .omc/autopilot/d12-analysis.md (settings-only backup as
#   copy-and-paste text; Reset settings; generated signed-out + stranger sweep; four roles plus another player and an edit-grant
#   player; one file per area plus authz-matrix.test.ts; zero serious/critical axe findings; 768x1024 and 1024x768; only error
#   screens, axe, README and the matrix from hardening.yaml; drop the old upload tables; close dcm-bxp.21; lighter slow tests with
#   one 15 s limit; the listed live-update checks; drop plain-text errors; short README; remove the AGENTS.md 'keep UI minimal' line).
plan: d12-hardening
waves:
  # ---------------------------------------------------------------- wave 1: foundations and independent fixes
  - wave: 1
    tracers:
      - id: H0
        foundation: true
        title: Authz matrix harness, argument synthesizer, world fixture and inventory guard
        size: M
        goal: authz-matrix.test.ts compares the runtime inventory of public functions with the union of every area's entries, pending names and EXEMPT, so an unlisted function fails CI; the harness runs any area's entries for anon, outsider, player, otherPlayer, grantee and GM on fresh worlds with arguments synthesized from each function's own validator.
        depends_on: []
        owns:
          - tests/convex/authz-matrix.test.ts
          - tests/convex/authz/harness.ts
          - tests/convex/authz/world.ts
          - tests/convex/authz/synth.ts
          - tests/convex/authz/inventory.ts
          - tests/convex/authz/*.entries.ts
          - tests/convex/authz/*.test.ts
          - tests/convex/authz-synth.test.ts
          - tests/convex/helpers.ts
          - tests/fixtures/characters.ts
          - docs/tasks/TASK-D12-H0.md
        reads:
          - convex/lib/functions.ts
          - convex/lib/permissions.ts
          - convex/schema.ts
          - convex/tables/**
          - convex/**
          - tests/convex/setup.ts
          - tests/convex/schema-guard.test.ts
          - tests/e2e/visual/helpers.ts
          - .omc/autopilot/d12-analysis.md
          - docs/best-practices.md
        acceptance:
          - "inventory.ts: publicFunctions() returns every isPublic query/mutation/action as '<module>:<export>' (355 + 3 auth exports on the D12 start commit, count recorded in the task doc) and wrapperOf(name) reads the wrapper from the module's raw source"
          - "synth.ts builds valid args from fn.exportArgs() (ids from world.idOf(table), NAME_HINTS for v.string ids such as characterId/entryId/mapId/tokenId/sessionId/pageId, fresh idempotencyKey, first union member); authz-synth.test.ts proves it on a gm, a view, an own and a scoped function, and that an area file can extend NAME_HINTS and the world through its own setup without editing harness.ts"
          - "world.ts buildWorld({ frameId }) creates GM, playerA (owns characterA), playerB (owns characterB), outsider and one campaign through the public API, plus an edit grant for the grantee row"
          - "harness.ts: class defaults for gm, view, edit, own, user and maybe exactly as analysis section 2.3; scoped entries must state every role; okCodes may not contain UNAUTHENTICATED, NOT_FOUND or FORBIDDEN; errors are asserted on ConvexError.data.code as an object; mutations and actions run on a fresh world per role; knownBug entries run as it.fails"
          - "One <area>.entries.ts and one <area>.test.ts stub per area of analysis section 1.4 (core, countdowns, characters, play, world, adversaries, combat, sessions, notes, trackers), each listing all of its functions in `pending`, plus EXEMPT for auth:signIn, auth:signOut and auth:isAuthenticated with reasons; pending names appear as it.todo"
          - "The guard fails on a missing name, a stale name, a name listed twice, and an access class that contradicts the wrapper (gm* -> gm, campaign* view -> view, edit -> edit, user* -> own/scoped/user, maybeUserQuery -> maybe); proven by temporarily deleting one pending name and by filing one gm function as view (recorded in the task doc)"
          - "core.entries.ts carries 3 worked entries (fear:adjust gm, campaigns:list user, characters:get own) moved out of pending, so the runner is exercised; each area file runs in 60 s or less on the full parallel pnpm test (measured, recorded)"
          - "pnpm lint, pnpm typecheck and pnpm test pass"

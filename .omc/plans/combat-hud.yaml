# Combat HUD plan (2026-11-01, revised after the user's answers the same day): build the user's approved Combat HUD
# design (reference/designs/combat-hud/, HANDOFF.md) into the Combat Map. Implements bead dcm-bxp.99.32 and folds in the
# combat-ui beads (see the briefs). Briefs, user answers, board-to-code map and data gaps: .omc/plans/combat-hud-briefs.md.
# Format: docs/workflow.md. Extra keys (plan-check ignores them): title, size, batch, boards, mode.
#
# Waves follow HANDOFF "Suggested build order": 1 foundation (tokens, primitives, switch, shell, data), 2 banners / Fear /
# rings / spotlight, 3 sheet panel + make-room + hand, 4 one picking pattern + action ring, 5 result / hit window / death
# move, 6 GM queue / stat block / Fear confirm, 7 blocked-state system, 8 tablet and phone, 9 cut-over.
#
# Rules for every tracer (details in the briefs):
#   - Rollout (user answer 11b): the HUD sits behind an opt-in switch (hud/flag.ts: per viewer, localStorage, plus
#     ?hud=1 / ?hud=0) until wave 8 is done. mode: add. HUD tracers ADD new components under
#     src/components/combat-map/hud/** and leave the classic UI and its specs working (switch off = today's page, every
#     existing spec passes unchanged). Wave 9 (cut-over) removes the classic UI, its specs and the switch.
#   - HUD tracers own VIEW files. Pure model files (hand/model.ts, reactions/model.ts, drawer/*/model.ts, attack/mods.ts,
#     adversary/model.ts, adversary/sight.ts), convex/** engine files and src/lib/domain/** stay with the engine lanes:
#     HUD tracers read them (a needed change -> bead for the lane). Server tracers here (HD1, HD2, HD3, HD4, H1.S, H5.3)
#     own only the files listed.
#   - Concurrency with lanes-2 wave 11: while a HUD wave runs, no engine tracer may own a file that wave owns (table in
#     the briefs). Few classic files are touched before wave 9 (page.tsx, tokens-layer.tsx, vision-layer.tsx, a few
#     server files), so engine lanes stay mostly free until the cut-over.
#   - Hard rules (HANDOFF): the hand's card face is the app's own (domains-tab dk-* face, actions/hand/face.tsx), states
#     only around it; players never see adversary numbers; out of range routes to the GM; banners and tokens are buttons.
plan: combat-hud

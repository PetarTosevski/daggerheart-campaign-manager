          - "Comment fix: src/lib/domain/combat-actions/damage.ts (header line 9 and the 'halve, round down' note near line 104) and src/lib/domain/adversary-actions/severity.ts line 19 say resistance halving rounds UP (CB p.107 'round up unless otherwise specified'), matching Math.ceil in encounters/damage.ts"
          - "Tracker UI shows 'Stress full' without Vulnerable in D5 Manual; unit tests per rule and mode; lint, typecheck, vitest (--maxWorkers=2) pass"
      - id: RR

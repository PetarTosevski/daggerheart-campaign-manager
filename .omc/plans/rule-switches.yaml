# Rule switches plan (2026-11-05): per-campaign rule modes in Campaign settings > House rules.
# Epic: bead dcm-jh6d, part A "homebrew vs automation" (absorbs dcm-bxp.134; folds in dcm-bxp.99.32.4 and .5).
# Inputs: .omc/plans/rule-registry-list.md (61 rules, 27 switchable), bd show dcm-bxp.134 (optional rules decided
# 2026-10-30), .omc/plans/overnight-questions.md "ANSWERS 2026-11-05". Briefs and open questions:
# .omc/plans/rule-switches-briefs.md.
# Format: docs/workflow.md. Extra keys (plan-check ignores them): title, size (S/M/L), rules (registry ids the tracer
# builds), needs ('answer Qn': a user answer from the briefs before the tracer starts; 'migration run': the orchestrator
# has run a migration on dev first).
#
# Binding user answers (2026-11-05): all 27 switchable rules + the decided optional rules; Manual = the app stops
# applying the rule and posts a GM-only feed note (no blocking prompt); variants not printed in the books are allowed
# where they fit, labelled "not in the books"; Book-only rules are read-only rows with their book page; GM and co-GM
# edit, players read; every rule switch is locked while a session is live (server refuses with RULES_LOCKED).
#
# Rules for every tracer (details: briefs, "Common rules"):
#   - First step in the worktree: git switch -C <branch> rebuild. Change only `owns`; pnpm tracer:guard rule-switches <id>.
#   - Engine code reads a mode only through ruleModesOf(campaign) (src/lib/rules) and writes a Manual note only through
#     postRuleNote (convex/lib/ruleModes.ts). Pure domain functions take the mode as a parameter whose default is the
#     Book behaviour, so an unwired call site keeps today's behaviour.
#   - Every public function: user* / campaign / gm wrappers, args + returns validators, no v.any; new public functions get
#     their own tests/convex/authz/rules-<area>.entries.ts (+ .test.ts); tests assert ConvexError.data.code.
#   - Host load: vitest with --maxWorkers=2 on the tracer's own test files (plus the files it touched), never the whole
#     suite in a worktree; the orchestrator runs the full suite after each merge.
plan: rule-switches
waves:
  # ------------------------------------------------------------------ wave 0: foundation
  - wave: 0
    tracers:
      - id: RS0
        title: "Rule registry, stored modes on the campaign, setter with the live-session lock, read query, Manual feed-note helper, authz"
        size: L
        rules: [registry, lock, notes]
        goal: "Nothing changes at the table yet, but every campaign now has a typed set of rule modes (all Book / optional rules off, Defined Ranges on), a GM or co-GM can change one between sessions (refused with RULES_LOCKED while a session is live), every member can read them, and engine code has one helper to read a mode and one to post a GM-only 'Manual' note in the feed"
        depends_on: []
        owns:
          - src/lib/rules/**
          - convex/lib/validators/ruleModes.ts
          - convex/tables/campaigns.ts
          - convex/campaigns.ts
          - convex/ruleSettings.ts
          - convex/lib/ruleModes.ts
          - convex/lib/validators/actionLog.ts
          - src/lib/errors/rules.ts
          - src/lib/errors/app-error.ts
          - src/lib/convex-errors.ts
          - tests/unit/rules/registry.test.ts
          - tests/convex/rule-settings.test.ts
          - tests/convex/rule-notes.test.ts
          - tests/convex/authz/rules.entries.ts
          - tests/convex/authz/rules.test.ts
          - docs/data-model.md
          - docs/tasks/TASK-RULES-RS0.md
        reads:
          - .omc/plans/rule-registry-list.md
          - .omc/plans/rule-switches-briefs.md
          - src/lib/frames/options.ts
          - src/lib/config/campaign-settings.ts
          - convex/campaignSettings.ts
          - convex/lib/sessions.ts
          - convex/lib/actionLog.ts
          - convex/feed.ts
          - convex/lib/functions.ts
          - convex/lib/permissions.ts
          - docs/best-practices.md
        acceptance:
          - "src/lib/rules/registry.ts (pure, bundled into Convex): RULES, one entry for each of the 61 rules of rule-registry-list.md (id such as 'fearFromRests', code 'F2', area, title, one-line 'what the app does', book refs [{ book: 'CB' | 'HF', page }], kind 'switch' | 'bookOnly' | 'appRule') and one entry for each decided optional rule (massiveDamage CB p.91, spotlightTracker CB p.89, fallingDamage CB p.168, underwater CB p.168, goldCoins CB p.104, fateRolls CB p.168, pcConflict CB p.168, horizonEncounterBonuses HF p.171 (Journey to Horizon only), sharedDomainCards CB p.21, definedRanges CB p.103), kind 'optional'; a switch rule lists its modes in order: 'book', its variants ({ id, label, notInBooks, ref? }), 'manual'; frame rules (W1-W7) name their frame and are hidden elsewhere. Mode sets follow the briefs' table (recommended answers to Q5-Q8 until the user answers)"
          - "resolveRuleModes(frameId, stored) returns every rule's mode: unset switch = 'book', unset optional = off except definedRanges = on, a rule of another frame = 'book' / off; ruleModesOf(campaign) wraps it; a drift test checks that every registry id has exactly one validator field and vice versa"
          - "Widen only (rule 7, CD4): campaigns gains ruleModes? = typed v.object of optional fields (convex/lib/validators/ruleModes.ts): each switch rule a v.union of its mode literals, each optional rule v.boolean(), spotlightTrackerTokens v.optional(v.number()) (validated 1-6 in the setter); no record, no JSON blob, no v.any"
          - "convex/ruleSettings.ts: set = gmMutation { change } where change is a v.union of one { key, value } object per field (rule 12: one field per call); the value must be a mode of that rule and the rule must exist in this campaign's frame (else SETTING_INVALID); a value equal to the resolved one writes nothing; while liveSession(campaign) is not null it throws RULES_LOCKED ('Rule switches change between sessions. End the session first.'); archived campaign refused by the wrapper (CAMPAIGN_ARCHIVED); returns null"
          - "ruleSettings.get = campaignQuery need 'view' returns { modes (resolved, typed), locked (a session is live), canEdit (gm or co-GM) } with a returns validator; players read it"
          - "Q17 (recommended a): campaigns.setOption (the frame's campaign options, written by House rules and the dashboard's Campaign Rules panel) refuses with RULES_LOCKED while a session is live too; drop this line if the user answers b"
          - "convex/lib/ruleModes.ts: ruleMode(campaign, id); postRuleNote(ctx, campaign, { ruleId, summary, characterId?, groupId?, actorId }) writes an actionLog row kind 'rule' (new literal, widened), visibility 'gm', ruleId (new optional field), never undoable on its own, undone with its action when it shares the action's groupId; players never receive it from feed.list (already public-only); co-GMs see it"
          - "src/lib/errors/rules.ts holds RULES_LOCKED with its message and joins the AppErrorCode union; tests assert codes"
          - "Authz entries for ruleSettings.get and .set (anonymous, outsider, player, GM, co-GM); docs/data-model.md documents campaigns.ruleModes and the actionLog 'rule' kind; lint, typecheck, vitest (--maxWorkers=2, own files) pass"
      - id: RD1
        title: "Migration: pin today's frame-switch values on existing campaigns before the defaults turn off"
        size: S
        rules: [lessLethal, transformations, enduranceCountdowns, remnantCorruption]
        needs: "answer Q1"
        goal: "Running campaigns in Castle High, Andaluria, Journey to Horizon and Motherboard keep their optional frame rule exactly as it is today (on unless the GM turned it off) when RD2 later makes new campaigns start with it off"
        depends_on: []
        owns:
          - convex/migrations/ruleDefaults.ts
          - tests/convex/migrations-rule-defaults.test.ts
          - docs/tasks/TASK-RULES-RD1.md
        reads:
          - convex/migrations/run.ts
          - convex/migrations/handSharing.ts
          - convex/lib/migrations.ts
          - src/lib/frames/options.ts
          - convex/tables/campaigns.ts
        acceptance:
          - "@convex-dev/migrations migration migrations/ruleDefaults:pinFrameOptions (CD5: batched, resumable, idempotent): for every campaign (deleted ones too) whose frame offers lessLethal / transformations / enduranceCountdowns / remnantCorruption and whose options lacks that key, writes options[key] = true; keys already set are untouched; other options untouched"
          - "Migration test: old shape in (no key, key false, key true, other frame), expected options out; second run writes nothing"
          - "The task doc gives the orchestrator the dry-run and run commands (convex/migrations/run.ts) for dev; prod only when the user deploys; lint, typecheck, vitest (--maxWorkers=2, own files) pass"
  # ------------------------------------------------------------------ wave 1: engine areas that do not share files

          - convex/tables/combatSpotlight.ts
          - convex/lib/fear.ts
          - convex/countdownRolls.ts
          - src/lib/rules/**
          - convex/lib/ruleModes.ts
        acceptance:
          - "convex/lib/rollAftermath.ts afterPcActionRoll(ctx, campaign, { characterId, kind, outcome, groupId }) is called once per PC action roll from every path bead dcm-bxp.99.32.4 lists: rolls.duality, the Tag Team (once, with the chosen roll, CB p.97), card and feature rolls (cardRunner / featureRunner), weapon attacks (lib/combatActions), the movement roll in lib/combatMovement; reaction rolls and GM rolls never call it"
          - "S1 Book (CB p.100, p.149): a failure or a roll with Fear calls moveToGm(reason 'failedRoll' | 'rollWithFear', characterId); a critical success never moves it. S1 Manual: no move; postRuleNote 'Mira rolled with Fear: take the spotlight?' / 'Mira failed: take the spotlight?' with the roll's groupId"
          - "R3 Book: unchanged (CB p.154, p.90). R3 Manual (Q2 a): the GM's Fear is not gained on a roll with Fear (no fearDelta on the row) and the note 'Mira rolled with Fear: gain 1 Fear?' is posted; the player's Hope still rises (Q2 a; rewrite if the user picks b or c)"
          - "Undoing the roll undoes its notes (shared groupId); undo putting the spotlight back stays bead dcm-bxp.99.32.10 (not here)"
          - "Tests per path for Book and Manual of both rules; existing roll tests pass unchanged with default modes; lint, typecheck, vitest (--maxWorkers=2) pass"
      - id: RDM
        title: "Damage rules in the pure damage modules and the encounter tracker: D2, D4, D5, D8, F3, Massive Damage; resistance comment fix"
        size: L
        rules: [D2, D4, D5, D8, F3, massiveDamage]
        goal: "In the encounter tracker the GM's campaign modes apply: resistance halves or the GM is told 'Target resists: halve?', a full Stress track marks 1 HP or the GM is told, a full Stress track makes the adversary Vulnerable or shows only 'Stress full', an adversary at its last HP is defeated or the GM is asked, each extra adversary spotlight takes 1 Fear or only warns, and Massive Damage (when on) marks 4 HP; the pure damage functions take the modes so the map's attack paths can pass them in wave 2"
        depends_on: [RS0]
        owns:

          - src/lib/domain/combat-actions/damage.ts
          - src/lib/domain/adversary-actions/severity.ts
          - src/lib/domain/characters/index.ts
          - convex/encounterTracking.ts
          - src/components/adversaries/tracker/**
          - tests/unit/rules/damage-modes.test.ts
          - tests/convex/rules-encounter-tracker.test.ts
          - docs/tasks/TASK-RULES-RDM.md
        reads:

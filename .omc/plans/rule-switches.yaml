          - convex/lib/fear.ts
        acceptance:
          - "Pure functions (damageTaken, markStress, hpForDamage / damageSeverity, isDefeated, vulnerableFromStress, the PC Vulnerable-from-Stress derivation in characters/index.ts, spotlightCostsFear) take a DamageRules / mode argument defaulting to Book, so every caller not yet wired behaves as today"

          - convex/lib/cardRunner.ts
          - convex/lib/featureRunner.ts
          - convex/combatCards.ts
          - src/lib/domain/dice/index.ts
          - tests/convex/rules-roll-aftermath.test.ts
          - tests/unit/rules/roll-aftermath.test.ts

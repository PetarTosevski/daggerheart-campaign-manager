# Countdowns-advanced plan (bead dcm-bxp.70, under epic dcm-bxp). The Core Book's countdown types on the dashboard countdowns:
# standard countdowns that tick on every PC action roll, dynamic progress / consequence countdowns that tick by the roll's outcome,
# chase countdowns as a linked pair, long-term countdowns with a track of foreshadowing steps that tick on a long rest, and the
# advanced features loop, increasing, decreasing and randomized starting value.
# Format: docs/workflow.md. Extra keys per tracer (plan-check ignores them): title, size (S | M | L), foundation.
# Book pages: CB = Core Book, PRINTED pages. In the extracted core.txt the "===== PAGE N =====" block holds printed page N-1
#   (checked 2026-10-21: the countdown rules sit in blocks 163-165 with footers 162, 163, 164; Tag Team in block 98, footer 97).
#   Each tracer that cites a page re-checks it (.reference-private/, pdfjs-dist; never commit the books) and quotes it in its task doc.
# Paths: C = src/app/(gm)/campaigns/[campaignId] (written out in full below).
# Status: DRAFT 2026-10-21. U1 is the user's decision (binding). QUESTIONS Q1-Q5 have defaults; a tracer whose acceptance cites a
#   Qn does not start until the user has answered or accepted that default.
#
# Rules from the book (binding; tracers quote the ones they implement in their task doc):
#   R1  Countdown die (CB p.162): 'Each time the countdown ticks down, turn the die to reduce its value by one. When the countdown
#       ticks down from 1 to 0 (which doesn't appear on the die), the countdown ends and triggers the event you were counting down to.'
#   R2  STANDARD COUNTDOWN (CB p.162): 'the die begins on a specific number (such as "Countdown 4") and ticks down every time a
#       player makes an action roll, regardless of the result. When the countdown die reaches 0, the countdown's effect triggers
#       immediately after the last action roll is resolved.'
#   R3  DYNAMIC COUNTDOWN (CB p.162): 'it's influenced by the outcome of their rolls or choices ... Typically, these countdowns have a
#       starting value of 5-10 ... either a progress countdown (if players are working toward a desired outcome) or a consequence
#       countdown (if players are trying to avoid a dreaded outcome). The Dynamic Countdown Advancement table suggests how much to
#       tick down the countdown die each time a PC makes an action roll.'
#   R4  Dynamic Countdown Advancement table (CB p.163), ticks per PC action roll as progress / consequence:
#       Failure with Fear 0 / 3; Failure with Hope 0 / 2; Success with Fear 1 / 1; Success with Hope 2 / 0; Critical Success 3 / 0.
#   R5  Randomized Starting Value (CB p.163): 'a "Countdown (1d6)" means that you roll 1d6 and use the result as the countdown's
#       starting value.'
#   R6  Loop (CB p.163): 'After this type of countdown triggers and you apply its effects, it resets to its starting value and begins
#       counting down again. For example, "Countdown (Loop 5)" resets after 5 ticks.'
#   R7  Increasing or Decreasing (CB p.163): 'Some countdowns repeat like loops, but the starting value ... increases or decreases
#       with each loop ... "Countdown (Increasing 8)" begins at 8, then after its effect triggers, the starting value resets to 9, then
#       10, and so on ... "Countdown (Decreasing 8)" begins at 8, then resets to 7, then 6, and so on. Once a decreasing countdown
#       reaches 0, a major event triggers.'
#   R8  CHASE COUNTDOWNS (CB p.163): 'set two countdowns: one for the pursuing party and one for the escaping party ... set that die
#       at its highest value. Next, select another die with the same starting value for the escapee's countdown, but set that die at
#       a lower value to reflect how much of a lead they have (1 lower for a small lead, 3 lower for a decent lead, 5 lower for a
#       substantial lead) ... each tick of the countdown could represent one range band ... Regardless of whether the PCs are
#       pursuing or escaping, their action rolls advance both countdowns, as shown on the earlier Dynamic Countdown Advancement
#       table. When a PC succeeds on an action roll, it ticks down their countdown, which is a progress countdown. When they fail on
#       an action roll - or roll a success with Fear - it ticks down the other party's countdown, which is a consequence countdown.'
#       (Book example: the PCs' d6 progress countdown starts at 6, the thief's consequence countdown at 3; a success with Hope ticks
#       the PCs' 6 -> 4, a failure with Fear ticks the thief's 3 -> 1.)
#   R9  LONG-TERM COUNTDOWNS (CB p.164): 'track long-term events during a campaign ... decide how far out the event should be
#       (usually between 4 and 12 ticks) and ... create small boxes for each tick. Starting from the first and working towards the
#       last, write some events that may occur along the way that foreshadow the final event. These steps can alternate between
#       softer and harder moves ... During a long rest, you should generally tick down a relevant long-term countdown once.'
#       (Book example tracker: a line per value 8, 7, ... 1, 0, the 0 line being the final event; '*' marks steps where news would
#       reach the party.)
#   R10 Tag Team (CB p.97): 'A Tag Team Roll counts as a single action roll for the purposes of any countdowns or features that track
#       action rolls.'
#   R11 Reaction rolls (CB p.99): 'Reaction rolls work similarly to action rolls, except they don't generate Hope, Fear, or additional
#       GM moves.' They are not action rolls, so they never advance a countdown.
#
# User decision 2026-10-21 (binding):
#   U1  'implement dynamic, chase long term countdowns & the advanced countdown features'. This supersedes the D2/D8 decision that
#       loop countdowns start at N and are restarted by hand.
#
# Derived rules (binding unless a QUESTION overrides them; tracers cite them as Dn):
#   D1  A countdown's mode: standard (1 tick per counted roll, R2), progress or consequence (R4 table), longTerm (never ticks on rolls;
#       ticks by hand or on a long rest, R9). A stored countdown without a mode is standard and unarmed: it behaves exactly as today.
#   D2  Counted rolls: a PC's action roll (rolls.actionRoll and manualRoll with kind 'action'), and an applied Tag Team result ONCE for
#       the pair (R10: rolls.tagTeamApply, with the chosen roll's outcome). Never: reaction rolls (R11), Tag Team rolls still waiting
#       for their pick, damage rolls, GM free rolls (adversary rolls are not PC action rolls), undone rows.
#   D3  The outcome is the roll as recorded (RollRecord.outcome). An action roll without a Difficulty is recorded as a success by
#       actionOutcome (src/lib/domain/duality.ts) and counts as one; a later change of the outcome (Witch's Charm) is not re-applied.
#   D4  Armed = ticks automatically. Standard, progress, consequence and chase countdowns tick on counted rolls while armed and
#       active (Q1); a longTerm countdown ticks on a finished long rest while armed (Q3). Paused, completed and cancelled countdowns
#       never tick automatically. Frame-owned countdowns (ownerKey set: objectives, Lycanthropy, projects) are never armed and never
#       ticked by rolls or rests. Countdowns created by the dashboard dialog and by an environment's Start button are armed by
#       default (the dialog has the box); countdowns.create without `armed` (old callers, tests) stays unarmed.
#   D5  One roll ticks one countdown at most once: a (roll row, countdown) pair is recorded in `countdownTicks`; the automatic tick
#       and the feed button never double up (COUNTDOWN_RULE on a second apply). A Tag Team result is keyed on its group's first
#       result row.
#   D6  The tick is applied in the same mutation as the roll, after the roll's Hope, Stress and Fear (R2 'immediately after the last
#       action roll is resolved'); a tick larger than the value left stops at 0 (a dynamic tick of 3 on 2 left triggers, it does not
#       carry over).
#   D7  Triggering (Q2 default): reaching 0 triggers. A non-repeating countdown completes (status 'completed', completedAt, as
#       today). A loop resets to its starting value, increasing to start + 1, decreasing to start - 1, in the same mutation, staying
#       active; triggerCount + 1, lastTriggeredAt set. A decreasing countdown whose next start would be 0 instead completes for good
#       with the notice 'major event' (R7). Every trigger writes a history row (action 'trigger') and one feed notice row (actionLog
#       kind 'countdown', visibility 'gm', undoable false): '<name> triggered (2nd time): <consequence>'. A manual Tick -1 to 0
#       triggers the same way. Increasing has no cap below 100 (MAX_COUNTDOWN_START 20 caps only what the GM types or rolls).
#   D8  Randomized start (R5): the server rolls the dice (convex/lib/dice rollDice) at creation; the formula is kept on the row. A
#       repeating countdown with dice resets to the value rolled at creation (Q4 default).
#   D9  Chase (R8): two rows linked to each other; both store the same startingValue N; the pursuers' currentValue is N, the
#       escapee's N - lead (lead 1 small, 3 decent, 5 substantial, or a typed number 1..N-1). The PCs' row is mode progress, the
#       rivals' row mode consequence, whether the PCs pursue or escape; one counted roll ticks both by the R4 table. The chase ends
#       when either row reaches 0 (it completes; the card says 'Caught' or 'Got away' from the PCs' role); afterwards neither row ticks
#       automatically until the GM reopens the completed one (Borrowed Time). Chase rows never repeat. Arm, visibility and cancel act
#       on the pair.
#   D10 Long-term (R9): mode longTerm, starting value 1..20 (the dialog suggests 4-12), a track of optional steps: one entry per value
#       from the start down to 0 ({ value, text <= 200, news?: true } where news marks a step that reaches the party). Ticks by hand
#       (existing Tick -1 / Borrowed Time) and once per finished long rest while armed (Q3); an interrupted long rest does not tick.
#       Steps are GM-only: players never receive their text.
#   D11 Undo (Q5 default): undoing a roll or a rest (actionLog.undo, rests.undo, both through undoEntry) takes back the ticks recorded
#       for its rows, newest first, for each countdown that has not changed since the tick (its state equals the tick's `after`);
#       a changed countdown keeps its value. A taken-back trigger restores the value, start, status and triggerCount from before and
#       marks its notice row undone; each revert writes a compensating history row (action 'undo'). The undo results keep their shape.
#   D12 Players (existing presets apply, CV1): mode, repeat and triggerCount travel with 'progress' (blanked when progress is hidden);
#       armed, the dice formula and the long-term steps are GM-only (null for players); a chase pair shares one visibility. Feed
#       notices are GM-only.
#
# Existing behaviour to keep (tests exist; tracers extend, never weaken):
#   E1  applyCountdownAction rules (manual advance / reverse +-1, correction by any amount also while paused, a completed countdown
#       reopens only by a positive reverse or correction, reaching 0 completes once, cancelled is final) and their unit tests
#       (tests/unit/countdown-domain.test.ts, countdown-validation.test.ts).
#   E2  Categories threat / project / consequence / other, MAX_COUNTDOWN_START 20 for created values, the three visibility presets and
#       server-side redaction (countdownForPlayer; tests/convex/countdowns.test.ts, tests/e2e/visual/CV1.spec.ts, players.spec.ts).
#   E3  Every countdown change writes one history row in the same mutation (tests/convex/history.test.ts); history rows of old
#       countdowns read unchanged.
#   E4  Environment Start (convex/environmentActions.ts startCountdown): name, description, category, Private, dice rolled at start;
#       its arguments and result keep their shape (tests/convex/environment-actions.test.ts, tests/e2e/environments.spec.ts).
#   E5  Frame-tracker countdowns (ownerKey/kind/revealed: Five Banners objectives, Lycanthropy, Work on a Project ticks in
#       convex/rests.ts) are untouched and stay off the dashboard list (tests/convex/five-banners.test.ts, rests.test.ts,
#       rest-frame-hooks.test.ts).
#   E6  rolls.actionRoll / manualRoll / tagTeam / tagTeamApply / damageRoll and actionLog.undo keep their arguments and results;
#       tests/convex/rolls.test.ts, rolls-session-features.test.ts and every dice e2e pass unchanged.
#   E7  The dashboard list, its dialog and card look and work as today for a countdown without the new fields
#       (tests/e2e/dashboard.spec.ts, sessions-flow.spec.ts, session-wrap.spec.ts, visual D10-S6).
#
# Data model (K0 creates every field; widen only, every new field optional, no migration, no shape edited in place):
#   countdowns (convex/tables/countdowns.ts) gains:
#     mode?: 'standard' | 'progress' | 'consequence' | 'longTerm'   absent = standard (D1)
#     armed?: boolean                                              absent = false (D4)
#     repeat?: 'loop' | 'increasing' | 'decreasing'                absent = none (R6, R7)
#     initialValue?: number        the first starting value ('Increasing 8'); startingValue is the current cycle's start
#     startDice?: { count: 1..4, sides: 4 | 6 | 8 | 10 | 12 | 20 }  the randomized formula (R5, D8)
#     triggerCount?: number, lastTriggeredAt?: number                (D7)
#     chase?: { partnerId: Id<'countdowns'>, side: 'party' | 'rivals', party: 'pursuing' | 'escaping' }   (D9)
#     steps?: array (<= 21) of { value: int 0..20, text: string <= 200, news?: boolean }   longTerm only (D10); bounded by the start,
#       so an array in the row, not a table (rule 6 covers growing collections only)
#     new index by_campaign_armed [campaignId, armed]: the roll and rest paths read only armed countdowns
#   countdownTicks (new table, convex/tables/countdowns.ts): one row per countdown change caused by a log row (D5, D11):
#     { campaignId, countdownId, entryId: Id<'actionLog'>, source: 'roll' | 'feed' | 'rest', amount, before, after (each
#       { currentValue, startingValue, status, triggerCount }), noticeId?: Id<'actionLog'>, revertedAt?: number, at }
#     indexes by_entry [entryId], by_entry_countdown [entryId, countdownId], by_campaign_at [campaignId, at]. Grows with play:
#     deleted with its campaign in convex/cleanup.ts (as actionLog); no TTL (it is the undo record of live rows).
#   history (convex/tables/history.ts): countdownValue gains startingValue?: number (a reset changes the start; old rows read as is).
#   actionLog (convex/lib/validators/actionLog.ts): actionKindValidator gains 'countdown' (trigger notices).
#   No new error module: refusals use COUNTDOWN_RULE, INVALID, NOT_FOUND, FORBIDDEN; a tracer needing another code stops and reports.
#   docs/data-model.md is updated by the orchestrator from K0's report.
#
# Shared files: src/lib/domain/countdowns/**, src/lib/validation/countdowns.ts, convex/tables/countdowns.ts, convex/tables/history.ts,
#   convex/lib/validators/actionLog.ts, convex/lib/actionLog.ts (the undo hook), convex/lib/countdownTicks.ts (the one server path that
#   ticks, triggers, resets, records history, notices and reverts) and convex/cleanup.ts belong to K0 only; later tracers read them and
#   stop and report when one needs a change. K0 also splits C/countdowns.tsx into C/countdowns/ (index.tsx, card.tsx, new-dialog.tsx,
#   visibility.tsx) without changing behaviour, so the UI tracers own disjoint files. convex/countdowns.ts belongs to K0 (view and
#   create), then K2 (wave 2), then K3 (wave 3).
#
# Out of scope (K5 files beads; ask the user before designing them): Start buttons for adversary stat-block countdowns (SRD adversaries
#   name 'Countdown (Loop 1d6)', 'Countdown (Decreasing 8)', 'Countdown (1d12)'); turning frame-tracker countdowns into new modes;
#   authz-matrix entries (D12 of the rebuild).
#
# USER ANSWERS Q1, Q2, Q4, Q5 (2026-10-21, binding): all recommended defaults - Q1 (c) armed countdowns tick automatically AND the
#   GM's feed button; Q2 (a) trigger at once, repeating countdowns reset immediately, GM-only notice; Q4 (a) a randomized loop resets to
#   the value first rolled; Q5 (a) undo takes ticks back when nothing changed the countdown since. Status: APPROVED.
# USER ANSWER Q3 (2026-10-21, binding): each long-term countdown has a switch "On long rest: Automatic / Reminder", default
#   Automatic. Automatic = option (a): it ticks once when a long rest finishes (an interrupted rest doesn't count). Reminder = option
#   (c): finishing the long rest only reminds the GM ("Tick <name>?" with a one-click tick), nothing moves by itself.
#   Owned by K4 (long-term) with the field in K0's data model (e.g. `restMode: "auto" | "remind"`, optional, absent = auto).
# QUESTIONS (defaults apply once the user accepts them; cited as Qn):
#   Q1  Which rolls advance a standard or dynamic countdown? (a) only rolls the GM applies afterwards from the roll feed ('Tick
#       countdowns' on an action-roll row); (b) armed countdowns tick automatically on every counted PC action roll (D2) while armed;
#       (c) both. DEFAULT (c): armed countdowns tick by themselves, and the feed button covers unarmed ones and rolls the GM wants to
#       count after the fact (each roll counts once per countdown, D5). Cited by K1, K2, K3.
#   Q2  What happens when a countdown reaches 0? (a) it triggers at once: a repeating one (loop / increasing / decreasing) resets
#       immediately and keeps counting, the card shows 'Triggered n times' and the GM's feed gets a notice; (b) it stops at 0 with a
#       'Triggered' banner and a 'Reset' button the GM presses after applying the effect, and rolls don't tick it until then.
#       DEFAULT (a) (D7); the notice is GM-only in both. Cited by K0, K1, K2.
#   Q3  Long-term countdowns on a long rest: (a) armed long-term countdowns tick once automatically when a long rest finishes; (b) the
#       rest's finish step lists them with a checkbox each and the GM picks; (c) never automatic, a reminder only. DEFAULT (a) (D10);
#       the GM disarms one that isn't relevant. Cited by K4.
#   Q4  A repeating countdown with a random start ('Countdown (Loop 1d6)'): on reset, (a) go back to the number rolled at the start, or
#       (b) roll again each time. DEFAULT (a) (D8, the book's 'resets to its starting value'). Cited by K0.
#   Q5  Undoing a roll (or a rest) that ticked countdowns: (a) the ticks are taken back too, when the countdown hasn't changed since;
#       (b) the ticks stay and the GM corrects by hand (as Work on a Project ticks today). DEFAULT (a) (D11). Cited by K0, K1, K4.
#
# Rules for every tracer (part of every acceptance list, not repeated):
#   - Every new or changed public function uses the wrappers in convex/lib/functions.ts (keyedGmMutation / campaignQuery / gmQuery;
#     keyedUserMutation only where the existing function already is one); access only through permissionFor. Identity from ctx.user.
#   - `args` and `returns` validators on every new function and on every changed one, no v.any(); schema-guard RETURNS_PENDING never
#     grows.
#   - Its own Convex test covers anonymous, outsider, player and GM for each new or changed function, with the codes
#     tests/convex/countdowns.test.ts asserts for those roles, through the errorCode helper (ConvexError.data.code), never message text.
#   - Intents only: ids, a mode, a single field, a lead size, a step's value and text; the server rolls every die, computes every tick
#     amount, trigger and reset through K0's domain; the client never sends a value to store. Optimistic updates on arm, manual ticks,
#     the feed apply and step edits (computed with the same domain functions; no second copy of a rule).
#   - Indexed reads only (no .filter on queries), bounded takes; no Date.now() in queries.
#   - Every useQuery subtree sits inside an error boundary; loading uses the shared Loading with role=status.
#   - UI in the dashboard's existing countdown look; 1440 and 1024 px layouts; 390 px: one column, no horizontal page scroll, touch
#     targets >= 44 px, a label on every control, keyboard reachable.
#   - Visual acceptance for UI tracers: tests/e2e/visual/CD-<id>.spec.ts (tag @visual, E2E_VISUAL=1) shoots its regions at 1440x900,
#     1024x768 and 390x844; the task doc lists the shots with a verdict per region and every deliberate deviation.
#   - pnpm lint (zero warnings in convex/), pnpm typecheck, pnpm test and the tracer's own e2e specs pass in its worktree; the
#     orchestrator runs the full e2e suite after each wave.
#   - Every tracer owns docs/tasks/TASK-CD-<id>.md and quotes the R rules it implements with their pages.
plan: countdowns-advanced
waves:
  # ---------------------------------------------------------------- wave 1: data, pure domain, the one tick path, UI split
  - wave: 1
    tracers:
      - id: K0
        foundation: true
        title: Foundation - countdown fields and tick table, pure countdown rules, the server tick path with undo, dashboard split
        size: L
        goal: Countdowns carry mode, armed, repeat, dice, chase and track fields, a pure tested module answers every tick amount, trigger and reset, one server helper ticks, triggers, records and reverts countdown changes (hooked into undo), create and the list accept and show the new fields, and the dashboard countdown UI is split into files without changing what it does.
        depends_on: []
        owns:
          - src/lib/domain/countdowns/**
          - src/lib/validation/countdowns.ts
          - convex/tables/countdowns.ts
          - convex/tables/history.ts
          - convex/lib/validators/actionLog.ts
          - convex/lib/actionLog.ts
          - convex/lib/countdownTicks.ts
          - convex/cleanup.ts
          - convex/countdowns.ts
          - src/app/(gm)/campaigns/[campaignId]/countdowns.tsx
          - src/app/(gm)/campaigns/[campaignId]/countdowns/**
          - tests/unit/countdown-advanced.test.ts
          - tests/convex/countdown-ticks.test.ts
          - docs/tasks/TASK-CD-K0.md
        reads:
          - src/lib/domain/duality.ts
          - src/lib/domain/environments/index.ts
          - src/lib/srd/environments.ts
          - convex/lib/dice.ts
          - convex/lib/mechanics.ts
          - convex/lib/permissions.ts
          - convex/lib/functions.ts
          - convex/feed.ts
          - convex/rests.ts
          - convex/environmentActions.ts
          - tests/convex/countdowns.test.ts
          - tests/convex/history.test.ts
          - tests/unit/countdown-domain.test.ts
          - tests/e2e/dashboard.spec.ts
          - tests/e2e/visual/CV1.spec.ts
        acceptance:
          - "convex/tables/countdowns.ts gains the optional countdown fields, the by_campaign_armed index and the countdownTicks table of the data model; convex/tables/history.ts countdownValue gains optional startingValue; actionKindValidator gains 'countdown'; schema.ts needs no edit (the tables spread); every existing test passes unchanged (E1-E7)"
          - "Pure domain (src/lib/domain/countdowns, new modules beside index.ts, which keeps every export): rollTicks(mode, outcome) = 1 for standard, the R4 table for progress / consequence, 0 for longTerm and for 'none'; chaseTicks(pair, outcome) -> { party, rivals } by R4/R8; countsAsActionRoll(roll, context) per D2/D3; tickCountdown(state, amount) clamps at 0 (D6) and returns { next, triggered, reset, finished, notice } with loop / increasing / decreasing resets, the decreasing 'major event' end (R6, R7, D7) and start reuse for dice (D8, Q4); chaseEnded(pair) (D9); chaseStart(N, lead) -> pursuers N, escapee N - lead (R8 example 6 and 3); parseCountdownLabel(label) -> { mode, repeat, start: fixed n | dice, longTerm } for every label in src/lib/srd/environments.ts ('Countdown (Loop 1d4)', 'Long-Term Countdown (8)', 'Progress Countdown (4)', 'Consequence Countdown (6)', 'Countdown (Increasing 8)', 'Countdown (Decreasing 8)', 'Countdown (1d6)'); validateSteps(start, steps) (D10); countdownForPlayer extended per D12"
          - "src/lib/validation/countdowns.ts: countdownDetailsSchema gains optional mode, repeat, startDice (exactly one of startingValue or startDice), armed, steps (longTerm only, values within 0..start, text <= 200, at most one per value); repeat refused for longTerm; tests/unit/countdown-advanced.test.ts covers every rule above, the R4 table cell by cell and the book's chase example"
          - "convex/lib/countdownTicks.ts: applyTick(ctx, countdown, amount, cause: { source, entryId?, actorId }) patches the row through tickCountdown, writes one history row (action 'roll' | 'feed' | 'rest' | 'advance' | 'trigger'), on a trigger logs the GM-only notice row (D7), and with an entryId inserts the countdownTicks row (refusing a second tick of the same pair with COUNTDOWN_RULE, D5); revertTicks(ctx, entryIds) takes back unreverted ticks newest first when the countdown still equals `after`, restores before (value, start, status, triggerCount), marks the notice undone and writes a history 'undo' row (D11); undoEntry in convex/lib/actionLog.ts calls revertTicks for every row of the undone group, its result unchanged (E6, Q5)"
          - "convex/countdowns.ts: create gains the optional mode, repeat, startDice (rolled on the server with rollDice, capped 1..MAX_COUNTDOWN_START), armed and steps args (absent = today's countdown, D4); listByCampaign's view gains mode, armed, repeat, initialValue, startDice, triggerCount, lastTriggeredAt, chase and steps, redacted for players per D12; the returns validator says so"
          - "convex/cleanup.ts deletes a purged campaign's countdownTicks in its batched purge, like actionLog"
          - "tests/convex/countdown-ticks.test.ts: create with each new field for anonymous, outsider, player and GM; applyTick through a test mutation: standard tick, dynamic tick of 3 on 2 left (clamps, triggers), loop reset, increasing 8 -> 9, decreasing 1 -> major event and completion, dice start kept on reset, double tick refused, revert of a trigger, revert skipped after a later manual change, one history row per change; a player's list has no steps, armed or dice; a stored countdown without the new fields lists and operates as before"
          - "C/countdowns.tsx becomes C/countdowns/index.tsx (list, header, New button), card.tsx (one card), new-dialog.tsx and visibility.tsx; page.tsx's import './countdowns' still resolves; no visible or behavioural change: tests/e2e/dashboard.spec.ts, players.spec.ts and tests/e2e/visual/CV1.spec.ts pass unchanged"

  # ---------------------------------------------------------------- wave 2: rolls tick countdowns; the dashboard knows the types
  - wave: 2
    tracers:
      - id: K1
        title: Rolls tick countdowns - armed countdowns on every counted PC action roll, Tag Team once, the feed's Tick countdowns button
        size: M
        goal: A PC's action roll ticks every armed standard, dynamic and chase countdown by its outcome right after the roll resolves, an applied Tag Team counts once, reaction rolls never count, and the GM can apply any action roll in the feed to the countdowns of their choice, each roll at most once per countdown and taken back when the roll is undone.
        depends_on: [K0]
        owns:
          - convex/rolls.ts
          - convex/countdownRolls.ts
          - src/components/party/dice/roll-feed.tsx
          - src/components/party/dice/tick-countdowns.tsx
          - tests/convex/countdown-rolls.test.ts
          - tests/e2e/countdown-rolls.spec.ts
          - tests/e2e/visual/CD-K1.spec.ts
          - docs/tasks/TASK-CD-K1.md
        reads:
          - src/lib/domain/countdowns/**
          - convex/lib/countdownTicks.ts
          - convex/lib/actionLog.ts
          - convex/tables/countdowns.ts
          - convex/feed.ts
          - convex/countdowns.ts
          - tests/convex/rolls.test.ts
          - tests/convex/rolls-session-features.test.ts
        acceptance:

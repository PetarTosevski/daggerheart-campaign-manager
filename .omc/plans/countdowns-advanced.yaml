          - "tests/convex/countdowns-chase.test.ts covers createChase and the pair-wide operations for anonymous, outsider, player and GM, and: the book example (d6, thief at 3: a success with Hope moves the party 6 -> 4, a failure with Fear moves the thief 3 -> 1) through a real rolls.manualRoll; a success with Fear moves both; the pair stops after the thief reaches 0; undoing that roll reopens it (D11)"

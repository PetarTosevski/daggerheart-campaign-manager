        acceptance:
          - "card-effects/types.ts gains NV1-NV19 of the analysis section 3 as widen-only additions (no existing member renamed or narrowed): resources favor / focus / heldDie, a delegate step naming a D5 feature key, upgrades, adjustHpMarked, the new durations, triggers, requirements and gates, roll and damage changes, attacker-keyed defences, range modifiers, areas, dice-at-or-above, companion recipient, adversary-side mods, chosen-trait mods with a hold-count limit, scene limits, 'instead of Hope' conversions, target-adding riders, named Help; STEP_KINDS and the drift check stay exhaustive; no any"
          - "Every existing CE-* and AE-* table and test compiles and passes unchanged (types-widen.test.ts imports all of them)"
          - "feature-effects/types.ts defines FeatureEffect {featureId, source: hope | class | subclass | ancestry | community | beastform | transformation | stance, owner, card?: foundation | specialization | mastery, uses: CardUse[], upgrades?}; ids.ts builds '<source>:<owner>:<slug>' ids and the featureUses / cardTokens key 'feat:<featureId>[:<useId>]' (at most 60 characters, a test checks the longest)"

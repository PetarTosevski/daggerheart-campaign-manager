          - "features.entries.ts lists every new public function for anonymous, outsider, player (own and other character) and GM; tests assert ConvexError.data.code; the inventory guard passes"
          - "A table-driven convex-test runs one feature per group table that has entries at merge time (the orchestrator reruns it after wave 3)"

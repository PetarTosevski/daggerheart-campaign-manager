# Sheet-drawer plan (bead dcm-bxp.99.19): on the Combat Map a 'Sheet' button opens a side drawer over the live map (full
# screen on phones) with HP / Stress / Hope / Armor trackers and every Hope, class, subclass, ancestry and community feature
# with its Use button, FULLY AUTOMATED through effect tables run by the card-effect runner (map targeting, costs, limits,
# the reaction window, U1 hit/miss only, GM undo); a link to the full sheet for everything else.
# Status: APPROVED 2026-10-23. Analysis, inventory (217 features classified), vocabulary gaps NV1-NV19 and the answered
#   questions Q1-Q16: .omc/autopilot/sheet-drawer-analysis.md. Acceptance lists cite the answer they implement as (Qn).
#   USER ANSWER 2026-10-23: the drawer blocks launch (dcm-bxp.133).
# Format: docs/workflow.md. Extra keys per tracer (plan-check ignores them): title, size (S | M | L), foundation, answers.
# Book pages: CB = Core Book, HF = Hope & Fear, PRINTED pages ("===== PAGE N =====" in .reference-private/text holds printed
#   page N-1). Each tracer re-checks the pages it cites and quotes them in its task doc; never commit the books.
#
# Binding answers carried over from plan combat-actions: U1 players see hit / miss only; U2 map rolls in the feed; U4 automatic,
#   GM undo; U5 the book decides; Q1 out-of-range -> GM sanction; Q2 line of sight required; Q3 rest / long rest reset limits,
#   session does not; Q4 'on a success' consumes only on success; Q9 movement is a prompt; Q13/Q17 reaction window (target
#   armor + ally answers, GM 'Resolve now', no timer); Q14 the hit player sees their own damage and severity.
# Rules (analysis section 4): Hope features (CB p.90); spending resources and repeat activation, simultaneous effects,
#   incoming damage, rerolls, after-roll features, rounding up, end of the scene (CB p.107); usage limits (CB p.101); rests
#   (CB p.105); multiclass (CB p.110-111); mixed ancestry (CB p.71); temporary conditions (CB p.102).
#
# USER ANSWERS 2026-10-23 (binding; also on bead dcm-bxp.99.19): Q1-Q14 and Q16 option (a), Q15 option (b):
#   Q1 after-roll step on the player's own map rolls, only when an eligible after-roll feature is ready; Q2 before-roll prompt
#   for PCs holding a before-roll defence, after-roll answers in the reaction window; Q3 Not This Time in any hit's window when
#   the attacker is within Far of the wizard; Q4 companion token + Command; Q5 the 16 martial stances as rule data, Focus track,
#   automated; Q6 every halving rounds up (resistance too); Q7 scene ends with the encounter, a GM 'End scene' button or the
#   session; Q8 Act of Reprisal: the ally is within Melee of you; Q9 Sneak Attack and Cloaked from map positions and vision;
#   Q10 Beastform attack, Evasion and its 45 features automated; Q11 transformations in scope; Q12 named Help an Ally;
#   Q13 situational conditions confirmed by the player (check box); user note: Dedicated is the Orderborne community feature,
#   so only Orderborne characters have it; Q14 live map areas, Dark Cloud blocks sight; Q15 (b) out-of-combat features listed
#   as text plus existing D5 Use, social advantages as roll options, AND the rest-time features (Hardy, Efficient, Celestial
#   Trance, Oasis) automated in this plan (tracer SD-R on convex/rests.ts); Q16 a 'Flying' toggle in the drawer.
#
# Cross-plan sequencing (orchestrator):
#   - followups-8 (I1-I7) is merged into rebuild; no wait.
#   - hand-fan HF1 (.omc/plans/hand-fan.yaml, running) owns src/components/combat-map/actions/hand/**, actions/index.tsx,
#     actions/targets/**, actions/actions.css, src/components/cards/fan.ts and the domains tab section files. The only tracer
#     here that owns one of them is SD-H (actions/hand/roll-options.tsx): SD-H starts only after HF1 is merged (cross-plan
#     dependency, noted on SD-H; plan-check takes only same-plan ids in depends_on). SD7 reads actions/hand/** and should
#     run after HF1 too, so it builds on the fanned Hand.
#   - CA8 (dcm-bxp.99.4) and AA6 (dcm-bxp.99.9) own docs/game-interpretation.md; SD9 runs after both are merged.
#   - Shared files belong to SD0 only: src/lib/domain/card-effects/types.ts (vocabulary, widen only), the character / combat
#     request / combat map validators, convex/schema.ts, convex/cleanup.ts, convex/crons.ts, src/lib/errors/app-error.ts,
#     src/lib/convex-errors.ts, C/combat-map/page.tsx, src/components/combat-map/slots.ts, tests/convex/schema-guard.test.ts.
#     docs/data-model.md is updated by the orchestrator from each tracer's report.
#   - Vocabulary rule (as CE-*): only SD0 (types) and SD1 (runner) change the vocabulary; an FE-* tracer that finds a gap writes
#     a manual step with the feature's words and files a bead labelled feature-effects vocabulary-gap.
# Paths: C = src/app/(gm)/campaigns/[campaignId] (written out in full below).
plan: sheet-drawer

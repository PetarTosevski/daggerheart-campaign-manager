          - "combatFeatures.useFeature {characterId, mapId?, featureId, useId?, targetTokenIds, choices, roll?} is a keyed campaign mutation (need edit on the character; the GM for any character, CA6's switch): FEATURE_NOT_OWNED, FEATURE_EXHAUSTED, FEATURE_COST_UNPAID, FEATURE_NOT_COMBAT (passive / narrative uses), FEATURE_NEEDS_MAP (enemy targets without a live map); out-of-range targets become a GM sanction (combat-actions Q1); line of sight as cards (Q2)"

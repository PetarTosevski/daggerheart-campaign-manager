          - "src/lib/errors/combatFeatures.ts defines FEATURE_NOT_OWNED, FEATURE_EXHAUSTED, FEATURE_COST_UNPAID, FEATURE_NOT_COMBAT, FEATURE_NEEDS_MAP, FEATURE_STATE_MISSING, wired into AppErrorCode and the client message map"
          - "The Combat Map page shows a 'Sheet' button (top bar; bottom bar at 760 px and below) for a player with a PC on the map and for the GM with a PC token selected; it mounts the drawer stub from drawer/index.tsx, whose props and the drawer/use stub's props are documented in slots.ts"
          - "pnpm lint, typecheck and vitest pass; tracer-guard passes"

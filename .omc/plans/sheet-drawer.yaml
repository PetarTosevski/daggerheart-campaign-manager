          - "run.ts and availability.ts execute every NV1-NV19 piece for cards and features alike; every existing run / availability test passes unchanged; new tests take expected values from the book (CB p.107: Frontline Tank twice for 6 Hope clears 4 Armor Slots; CB p.99: 26 physical halved; Q6 rounding up for 'halve incoming damage')"

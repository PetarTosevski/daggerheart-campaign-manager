# Sheet redesign plan: rebuild the in-app character sheet to the Party board's sheet
# (reference/designs/project/Party.dc.html, markup lines 751-1195, CSS in the helmet), and place every feature added
# after the board (D5 and later) in the board's format.
# Analysis, screenshots and the placement map: .omc/autopilot/sheet-redesign-analysis.md (read it first).
# Format: docs/workflow.md. Extra keys per tracer (plan-check ignores them): title, size (S | M | L), timing.
#
# Paths: C = src/app/(gm)/campaigns/[campaignId]/party/[characterId] (written out in full below).
#
# Binding rules for every tracer (part of every acceptance list, not repeated):
#   - UI only. No file under convex/ changes, no Convex function, validator, table or argument changes; no change to
#     src/lib/validation/**, src/lib/domain/** or src/lib/srd/**. A design element that needs new data is out of scope:
#     stop and report it to the orchestrator (it is listed under "needs user confirmation" in the analysis).
#   - Accessibility is kept: every control keeps a visible or accessible label, roles stay correct (tablist/tab/tabpanel
#     with arrow keys, dialog with focus trap and Escape, group/radiogroup), all controls reachable by keyboard, focus
#     visible, touch targets at least 44 px on the 390 px layout.
#   - Permissions stay as now: controls the viewer cannot use stay hidden or disabled exactly as today (canEdit = owner
#     or GM, isGm for GM-only controls such as the level correction, "Return to play", Withered damage source).
#   - The 390 px layout must work: no horizontal page scroll (document.documentElement.scrollWidth <= 390), stacked
#     columns. The board itself breaks at 390 (its top grid overflows to 489 px); keep the app's stacked mobile order
#     and take only the board's look there.
#   - Accessible names and data-testids used by tests/e2e/** do not change after wave 1. If a tracer must change one,
#     it updates the specs it owns; a spec it does not own means stop and report.
#   - Styling: the board's tokens and primitives come from C/sheet.css and src/components/party/sheet-ui/ (wave 1).
#     Wave-2 tracers add CSS only in their own colocated .css file (imported by their own component) and never edit
#     C/sheet.css, C/sheet.tsx or the page-*.tsx compositions.
#   - Visual acceptance: the tracer's tests/e2e/visual/<id>.spec.ts (tagged @visual, run with E2E_VISUAL=1) shoots its
#     regions at 1440x900 and 390x844, scripts/board-shots.mjs shoots the matching board regions, and the task doc
#     docs/tasks/TASK-SR-<id>.md lists both sets of paths side by side with a verdict per region (layout, type, colour,
#     spacing; oh-my-claudecode:visual-verdict) and every deliberate deviation with its reason.
#   - pnpm lint, pnpm typecheck, pnpm test (including tests/unit/sheet-render.test.ts) and the e2e specs the tracer owns
#     or lists under acceptance pass in its worktree. The orchestrator runs the full e2e suite after each wave.
#   - Every tracer owns docs/tasks/TASK-SR-<id>.md and tests/e2e/visual/<id>.spec.ts.
#
# Decisions taken by this plan (the analysis marks the ones that still need the user):
#   - The sheet stays a route (/campaigns/<id>/party/<characterId>), not an overlay on the roster as on the board; it
#     takes the board's look: dark backdrop, parchment dialog-like paper, close button (x) top right linking back to the
#     roster in place of the board's closeSheet.
#   - Pages follow the board: "Character Sheet", "Story & Advancement", "Domains" (with sub-tabs "Domain Cards" and
#     "Heritage & Subclass"). Notes move to Story & Advancement.
#   - New board-look modals (level-up stepper, death move, Beastform and Companion sheets) use a parchment modal from
#     sheet-ui (the board's advPick and cs-sheet dialogs), not the dark brand Modal.
plan: sheet-redesign
waves:
  # ---------------------------------------------------------------- wave 1: shell foundation
  - wave: 1
    tracers:
      - id: S0
        foundation: true
        title: Board sheet shell, tokens, shared primitives, section split and mount points
        timing: core
        size: L
        goal: The sheet renders in the board's shell (paper, header with banner, page tabs Character Sheet / Story & Advancement / Domains with Domain Cards and Heritage & Subclass sub-tabs, level circle position, close button, board section order and grids), with every existing piece of content and every D5 slot moved into its board position in one file per section, shared board tokens and primitives available, visual tooling in place, and behaviour unchanged.
        depends_on: []
        owns:
          - src/app/(gm)/campaigns/[campaignId]/party/[characterId]/page.tsx
          - src/app/(gm)/campaigns/[campaignId]/party/[characterId]/sheet.tsx
          - src/app/(gm)/campaigns/[campaignId]/party/[characterId]/sheet.css
          - src/app/(gm)/campaigns/[campaignId]/party/[characterId]/sheet-context.tsx
          - src/app/(gm)/campaigns/[campaignId]/party/[characterId]/fields.tsx
          - src/app/(gm)/campaigns/[campaignId]/party/[characterId]/sheet-helpers.ts
          - src/app/(gm)/campaigns/[campaignId]/party/[characterId]/page-one.tsx
          - src/app/(gm)/campaigns/[campaignId]/party/[characterId]/page-two.tsx
          - src/app/(gm)/campaigns/[campaignId]/party/[characterId]/page-three.tsx
          - src/app/(gm)/campaigns/[campaignId]/party/[characterId]/damage-calculator.tsx
          - src/app/(gm)/campaigns/[campaignId]/party/[characterId]/sections/
          - src/components/party/sheet-ui/
          - src/components/party/features/index.tsx
          - src/components/party/level-up/index.tsx
          - src/components/party/extras/character-extras.tsx
          - src/components/party/dice/index.tsx
          - src/components/party/rest/index.tsx
          - src/components/party/death/index.tsx
          - src/components/party/wither/index.tsx
          - tests/e2e/character-sheet.spec.ts
          - tests/e2e/equipment-tiers.spec.ts
          - tests/unit/sheet-render.test.ts
          - tests/e2e/visual/helpers.ts
          - tests/e2e/visual/S0.spec.ts
          - scripts/board-shots.mjs
          - playwright.config.ts
          - docs/tasks/TASK-SR-S0.md
        reads:
          - reference/designs/project/Party.dc.html
          - reference/designs/CLAUDE.md
          - docs/design-port-roadmap.md
          - .omc/autopilot/sheet-redesign-analysis.md
          - src/components/party/slots.ts
          - src/components/brand/modal.tsx
          - src/app/(gm)/campaigns/[campaignId]/campaign-shell.tsx
          - tests/e2e/fixtures.ts
          - tests/e2e/**
        acceptance:
          - "Shell: dark backdrop, parchment paper max-width 1180 px (padding 24/28/32, radius 14), header row = domain banner (class name + domain icons/names) | tablist | level circle (66 px double ring) with the existing LevelUpButton mounted beside it | round close button (44 px, aria-label 'Close character sheet') linking to the roster; footer 'All changes save automatically.' / 'Updates live as the table plays.'"
          - "Tabs: role=tablist 'Sheet pages' with tabs 'Character Sheet', 'Story & Advancement', 'Domains' (arrow keys, roving tabIndex, aria-controls); Domains has a second tablist 'Card collections' with 'Domain Cards' and 'Heritage & Subclass' and count badges, in the board's dk-tabs style"
          - "Character Sheet page in board order: portrait arch (240 px column) + Experiences under it | identity grid (3 columns) + traits grid (3x2); Defence | Hope; Dice (full width); Hit Points & Stress | Active Weapons; Active Armor + Class Features | Downtime; frame extras region; status. Story & Advancement page: Wealth | Inventory (span 2); Character Description | Background Questions | Connections; Level Up region; Notes. Domains page: Domain Cards sub-tab (domains box, loadout felt, vault) and Heritage & Subclass sub-tab (heritage cards)"
          - "One file per section under C/sections/ with a colocated empty .css imported by it: header, identity, defence-hope, hp-stress, equipment, class-features, downtime, frame-extras, status, story, domains, heritage; page-one/two/three.tsx only compose sections"
          - "Mount points (stubs return null unless stated): HopeFeatureSlot (features/index.tsx) inside the Hope box, FeaturesPanel inside the Class Features box; AdvancementTiers (level-up/index.tsx) in the Level Up region of Story & Advancement; ClassExtras (Beastform, Companion) inside Class Features and FrameExtras (Motherboard, Beast Feast, Castle High) in the frame extras region, split from CharacterExtras with unchanged rendering; WitherCounter inside the Hit Points & Stress section; RestPicker inside the Downtime section; DeathMoveModal and death badges in the header section; SheetDiceBox in the Dice position"
          - "sheet-ui exports the board primitives for every later tracer: SheetBox (sh-box + sh-h heading rules), Label (sh-lbl), Small (sh-small), PaperInput/PaperTextarea/PaperNumber styles (sh-in, sh-ta, sh-num), Pill buttons (dmg-mark outline, solid, gradient roll), SlotRow (12-column pip grid), Pip kinds (heart, diamond, armor, coin, scar, sword), PaperModal (parchment dialog: Cinzel title, focus trap, Escape, 44 px controls), Launcher row (cs-launch + cs-open), Badge (FALLEN-style pill), EffectRow (dashed gold row with End button); the board's CSS tokens (paper, ink, gold, green, wine, blue) live once in sheet.css as custom properties"
          - "Behaviour unchanged: every mutation, permission check and existing control works as before; only tab names changed (old 'Domain Cards' / 'Heritage & Story' page tabs), and tests/e2e/character-sheet.spec.ts and tests/e2e/equipment-tiers.spec.ts are updated for them"
          - "tests/e2e/character-sheet.spec.ts, equipment-tiers, dice, dice-3d, class-features, class-features-hf, hope-features, level-up, rest, rest-frame-hooks, death, wither, motherboard-ikonis, party-roster and character-wizard specs pass"
          - "Visual tooling: tests/e2e/visual/helpers.ts (create a GM campaign of a given frame and a character through the UI like the specs, open the sheet, shoot(locator, name) at 1440x900 and 390x844 into test-results/visual/<tracer>/), playwright.config.ts skips @visual unless E2E_VISUAL=1, scripts/board-shots.mjs <region...> opens the board from disk (seeded Test Bard, reload once, 'Open character sheet') and shoots named board regions into test-results/visual/board/"
          - "S0's own visual spec shoots the whole sheet per page at 1440 and 390; at 390 there is no horizontal scroll"
  # ---------------------------------------------------------------- wave 2: restyle and place, one area per tracer
  - wave: 2

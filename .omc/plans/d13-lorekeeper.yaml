# DRAFT: QUESTIONS pending user answer (14 questions, defaults in .omc/autopilot/d13-analysis.md section 10)
#
# D13 plan: Chatbot "The Lorekeeper", an AI rules assistant (bead dcm-bxp.82).
# Board: reference/designs/project/Lorekeeper.dc.html (visual spec; layouts page / drawer / mobile; untracked, read only).
# Analysis: .omc/autopilot/d13-analysis.md (board inventory, data model, rules-source options, streaming choice, prompt and
#   context, safety, caps, model costs, QUESTIONS).
# Format: docs/workflow.md. Extra keys per tracer (plan-check ignores them): title, size (S | M | L), foundation.
# Paths: C = src/app/(gm)/campaigns/[campaignId] (written out in full below).
#
# Defaults this draft assumes (QUESTIONS 1-14):
#   Q1 rules source (a): private book text ingested locally into Convex (never git), Convex search index, citations on.
#   Q2 Sonnet 5.5 answers ('claude-sonnet-5-5', env LOREKEEPER_MODEL overrides), effort low; web fallback on misses with
#      the board's toggle defaulting to 'Search the internet too'.
#   Q3 private conversations per user; Q4 context = frame + asker's own characters + party classes + rulings, never GM-only
#   data for anyone; Q5 'Open in the book' = page text dialog; Q6 ingest via `pnpm lorekeeper:ingest`; Q7 house rules =
#   GM pages shared with everyone, off by default; Q8 'Ask the GM' -> lorekeeperAsks; Q9 caps 40/day/user, $10/month/
#   campaign, $25/month/deployment (env LOREKEEPER_MONTHLY_USD); Q10 90-day retention; Q11 Stop button; Q12 mobile fold;
#   Q13 page + drawer; Q14 GM-only pinning.
#
# Starts after: the tracers of d12-hardening, sprite-packs (P11Z), performance (PF7) and combat-actions that own
#   convex/lib/functions.ts, convex/schema.ts, convex/cleanup.ts, convex/crons.ts, src/lib/errors/app-error.ts,
#   src/lib/convex-errors.ts, tests/convex/schema-guard.test.ts, src/lib/campaign-sections.ts and C/layout.tsx are merged;
#   otherwise the orchestrator applies L0's / L7's small edits to those files at merge time (workflow 'Shared files').
#   D12 H0 (tests/convex/authz harness) should be merged first; if not, each tracer keeps its own role-table test and an
#   H0-era tracer folds it into tests/convex/authz/lorekeeper-*.entries.ts.
#
# Rules for every tracer (part of every acceptance list, not repeated):
#   - Public functions use convex/lib/functions.ts wrappers only: campaignQuery / campaignMutation (need 'view' for members;
#     gm* for GM-only) or userQuery for own-row reads; identity from ctx.user (CF3, CF4); args and returns validators, no
#     v.any(). Internal actions/queries/mutations are scheduled or run only as internal.* (CF9).
#   - ANTHROPIC_API_KEY is read only in convex/lib/claude.ts via the typed env inside handlers (CF19); never returned, logged
#     or put in an error; no NEXT_PUBLIC_ var; no file under src/ mentions ANTHROPIC.
#   - Indexed reads only (no .filter on queries; .take() with caps; counters, never .collect().length).
#   - Errors are ConvexError {code} from src/lib/errors/lorekeeper.ts (L0) plus common codes; a missing code = stop and ask.
#     Tests assert ConvexError.data.code, never message text.
#   - Each tracer's new public functions get matrix entries (anon, outsider, player, otherPlayer, GM) in its own
#     tests/convex/authz/lorekeeper-<area>.entries.ts + .test.ts (D12 H0 format).
#   - Book text is never committed: tests use the synthetic fixture tests/fixtures/lorekeeper/mini-book.txt (L0), invented
#     rules text, never quotes from the PDFs.
#   - No model call in any test: fetch is stubbed (vi.stubGlobal, as tests/convex/combat-map-generate.test.ts) or the e2e
#     fake model (LOREKEEPER_FAKE_MODEL, honoured only on E2E deployments) replays canned SSE.
#   - UI in the board's look (lorekeeper.css tokens from L0); every useQuery subtree inside an error boundary; loading via
#     the shared Loading (role=status); 390 px one column, no horizontal scroll, targets >= 44 px, reduced motion respected.
#   - No new dependency. pnpm lint (zero warnings in convex/), pnpm typecheck, pnpm test and the tracer's own e2e spec pass in
#     its worktree; one docs/tasks/TASK-D13-<id>.md per tracer.
# USER ANSWER Q1 (2026-10-21, binding): (a) the user's own rulebooks (Core Rulebook and Hope & Fear, provided) are the rules source -
#   private text ingested into the Convex deployment by a local script, never in git, searched per question, excerpts with page
#   numbers sent to the model. Q2-Q14 still pending.
# USER ANSWERS Q2-Q14 (2026-10-21, binding):
#   Q2 Sonnet 5.5 answers first; when Sonnet's answer is 'Not in your books' or 'Rules unclear', the server automatically retries
#      with Opus 5.5 (one retry, shown as 'Checked again with a stronger model'); the internet pass (toggle, as the board) runs only
#      after Opus also finds nothing.
#   Q3 conversations are PUBLIC to the campaign by default (everyone in the campaign can read them); the asker can set one private.
#      GM-only data still never reaches any prompt (Q4), so public conversations leak nothing secret.
#   Q10 conversations are kept; no automatic deletion and no retention cron for them (a few KB per answer: negligible storage).
#      Manual delete only by the asker of their own conversation (orchestrator default; user said 'no delete unless good reason').
#   Q9 caps: 40 questions per person per day; $50 per campaign per month; $150 per month server-wide (the user's Anthropic limit
#      is $200/month; $50 stays free for map generation and photo import); all changeable in settings without a deploy.
#   Q4-Q8, Q11-Q14: defaults. Plan status: APPROVED.
plan: d13-lorekeeper
waves:
  # ---------------------------------------------------------------- wave 1: foundation and pure domain
  - wave: 1
    tracers:
      - id: L0
        foundation: true
        title: D13 foundation - tables, validators, error codes, rate limit, Claude streaming client, stubs, retention, route shell, nav item
        size: L
        goal: The Lorekeeper tables exist and are purged with their campaign and expired by cron, the lorekeeperAsk rate limit and every D13 error code are defined, convex/lib/claude.ts streams a Messages API reply (SSE parsed, usage returned, timeout, fake model on E2E only), the context / retrieve / caps / web hooks exist as stubs, and /campaigns/<id>/lorekeeper opens the board-look shell with slots for GM and players.
        depends_on: []
        owns:
          - src/components/lorekeeper/chat/index.tsx
          - src/components/lorekeeper/side/index.tsx
          - convex/convex.config.ts
          - convex/schema.ts
          - convex/tables/lorekeeper.ts
          - convex/lib/validators/lorekeeper.ts
          - convex/lib/claude.ts
          - convex/lib/lorekeeper/context.ts
          - convex/lib/lorekeeper/retrieve.ts
          - convex/lib/lorekeeper/caps.ts
          - convex/lib/lorekeeper/web.ts
          - convex/lorekeeperRetention.ts
          - convex/lib/functions.ts
          - convex/cleanup.ts
          - convex/crons.ts
          - src/lib/errors/lorekeeper.ts
          - src/lib/errors/app-error.ts
          - src/lib/convex-errors.ts
          - src/lib/campaign-sections.ts
          - package.json
          - scripts/lorekeeper-ingest.mjs
          - "src/app/(gm)/campaigns/[campaignId]/lorekeeper/page.tsx"
          - "src/app/(gm)/campaigns/[campaignId]/lorekeeper/error.tsx"
          - "src/app/(gm)/campaigns/[campaignId]/lorekeeper/lorekeeper.css"
          - src/components/lorekeeper/slots.ts
          - src/components/lorekeeper/sigil.tsx
          - tests/fixtures/lorekeeper/**
          - tests/convex/schema-guard.test.ts
          - tests/convex/cleanup.test.ts
          - tests/convex/claude-client.test.ts
          - tests/convex/lorekeeper-retention.test.ts
          - tests/e2e/lorekeeper-shell.spec.ts
          - docs/tasks/TASK-D13-L0.md
        reads:
          - reference/designs/project/Lorekeeper.dc.html
          - .omc/autopilot/d13-analysis.md
          - convex/combatMapGenerate.ts
          - convex/photoImport.ts
          - convex/lib/permissions.ts
          - convex/lib/allowlist.ts
          - convex/tables/notes.ts
          - convex/notesBin.ts
          - "src/app/(gm)/campaigns/[campaignId]/campaign-shell.tsx"
          - "src/app/(gm)/campaigns/[campaignId]/notes/page.tsx"
          - tests/convex/helpers.ts
        acceptance:
          - "convex/tables/lorekeeper.ts defines lorekeeperBooks, lorekeeperChunks (search index search_text on text, filterFields [bookId]), lorekeeperLibrary, lorekeeperConversations, lorekeeperMessages, lorekeeperRulings, lorekeeperAsks and lorekeeperUsage with every field and index of analysis section 2; convex/schema.ts composes them; caps and unions live in convex/lib/validators/lorekeeper.ts"
          - "src/lib/errors/lorekeeper.ts defines at least LOREKEEPER_UNAVAILABLE, LOREKEEPER_QUESTION_INVALID, LOREKEEPER_BUSY, LOREKEEPER_CAP_USER, LOREKEEPER_CAP_CAMPAIGN, LOREKEEPER_CAP_DEPLOYMENT, LOREKEEPER_NOT_FOUND, LOREKEEPER_FAILED, LOREKEEPER_BOOK_NOT_FOUND, LOREKEEPER_RULING_LIMIT, LOREKEEPER_RULING_NOT_FOUND, LOREKEEPER_ASK_NOT_FOUND; app-error.ts and convex-errors.ts combine them"
          - "RATE_LIMITS gains lorekeeperAsk (token bucket, 30 per hour, capacity 10) with a one-line reason comment"
          - "convex/lib/claude.ts exports apiKey(), modelFor(task) (LOREKEEPER_MODEL, else ANTHROPIC_MODEL, else 'claude-sonnet-5-5'), messagesStream(body, onText, onCitation, signal) parsing message_start, content_block_start/delta (text_delta, citations_delta)/stop, message_delta usage, message_stop and error events, with a 120 s timeout and ClaudeFailure reasons (timeout, network, HTTP <status>, refusal, too long); tests/convex/claude-client.test.ts feeds recorded-shape SSE fixtures (split across chunk boundaries) and covers each reason; the key never appears in thrown errors or logs"
          - "The fake model replays canned SSE only when isE2EDeployment(env) and LOREKEEPER_FAKE_MODEL === 'true'; on any other deployment the flag is ignored (tested)"
          - "Stubs with final signatures: context.ts buildContext(ctx, user, campaign) -> { frame, characters: [], party: [], rulings: [] }; retrieve.ts retrieve(ctx, campaign, question) -> []; caps.ts reserve / settle / remaining allowing everything; web.ts webPass -> null. Later tracers replace the bodies only"
          - "convex/lorekeeperRetention.ts: internal batched self-rescheduling expireConversations (lastAt older than 90 days, with messages) and expireUsage (older than 13 months); crons at odd minutes; tests/convex/lorekeeper-retention.test.ts covers both and the reschedule"
          - "purgeCampaign deletes lorekeeperLibrary, lorekeeperConversations, lorekeeperMessages, lorekeeperRulings, lorekeeperAsks rows and the campaign's usage counters in bounded batches; schema-guard classifies books/chunks BOUNDED, the rest CAMPAIGN_SCOPED, conversations and usage also ALSO_RETENTION; cleanup.test.ts covers the purge"
          - "package.json gains 'lorekeeper:ingest' pointing at scripts/lorekeeper-ingest.mjs (L0: a usage message only; L2 implements it)"
          - "campaign-sections.ts gains { slug: 'lorekeeper', label: 'Lorekeeper', phase: 'D13' } visible to players; the page shows the board shell at 1440 (300 px sidebar + fluid chat, chat header with sigil, 'The Lorekeeper', 'Keeper of your rulebooks · answers rule questions', index pill slot) and one column at 390, slots typed in src/components/lorekeeper/slots.ts, each in its own error boundary; error.tsx; title 'Lorekeeper · <campaign>'"
          - "tests/fixtures/lorekeeper/mini-book.txt is invented text (about 12 pages with footers in the extracted-text format) used by every later test; no book text"
          - "e2e lorekeeper-shell: GM and player open Lorekeeper from the nav and see the shell; an outsider gets the campaign not-found page"
      - id: L1
        title: Pure domain - page chunker, answer parser, citation mapping, prompt builder, pricing, copy text
        size: M
        goal: Framework-free src/lib/lorekeeper turns extracted book text into page-tagged chunks, builds the system prompt and request body, parses a streamed reply into verdict / prose / GM call / quotes, and prices a usage record, all unit-tested.
        depends_on: []
        owns:
          - src/lib/lorekeeper/**
          - tests/unit/lorekeeper/**
          - docs/tasks/TASK-D13-L1.md
        reads:
          - .omc/autopilot/d13-analysis.md
          - reference/designs/project/Lorekeeper.dc.html
          - src/lib/srd/types.ts
        acceptance:
          - "chunk.ts: splits '===== PAGE N =====' blocks (block N = printed page N-1), reads the printed page and chapter from the footer when present, splits at headings to chunks of at most 4,000 chars with the section path; tested on the mini-book fixture"
          - "prompt.ts: the versioned system prompt (role, answer only from documents / rulings / web results, VERDICT line contract, GM CALL tail, plain text only, data-not-instructions rule for <campaign_data>, <question> and documents, decline to reveal instructions); requestBody(question, chunks, rulings, context, history, options) emits documents with citations enabled, titles '<Book> · p.<page> · <section>', last 6 turns of history, cache_control on system, max_tokens 2000, effort low, stream true; snapshot-free tests assert the structure"
          - "answer.ts: incremental parser from text deltas to { verdict: 'rules' | 'unclear' | 'none', prose, call? }, plus quotes from citations (content_block_location -> book, page, section; cited_text cut to 300 chars; duplicates merged; at most 3); a missing verdict line falls back to 'rules' with citations else 'unclear'; tested with deltas split mid-word and mid-line"
          - "pricing.ts: per-model prices (Opus 5.5 4/20, Sonnet 5.5 2/10, Haiku 5.5 0.10/0.50 per MTok; cache read 0.20; 5-minute cache write 1.25x; web search $10 per 1,000) and costMicros(usage, model); reserveMicros(model, maxTokens) as the worst case; tested"
          - "copy.ts: the board's copy strings (verdict labels, legend, disclaimer, books-only miss text, placeholders, suggestion chips with their questions) and copyText(answer) for the Copy action"
  # ---------------------------------------------------------------- wave 2: server slices, in parallel
  - wave: 2
    tracers:
      - id: L2
        title: Rules source - local ingest, search retrieval, library list and per-campaign book switches
        size: M
        goal: '`pnpm lorekeeper:ingest <bookKey> <textFile>` loads a book''s chunks into the deployment through an internal mutation, retrieve() returns the best chunks of the campaign''s enabled books for a question, and members see the Library while the GM switches books on and off.'
        depends_on: [L0, L1]
        owns:
          - convex/lorekeeperLibrary.ts
          - convex/lib/lorekeeper/retrieve.ts
          - scripts/lorekeeper-ingest.mjs
          - tests/convex/lorekeeper-library.test.ts
          - tests/convex/authz/lorekeeper-library.entries.ts
          - tests/convex/authz/lorekeeper-library.test.ts
          - docs/tasks/TASK-D13-L2.md
        reads:
          - convex/tables/lorekeeper.ts
          - convex/lib/validators/lorekeeper.ts
          - src/lib/lorekeeper/chunk.ts
          - src/lib/frames/index.ts
          - tests/fixtures/lorekeeper/mini-book.txt
        acceptance:
          - "internal ingestBook(bookKey, title, subtitle, cover) and ingestChunks(bookId, chunks[]) (batches of at most 100) replace a book's chunks; the script reads a local text file, chunks it with L1, and calls them through `npx convex run` (deploy key from the user's env); it refuses paths inside the repo except tests/fixtures and prints nothing of the text; no public function can write books or chunks"
          - "Frame books: ingest takes --pages a-b to register 'frame:<frameId>' from a page range of the core book (Witherwild = core pp. 254-261)"
          - "retrieve(ctx, campaign, question): withSearchIndex over each enabled book (lorekeeperLibrary rows, defaults per analysis 2), top 10 plus same-page neighbours, at most about 8k tokens, deduplicated; tested on the fixture for a hit, a miss and a disabled book"
          - "library.list (campaignQuery view): books with name, subtitle, cover, indexed/off state for this campaign, chunk count, and the header count; never returns chunk text; library.setEnabled (gmMutation) toggles one book; library.pageText (campaignQuery view, Q5) returns the indexed text of one page of an enabled book (LOREKEEPER_BOOK_NOT_FOUND otherwise)"
          - "Matrix entries: list/pageText view for GM and players, NOT_FOUND outsider, UNAUTHENTICATED anon; setEnabled GM only (FORBIDDEN player)"
      - id: L3
        title: Chat server - ask, stream into the answer row, stop, history, delete
        size: L
        goal: A member asks a question, the answer row streams in live from the scheduled internal action (verdict, prose, quotes with pages, GM call, usage), can be stopped, survives reloads, and the asker lists, opens and deletes only their own conversations.
        depends_on: [L0, L1]
        owns:
          - convex/lorekeeper.ts
          - convex/lorekeeperRun.ts
          - tests/convex/lorekeeper-chat.test.ts
          - tests/convex/authz/lorekeeper-chat.entries.ts
          - tests/convex/authz/lorekeeper-chat.test.ts
          - docs/tasks/TASK-D13-L3.md
        reads:
          - convex/lib/claude.ts
          - convex/lib/lorekeeper/context.ts
          - convex/lib/lorekeeper/retrieve.ts
          - convex/lib/lorekeeper/caps.ts
          - convex/lib/lorekeeper/web.ts
          - convex/tables/lorekeeper.ts
          - src/lib/lorekeeper/**
          - tests/convex/combat-map-generate.test.ts
        acceptance:
          - "lorekeeper.available (campaignQuery view) returns a boolean only"
          - "lorekeeper.ask (campaignMutation view, rateLimit lorekeeperAsk, args conversationId?, question 1..1000 chars, webSearch boolean): LOREKEEPER_UNAVAILABLE without a key; LOREKEEPER_BUSY while the caller has a pending/streaming answer in this campaign; caps.reserve in the same transaction; inserts question + pending answer rows (new conversation when absent; another user's conversation id -> LOREKEEPER_NOT_FOUND), schedules internal lorekeeperRun.run and a 3-minute watchdog"
          - "lorekeeperRun.run: one runQuery for context + retrieved chunks + rulings + history, messagesStream with the L1 body, appendAnswer patches every ~250 ms or ~200 chars (fenced by status and updatedAt), final patch with parts (verdict, quotes, call), usage, model and caps.settle; a stopped row ends the stream (abort) and keeps the text so far; failures and refusals -> status error with errorCode, generic text only"
          - "Tests (fetch stubbed with SSE fixtures): a cited answer streams in at least two patches and ends with quotes carrying page and section; an 'unclear' answer stores the GM call; a refusal and an HTTP 529 end as error; Stop mid-stream ends as stopped; the watchdog marks a stuck row error; the outgoing body contains the system prompt, documents with citations enabled and the question, and never the API key"
          - "lorekeeper.stop (campaignMutation view, own answer only), conversations.list (own, newest first, .take(30)), messages.list (own conversation, paginated, returns validator), conversations.remove (own; deletes messages in bounded batches), conversations.setWebSearch (own)"
          - "Matrix entries: every function view for members on their own rows; another member's conversation/message -> LOREKEEPER_NOT_FOUND (otherPlayer row and GM row: the GM cannot read a player's conversation, Q3); outsider NOT_FOUND; anon UNAUTHENTICATED"
      - id: L4
        title: Campaign context with permission checks, table rulings, Ask the GM, house rules
        size: M
        goal: buildContext gives the model only what the asker may see (frame, own characters, party classes, rulings, optional GM-everyone house-rule pages), proven by canary tests for player, second player and GM, and the GM pins and unpins table rulings and answers players' Ask-the-GM requests.
        depends_on: [L0, L1]
        owns:
          - convex/lib/lorekeeper/context.ts
          - convex/lorekeeperRulings.ts
          - convex/lorekeeperAsks.ts
          - tests/convex/lorekeeper-context.test.ts
          - tests/convex/lorekeeper-rulings.test.ts
          - tests/convex/authz/lorekeeper-rulings.entries.ts
          - tests/convex/authz/lorekeeper-rulings.test.ts
          - docs/tasks/TASK-D13-L4.md
        reads:
          - convex/lib/permissions.ts
          - convex/lib/notes.ts
          - convex/lib/characterSheet.ts
          - convex/characters.ts
          - convex/tables/characters.ts
          - convex/tables/codex.ts
          - convex/tables/notes.ts
          - convex/tables/encounters.ts
          - convex/tables/countdowns.ts
          - convex/tables/sessions.ts
          - convex/tables/lorekeeper.ts
          - tests/convex/helpers.ts
        acceptance:
          - "buildContext(ctx, user, campaign): frame id and name; the caller's characters where permissionFor(character) >= edit (class, subclass, level, heritage names, domain card names, active features); the party's class/subclass list; rulings (newest 50); house-rule pages only when the campaign's house-rules book is enabled, only GM journal pages with visibility 'everyone', each checked with pageAccess as the caller (Q7)"
          - "context.ts imports no reader of codex, encounters, customAdversaries, countdowns, sessionPrep, fear or other users' journals (a unit test reads the module's imports)"
          - "tests/convex/lorekeeper-context.test.ts seeds canary strings into a hidden codex entry, a known entry's GM notes, a private GM page, a player page hidden from the GM and others, a custom adversary, an encounter note, a countdown, session prep and another player's sheet; for player, second player and GM, JSON.stringify(buildContext(...)) contains none of them; a player's own sheet name is present; the GM's context has no player sheets unless the GM edits them"
          - "rulings.list (campaignQuery view), rulings.pin (gmMutation: title <= 80, text <= 600, optional fromMessageId of the GM's own answer and sessionId; LOREKEEPER_RULING_LIMIT at 50), rulings.update and rulings.unpin (gmMutation); meta 'Pinned by the GM · Session N' derived on read"
          - "asks.send (campaignMutation view: the caller's own answer message; one open ask per message), asks.listOpen (gmQuery: asker name, question text, answer verdict), asks.resolve (gmMutation: dismiss or link a ruling id); a player never reads other players' asks"
          - "Matrix entries for every rulings and asks function (GM / player / otherPlayer / outsider / anon) with the expected codes"
      - id: L5
        title: Cost caps and usage counters
        size: S
        goal: Every question reserves its worst-case cost against per-user daily, per-campaign monthly and per-deployment monthly counters, settles to the real usage cost, refuses past a cap with the right code, and the composer can show what remains.
        depends_on: [L0, L1]
        owns:
          - convex/lib/lorekeeper/caps.ts
          - convex/lorekeeperUsage.ts
          - tests/convex/lorekeeper-caps.test.ts
          - tests/convex/authz/lorekeeper-usage.entries.ts
          - tests/convex/authz/lorekeeper-usage.test.ts
          - docs/tasks/TASK-D13-L5.md
        reads:
          - convex/tables/lorekeeper.ts
          - convex/lib/validators/lorekeeper.ts
          - src/lib/lorekeeper/pricing.ts
        acceptance:
          - "caps.reserve(ctx, user, campaign, model, now): point reads of the three counters (by_scope); refuses with LOREKEEPER_CAP_USER (40 questions per UTC day), LOREKEEPER_CAP_CAMPAIGN ($10 per calendar month) or LOREKEEPER_CAP_DEPLOYMENT (env LOREKEEPER_MONTHLY_USD, default 25); else increments questions and adds reserveMicros"
          - "caps.settle(ctx, scopes, reservedMicros, actualMicros) replaces the reservation with the real cost (also on error and stop, with the usage received so far, or 0 before any token)"
          - "usage.mine (campaignQuery view, coarse day/month passed as args, CF10): questions left today and whether the campaign or deployment cap is reached; never another user's numbers; returns validator"
          - "Tests: the 41st question of a day fails; a new day resets; a campaign at its cap refuses every member; settle lowers the counter; concurrent reserves never pass a cap (two asks in one test)"
  # ---------------------------------------------------------------- wave 3: UI ported from the board, web fallback
  - wave: 3
    tracers:
      - id: L6
        title: Chat column UI - stream, answer cards, composer, actions, empty / loading / error / cap states
        size: L
        goal: On the Lorekeeper page the member asks from the composer or a suggestion chip, sees 'Searching your books…', watches the parchment answer stream in with its verdict pill, quotes with book and page chips, GM call and internet block, uses Copy / Pin as table ruling / Ask the GM / Open in the book / Show on Combat Map, stops an answer, and switches between their conversations.
        depends_on: [L2, L3, L4, L5]
        owns:
          - src/components/lorekeeper/chat/**
          - src/components/lorekeeper/composer/**
          - src/components/lorekeeper/answer/**
          - src/components/lorekeeper/conversations/**
          - src/lib/optimistic/lorekeeper.ts
          - tests/unit/lorekeeper-ui/**
          - tests/e2e/lorekeeper-chat.spec.ts
          - tests/e2e/visual/D13-L6.spec.ts
          - docs/tasks/TASK-D13-L6.md
        reads:
          - reference/designs/project/Lorekeeper.dc.html
          - "src/app/(gm)/campaigns/[campaignId]/lorekeeper/page.tsx"
          - "src/app/(gm)/campaigns/[campaignId]/lorekeeper/lorekeeper.css"
          - src/components/lorekeeper/slots.ts
          - src/components/lorekeeper/sigil.tsx
          - src/components/brand/modal.tsx
          - src/lib/lorekeeper/copy.ts
          - convex/lorekeeper.ts
          - convex/lorekeeperRulings.ts
          - convex/lorekeeperAsks.ts
          - convex/lorekeeperUsage.ts
          - convex/lorekeeperLibrary.ts
        acceptance:
          - "Stream: role=log aria-live=polite; question bubbles right with 'You'; thinking row with three dots and 'Searching your books…' (dots static under reduced motion); answer card in the board's parchment look with ✓ / ? / ✕ verdict pill, prose, up to 3 quotes with '📖 <book> · p.<page>' chip and section, 'Suggested GM call' box, internet block with the board's disclaimer and result cards (site shown, links rel=noopener nofollow); text renders as plain text only"

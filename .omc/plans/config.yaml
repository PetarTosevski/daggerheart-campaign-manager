# Config plan (2026-11-03): campaign settings (gear), Preferences (avatar), co-GM, and the owner-only App admin.
# Epic: bead dcm-jh6d (children dcm-bxp.134 rule switches - NOT in this plan, dcm-cd8 creation cap, dcm-jh6d.1 co-GM).
# Designs: reference/designs/config/Settings.dc.html (Settings + Preferences), reference/designs/config/Admin.dc.html.
# Briefs, design-to-code map, risks, beads and the open questions: .omc/plans/config-briefs.md.
# Format: docs/workflow.md. Extra keys (plan-check ignores them): title, part, size, mode, requires_plan, blocked_on.
#
# Build order the user approved: HUD wave 9 -> Journal -> this plan's Part A -> Part B -> rule switches / homebrew later.
#   Part A (waves 1-4): Campaign settings + Preferences + co-GM.
#   Part B (waves 5-8): App admin (superadmin, the app owner only).
# Tracers marked `requires_plan: journal` need the Journal plan (.omc/plans/journal.yaml) merged first:
# JO1 (a new session opens on Journal / Combat Map), JO2 (session log from the Combat Map), JO3 (spotlight balance to players).
# Tracers marked `blocked_on: Qn` change a rule or need a user answer first; they are built on the briefs' recommended
# default, and the orchestrator rewrites their acceptance if the user picks another option.
#
# Rules for every tracer (details in the briefs, section "Common rules"):
#   - Server first. Every public function is a user* / campaign / gm / creator / appOwner wrapper from
#     convex/lib/functions.ts; access only through permissionFor (`need:`) or isAppOwner (one helper); args + returns
#     validators, no v.any; indexed bounded reads; new fields are optional (widen, rule 7); growing tables have a
#     back-reference index and a cleanup path (campaign purge or a batched self-rescheduling cron).
#   - Each server tracer has its own authz area file tests/convex/authz/config-<area>.entries.ts (+ .test.ts); tests
#     assert ConvexError.data.code. Only G1 (co-GM role, class `creator`) and AD0 (role appOwner, class `appOwner`)
#     change the shared harness.
#   - Mutations send single-field intents ({ key, value }), never a whole settings object; optimistic updates on every
#     switch (rule 12). Settings save on change; no Save button.
#   - No rule switches (Book / Variant / Manual): CAMPAIGN_OPTIONS in src/lib/frames/options.ts stay as they are.
plan: config
waves:
  # ================================================================== PART A
  # ------------------------------------------------------------------ wave 1: foundation
  - wave: 1
    tracers:
      - id: S0
        title: "Part A data foundation: campaign table settings, archive stamp, co-GM role field, preferences / hand-fold / presence tables, error codes, pure defaults"
        part: A
        size: M
        mode: add
        goal: "The data Part A needs exists with defaults and is cleaned up with its campaign: a campaign carries typed table settings and an archive stamp, a member row can be a co-GM, a user has one preferences row, per-character hand folds and per-campaign presence have tables; campaigns.get returns the resolved settings; nothing in the UI changes"
        depends_on: []
        owns:
          - convex/tables/campaigns.ts
          - convex/lib/validators/campaigns.ts
          - convex/lib/validators/preferences.ts
          - convex/campaigns.ts
          - convex/cleanup.ts
          - src/lib/config/**
          - src/lib/errors/config.ts
          - src/lib/errors/app-error.ts
          - src/lib/convex-errors.ts
          - tests/unit/config-defaults.test.ts
          - tests/unit/config-legacy-prefs.test.ts
          - tests/convex/config-foundation.test.ts
          - tests/convex/cleanup.test.ts
          - docs/data-model.md
          - docs/tasks/TASK-CONFIG-S0.md
        reads:
          - reference/designs/config/Settings.dc.html
          - src/lib/frames/options.ts
          - convex/lib/cardHand.ts
          - convex/lib/permissions.ts
          - src/components/party/dice/settings.ts
          - src/components/combat-map/actions/hand/index.tsx
          - docs/best-practices.md
        acceptance:
          - "Widen only (rule 7, CD4): campaigns gains tableSettings? = v.object of optional fields playersSeeFear (bool), outOfRange ('ask' | 'refuse'), spotlightToPlayers (bool), lorekeeperWeb (bool), lorekeeperAsk ('everyone' | 'gm'), fearAtStart ('carry' | 'pcs'), clock ('scene' | 'manual'), sessionOpensOn ('journal' | 'combatMap'), autoSessionLog (bool); and archivedAt? (number). campaignMembers gains role? = v.literal('coGm'). Typed validators in convex/lib/validators/campaigns.ts, no JSON blob"
          - "New tables in convex/tables/campaigns.ts (already composed by convex/schema.ts, so schema.ts is untouched): userPreferences { userId, dice3d?, diceSound?, diceVolume? (0-100), reduceMotion? (bool), textSize? ('small' | 'medium' | 'large'), spotlightPing? (bool), legacyImportedAt?, updatedAt } with by_user; handFolds { userId, campaignId, characterId, updatedAt } (row = folded) with by_user_character and by_campaign; campaignPresence { campaignId, userId, lastSeenAt } with by_campaign_user (no prefix-duplicate index, CD15)"
          - "src/lib/config/campaign-settings.ts: TABLE_SETTING_DEFAULTS (playersSeeFear true, outOfRange 'ask' = today's behaviour, spotlightToPlayers false, lorekeeperWeb true, lorekeeperAsk 'everyone', fearAtStart 'carry' (CB p.154), clock 'manual', sessionOpensOn 'journal', autoSessionLog true) and resolveTableSettings(stored); src/lib/config/preferences.ts: PREFERENCE_DEFAULTS and resolvePreferences; src/lib/config/legacy-prefs.ts: readLegacyPrefs(storage) parses dcm.dice.settings and every dh.combat.handHidden:<campaignId>:<characterId> key (bad JSON / blocked storage = nothing), unit-tested"
          - "campaigns.get's summary gains settings (the resolved table settings) and archived (bool); returns validator updated; every existing campaigns test passes"
          - "cleanup.ts purges handFolds and campaignPresence by campaign (bounded take, as the other per-campaign tables); cleanup.test.ts covers both"
          - "src/lib/errors/config.ts holds the Part A codes with messages (CAMPAIGN_ARCHIVED, CO_GM_NOT_MEMBER, CO_GM_CREATOR_ONLY, SETTING_INVALID, LOREKEEPER_GM_ONLY, COMBAT_TARGET_OUT_OF_RANGE) and joins the AppErrorCode union in app-error.ts; tests assert codes"
          - "docs/data-model.md documents every new field and table; lint, typecheck, vitest pass"
      - id: S1
        title: "Settings panel and Preferences popover shell: gear + avatar in the campaign top bar, five-section slide-over, slot stubs, URL state"
        part: A
        size: M
        mode: add
        goal: "Every campaign page's top bar ends with a gear (GM and co-GM) and an avatar (everyone); the gear opens the 'Campaign settings' slide-over with the design's five-section nav and footer, the avatar opens the Preferences popover; every section and row is a stub slot; the existing Players button keeps working"
        depends_on: []
        owns:
          - src/components/config/shell/**
          - src/components/config/slots.ts
          - src/components/config/config.css
          - src/components/config/sections/table/index.tsx
          - src/components/config/sections/rules/index.tsx
          - src/components/config/sections/players/index.tsx
          - src/components/config/sections/lorekeeper/index.tsx
          - src/components/config/sections/sessions/index.tsx
          - src/components/config/prefs/index.tsx
          - src/components/config/presence-beat.tsx
          - src/components/config/spotlight-ping.tsx
          - src/app/(gm)/campaigns/[campaignId]/campaign-shell.tsx
          - tests/unit/config/s1-*.test.tsx
          - tests/e2e/config/helpers.ts
          - tests/e2e/config-shell.spec.ts
          - docs/tasks/TASK-CONFIG-S1.md
        reads:
          - reference/designs/config/Settings.dc.html
          - src/components/brand/**
          - src/app/(gm)/campaigns/[campaignId]/players-dialog.tsx
          - src/components/journal/slots.ts
          - tests/e2e/a11y.ts
        acceptance:
          - "Top bar (campaign-shell.tsx): after the nav, a 40px round gear button (aria-label 'Campaign settings', aria-expanded) shown when campaign.role is 'gm' (creator and co-GM), and a 40px avatar button (aria-label 'Preferences') for everyone; the board's 'Settings and Preferences live here' callout is not built"
          - "Gear opens a right slide-over dialog (640px, focus trapped, Esc closes, reduced motion = no slide): kicker '<campaign name> · GM only', H2 'Campaign settings', side nav Table / House rules / Players / Lorekeeper / Sessions (aria-current), the section slot, and the footer 'Changes save as you make them and reach every player at once.'; URL state ?settings=table|rules|players|lorekeeper|sessions (bad value -> table), closing removes it"
          - "Avatar opens the Preferences popover: avatar + name + 'Game Master' / 'Player' · campaign, the label 'Saved to your account · follows you to every device' (never 'Only on this device'), the prefs slot, an App admin link slot (renders nothing), 'Campaign settings' link (GM), Sign out (the existing sign-out action)"
          - "slots.ts documents every slot (file, owning tracer, exported name, props) like src/components/journal/slots.ts; each stub keeps its name and props; presence-beat.tsx and spotlight-ping.tsx are mounted once in the shell and render nothing yet"
          - "Each slot sits in its own error boundary (CL1); config-shell.spec.ts: GM and player open what they may (player sees no gear), keyboard only, axe passes, 1440x900 and 390x844; lint, typecheck, tests pass"
  # ------------------------------------------------------------------ wave 2: server
  - wave: 2
    tracers:
      - id: G1
        title: "Co-GM permission core: role coGm, the creator rank, creator wrappers, setCoGm, archived-campaign write guard, authz role + class"
        part: A
        size: L
        mode: add
        goal: "The campaign creator can make a member a co-GM and back; a co-GM passes every GM wrapper (permission 'owner') but not the new creator-only rank, so they can't delete, restore, purge or archive the campaign, manage co-GMs or remove the creator; campaign mutation wrappers refuse writes on an archived campaign; the authz matrix runs every entry for a co-GM too"
        depends_on: [S0]
        owns:
          - convex/lib/permissions.ts
          - convex/lib/functions.ts
          - convex/campaigns.ts
          - convex/members.ts
          - tests/convex/authz/harness.ts
          - tests/convex/authz/world.ts
          - tests/convex/authz/synth.ts
          - tests/convex/authz-matrix.test.ts
          - tests/convex/authz/core.entries.ts
          - tests/convex/authz/config-cogm.entries.ts
          - tests/convex/authz/config-cogm.test.ts
          - tests/convex/co-gm.test.ts
          - tests/convex/archived-guard.test.ts
          - tests/convex/functions.test.ts
          - docs/tasks/TASK-CONFIG-G1.md
        reads:
          - convex/tables/campaigns.ts
          - src/lib/config/**
          - src/lib/errors/config.ts
          - tests/convex/authz/**
          - docs/best-practices.md
        acceptance:
          - "permissions.ts: Role = 'gm' | 'coGm' | 'player'; campaignRole returns 'coGm' for a member row with role 'coGm'; rolePermission('coGm') = 'owner'; a campaign-only rank 'creator' above 'owner' (CampaignPermission = Permission | 'creator', never stored in grants) that only the campaign's ownerId gets; atLeast handles it; no other file compares roles (rule 2)"
          - "functions.ts: need accepts 'creator'; creatorQuery / creatorMutation / keyedCreatorMutation (need fixed to 'creator'); campaign mutation wrappers throw CAMPAIGN_ARCHIVED when campaign.archivedAt is set unless the option archived: 'allow' is given; queries still read archived campaigns; the wrapper table in the file header lists the new options"
          - "campaigns.ts: get maps owner-or-better to role 'gm' and adds isCreator (bool) to the summary, so every GM screen works for a co-GM unchanged; remove, restore and purge need 'creator' (restore / purge via permissionFor(..., 'creator')); markOpened passes archived: 'allow'"
          - "members.ts: setCoGm creatorMutation { userId, coGm: bool } (CO_GM_NOT_MEMBER for a non-member; idempotent); roster rows gain coGm (bool); removePlayer may remove a player (owner) but a co-GM only with 'creator' (CO_GM_CREATOR_ONLY); removing or leaving also deletes the member's campaignPresence and handFolds rows; leave works for a co-GM"
          - "Authz harness: world role coGm (a member with role coGm); class defaults: gm -> coGm 'ok'; new class 'creator' (anon UNAUTHENTICATED, outsider NOT_FOUND, player FORBIDDEN, coGm FORBIDDEN, gm ok) with allowedClasses for the creator wrappers; core.entries.ts moves campaigns.remove / restore / purge to 'creator'; config-cogm area covers setCoGm"
          - "co-gm.test.ts: a co-GM runs a GM mutation (Fear, session start), can't delete / archive / setCoGm / remove the creator; demoting returns them to player; archived-guard.test.ts: a write on an archived campaign is CAMPAIGN_ARCHIVED, markOpened and queries still work; lint, typecheck, full vitest (matrix included) pass"
      - id: S2
        title: "Campaign settings server: one single-field setter for the table settings"
        part: A
        size: S
        mode: add
        goal: "A GM or co-GM changes one table setting at a time and every member's campaigns.get updates at once"
        depends_on: [S0]
        owns:
          - convex/campaignSettings.ts
          - tests/convex/campaign-settings.test.ts
          - tests/convex/authz/config-settings.entries.ts
          - tests/convex/authz/config-settings.test.ts
          - docs/tasks/TASK-CONFIG-S2.md
        reads:
          - convex/campaigns.ts
          - convex/lib/validators/campaigns.ts
          - src/lib/config/**
        acceptance:
          - "campaignSettings.set gmMutation { change } where change is a v.union of one object per field ({ key: 'playersSeeFear', value: v.boolean() }, { key: 'outOfRange', value: 'ask' | 'refuse' }, ...), patching only that field of tableSettings; a no-op change writes nothing; returns null"
          - "Unknown or wrong-typed change fails the args validator; archived campaign -> CAMPAIGN_ARCHIVED (G1's guard, once merged; until then a test marked todo)"
          - "Authz entries (class gm); tests assert codes; lint, typecheck, vitest pass"
      - id: P1
        title: "Preferences server: the account's preferences, single-field setter, one-time legacy import, hand folds"
        part: A
        size: S
        mode: add
        goal: "A signed-in user reads and changes their preferences on the account, imports the old browser values once, and folds or unfolds a character's hand on the server"
        depends_on: [S0]
        owns:
          - convex/preferences.ts
          - tests/convex/preferences.test.ts
          - tests/convex/authz/config-prefs.entries.ts
          - tests/convex/authz/config-prefs.test.ts
          - docs/tasks/TASK-CONFIG-P1.md
        reads:
          - convex/tables/campaigns.ts
          - convex/lib/validators/preferences.ts
          - src/lib/config/**
        acceptance:
          - "preferences.get userQuery returns the resolved preferences (defaults when no row) plus legacyImported (bool); preferences.set userMutation { change } single-field union (dice3d, diceSound, diceVolume 0-100 integer, reduceMotion, textSize, spotlightPing), creating the row on first write"
          - "preferences.importLegacy userMutation { dice3d?, diceSound?, folds: array (max 50) of { campaignId, characterId } }: runs once per account (legacyImportedAt), sets only fields still unset, ignores folds for campaigns or characters the caller can't see (permissionFor view on the character's campaign) and never fails for them"
          - "preferences.folds campaignQuery view returns the caller's folded character ids in the campaign (bounded); preferences.setFold campaignMutation view, archived 'allow' { characterId, folded } only for a character of that campaign (NOT_FOUND otherwise); never another user's rows"
          - "Authz entries (user / view classes); lint, typecheck, vitest pass"
      - id: PR1
        title: "Presence server: heartbeat and the GM's online / away list"
        part: A
        size: S
        mode: add
        goal: "An open campaign tab tells the server it is there at most once a minute, and the GM reads each member's last-seen time to show Online or Away"
        depends_on: [S0]
        owns:
          - convex/presence.ts
          - tests/convex/presence.test.ts
          - tests/convex/authz/config-presence.entries.ts
          - tests/convex/authz/config-presence.test.ts
          - docs/tasks/TASK-CONFIG-PR1.md
        reads:
          - convex/campaigns.ts
          - convex/members.ts
        acceptance:
          - "presence.beat campaignMutation view (archived 'allow'): upserts the caller's campaignPresence row; writes only when lastSeenAt is older than 60 s (PRESENCE_WRITE_MS), so a burst of beats is one write"
          - "presence.list gmQuery returns [{ userId, lastSeenAt }] for the campaign (bounded by the members cap); no Date.now() in the query (CF10): the client decides Online (< 2 min) / Away; its own query so beats never re-send the roster (CD10)"
          - "Authz entries; lint, typecheck, vitest pass"
  # ------------------------------------------------------------------ wave 3: settings take effect, UI sections, preferences applied
  - wave: 3
    tracers:
      - id: G2
        title: "Co-GM sweep: every 'is this the GM' check outside permissions.ts goes through the permission-derived role"
        part: A
        size: M
        mode: add
        blocked_on: Q6
        goal: "A co-GM is treated as a GM wherever the code asked 'is the caller the campaign's GM' by comparing with campaign.ownerId (notes, journals, character sheets, photo import, Lorekeeper context, combat requests), while places that need the creator's identity (whose journal is the GM journal, createdBy) keep it"
        depends_on: [G1]
        owns:
          - convex/notesEntries.ts
          - convex/notesThreads.ts
          - convex/notesSharing.ts
          - convex/notesJournals.ts
          - convex/lib/journalState.ts
          - convex/lib/notes.ts
          - convex/lib/characterSheet.ts
          - convex/characters.ts
          - convex/photoImport.ts
          - convex/lib/lorekeeper/context.ts
          - convex/combatRequests.ts
          - src/lib/domain/notes/visibility.ts
          - tests/convex/co-gm-sweep.test.ts
          - docs/tasks/TASK-CONFIG-G2.md
        reads:
          - convex/lib/permissions.ts
          - convex/lib/functions.ts
          - docs/best-practices.md
        acceptance:
          - "Each campaign.ownerId comparison in the owned files is classified in the task doc as 'role' (replaced by the role from campaignRole / ctx.permission) or 'identity' (kept, with a one-line comment); grep shows no role-style ownerId comparison left in convex/ outside lib/permissions.ts"
          - "Notes (Q6 default): a co-GM reads what the GM reads (GM-only pages, every shared page) through canReadPage's viewer role; pages a co-GM writes are their own journal's pages"
          - "co-gm-sweep.test.ts: a co-GM edits any character sheet, approves a combat request, reads a GM-only page; a player still can't; every existing notes / characters test passes"
      - id: R1
        title: "Players see the GM's Fear: hide the Fear pool from players when the GM turns it off"
        part: A
        size: S
        mode: add
        blocked_on: Q3
        goal: "With 'Players see the GM's Fear' off, a player never receives the GM's Fear number (the Fear query and the Fear numbers in feed lines), while the GM and co-GM still do; on (the book's default) nothing changes"
        depends_on: [S0, G1]
        owns:
          - convex/campaigns.ts
          - convex/feed.ts
          - tests/convex/fear-visibility.test.ts
          - docs/tasks/TASK-CONFIG-R1.md
        reads:
          - convex/lib/fear.ts
          - src/lib/config/**
          - .reference-private/text/core.txt
        acceptance:
          - "campaigns.fear returns { fear: number | null } (returns validator a union): null for a caller below 'owner' when tableSettings.playersSeeFear is false; the client shows the Fear banner / panel only when fear is not null"
          - "feed rows for a player drop fearDelta and the 'Fear a -> b' text part when the switch is off (Q3 default); 'with Fear' on a roll result stays (that is the dice, not the pool)"
          - "fear-visibility.test.ts covers GM, co-GM, player with the switch on and off; lint, typecheck, vitest pass"
      - id: R2
        title: "Out-of-range actions: Refuse"
        part: A
        size: M
        mode: add
        blocked_on: Q2
        goal: "With out-of-range set to Refuse, a player's attack, card or feature that targets something beyond its range is refused by the server with a clear message instead of becoming a request for the GM; 'Ask me' keeps today's request flow"
        depends_on: [S0]
        owns:
          - convex/combatActions.ts
          - convex/combatFeatures.ts
          - convex/featurePrompts.ts
          - tests/convex/out-of-range-refuse.test.ts
          - docs/tasks/TASK-CONFIG-R2.md
        reads:
          - convex/combatRequests.ts
          - convex/lib/combatActions.ts
          - src/lib/config/**
          - .reference-private/text/core.txt
        acceptance:
          - "Where today an out-of-range target creates a pending combat request (combatActions attack, combatFeatures resolve, featurePrompts), 'refuse' throws COMBAT_TARGET_OUT_OF_RANGE with the band in the message and nothing is paid or logged; rider-added targets beyond range are dropped and the action goes on (Q2 default)"
          - "A caller with 'owner' (GM / co-GM acting for a PC) is not refused (Q2 default); 'ask' behaves exactly as today (existing combat-actions and riders tests pass unchanged)"
          - "out-of-range-refuse.test.ts covers attack, card, feature and rider; lint, typecheck, vitest pass"
      - id: R3
        title: "Fear at the start of a session: carry over or reset to the number of PCs"
        part: A
        size: S
        mode: add
        blocked_on: Q1
        goal: "With 'Reset to number of PCs', starting a session sets the GM's Fear to the number of active PCs in the same undoable step; 'Carry over' (the book, CB p.154) keeps today's behaviour"
        depends_on: [S0]
        owns:
          - convex/sessions.ts
          - tests/convex/fear-at-start.test.ts
          - docs/tasks/TASK-CONFIG-R3.md
        reads:
          - convex/lib/fear.ts
          - convex/lib/sessions.ts
          - src/lib/config/**
          - .reference-private/text/core.txt
        acceptance:
          - "sessions.start with fearAtStart 'pcs': Fear = min(12, active PCs of the campaign: not retired, not dead) (Q1 default), written through the Fear history like any Fear change, in the start's actionLog group so undo of the start restores it; the start line says 'Fear reset to N'"
          - "'carry' changes nothing; the Journal's session tests and the existing sessions tests pass"
          - "fear-at-start.test.ts covers both modes, the 12 cap and undo; lint, typecheck, vitest pass"
      - id: R4
        title: "Day and night clock: advance per scene"
        part: A
        size: S
        mode: add
        blocked_on: Q4
        goal: "With the clock set to 'Advance per scene', ending a scene advances the campaign's time the way the user's answer to Q4 says; 'Manual' keeps today's behaviour. Not started before the user answers Q4"
        depends_on: [S0]
        owns:
          - convex/scenes.ts
          - convex/combatScenes.ts
          - convex/campaignTime.ts
          - tests/convex/clock-per-scene.test.ts
          - docs/tasks/TASK-CONFIG-R4.md
        reads:
          - convex/lib/sessions.ts
          - src/lib/config/**
          - .reference-private/text/core.txt
        acceptance:
          - "Built only after the user's Q4 answer; the acceptance is rewritten then. Placeholder (Q4 option a): a scene end with clock 'scene' moves time of day one step Day -> Dim -> Night -> Day in the scene end's actionLog group (undoable); Witherwild (campaignTime frame) excluded"
          - "'manual' changes nothing; existing scene and calendar tests pass; lint, typecheck, vitest pass"
      - id: L1
        title: "Lorekeeper campaign settings: who can ask, and internet search when the books don't say"
        part: A
        size: S
        mode: add
        goal: "A GM can let only GMs ask the Lorekeeper, and can switch internet search off for the campaign; the server enforces both and the composer knows"
        depends_on: [S0]
        owns:
          - convex/lorekeeper.ts
          - tests/convex/lorekeeper-campaign-settings.test.ts
          - docs/tasks/TASK-CONFIG-L1.md
        reads:
          - convex/lorekeeperRun.ts
          - convex/lib/lorekeeper/**
          - src/lib/config/**
        acceptance:
          - "lorekeeper.ask and editQuestion: lorekeeperAsk 'gm' and ctx.permission below 'owner' -> LOREKEEPER_GM_ONLY (decided by the wrapper's permission, not a role compare); lorekeeperWeb false forces the conversation's webSearch to false (stored false, no web pass)"
          - "lorekeeper.available returns canAsk (bool) and webAllowed (bool) besides today's fields (returns validator widened); the composer hides the internet toggle when webAllowed is false and shows 'Only the GM can ask the Lorekeeper in this campaign.' when canAsk is false (client change limited to reading the new fields in src/components/lorekeeper only if needed by tests; else in U4)"
          - "Tests cover player / co-GM / GM for both switches; lint, typecheck, vitest pass"
      - id: U1
        title: "Settings: At the table section"
        part: A
        size: S
        mode: add
        goal: "The At the table section shows the design's rows and every switch saves at once: hand sharing, players see Fear, out-of-range Ask me / Refuse, spotlight balance to players, and the locked 'adversary stats' row"
        depends_on: [S1, S2]
        owns:
          - src/components/config/sections/table/**
          - tests/unit/config/table.test.tsx
          - tests/e2e/config-table.spec.ts
          - docs/tasks/TASK-CONFIG-U1.md
        reads:
          - reference/designs/config/Settings.dc.html
          - src/components/combat-map/settings/hand-sharing.tsx
          - convex/campaigns.ts
          - convex/campaignSettings.ts
        acceptance:
          - "Rows with the board's text: 'Players can see each other's hands' (campaigns.setPlayersSeeHands, reused), 'Players see the GM's Fear', 'Out-of-range actions' (segmented Ask me / Refuse), 'Show spotlight balance to players' (hint 'The bars in the session recap.'), 'Show adversary HP, Stress and Difficulty to players' as a disabled switch with the 'Always off' lock (no setting)"
          - "Switches are role=switch with aria-checked, optimistic (rule 12), errors shown inline; values from campaigns.get settings"
          - "The locked row is backed by a test that a player's combat queries return no adversary HP, Stress or Difficulty; if one does, a bead is filed (not fixed here)"
          - "config-table.spec.ts: GM toggles hand sharing and Fear and a second browser (player) sees the change without reload; lint, typecheck, tests pass"
      - id: U2

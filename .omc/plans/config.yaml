# Config plan (2026-11-03): campaign settings (gear), Preferences (avatar), co-GM, and the owner-only App admin.
# Epic: bead dcm-jh6d (children dcm-bxp.134 rule switches - NOT in this plan, dcm-cd8 creation cap, dcm-jh6d.1 co-GM).
# Designs: reference/designs/config/Settings.dc.html (Settings + Preferences), reference/designs/config/Admin.dc.html.
# Briefs, design-to-code map, risks, beads and the open questions: .omc/plans/config-briefs.md.
# Format: docs/workflow.md. Extra keys (plan-check ignores them): title, part, size, mode, requires_plan, blocked_on,
# after (a tracer of another plan that must be merged first), needs (a user OK, a decision or a design before the
# tracer starts: 'dependency-ok', 'decision', 'design').
#
# REVISED 2026-11-05 for the user's answers of 2026-11-04 (briefs: "User answers 2026-11-04", "Revision 2026-11-05",
# "Questions 2026-11-05"). R4 is dropped (Q4 d). New: P2, U3p, U6e, U6f, IMP (Part A); PDF0, AD12, AD13, AD14, LB1,
# AU7, AU8, AU9 (Part B). Every tracer still marked `blocked_on: Qn` was answered and its acceptance already follows
# the answer; `needs:` is what still stops a tracer. The "Build order for tonight" list is at the top of the briefs.
#
# Every Part A tracer starts only after the Journal plan's JX2 is merged (JX1 / JX2 own campaign-shell.tsx, the nav
# and src/components/journal/header/**). New config UI uses the arcane glass buttons: glassButtonClass() from
# src/components/brand/glass-button.ts (role 'neutral' / 'tool' for settings controls, 'confirm' / 'cancel' in
# confirms, 'danger' for Archive / Remove / Suspend / Delete), not brandButton (which the glass-buttons plan is
# re-pointing; switch with it if it lands first). Reads moved to *Reads modules (e.g. convex/charactersReads.ts):
# `reads:` name those.
#
# Build order the user approved: HUD wave 9 -> Journal -> this plan's Part A -> Part B -> rule switches / homebrew later.
#   Part A (waves 1-4): Campaign settings + Preferences + co-GM.
#   Part B (waves 5-8): App admin (superadmin, the app owner only).
# Tracers marked `requires_plan: journal` need the Journal plan (.omc/plans/journal.yaml) merged first:
# JO1 (a new session opens on Journal / Combat Map), JO2 (session log from the Combat Map), JO3 (spotlight balance to players).
# Tracers marked `blocked_on: Qn` change a rule or need a user answer first; they are built on the briefs' recommended
# default, and the orchestrator rewrites their acceptance if the user picks another option.
#
# Rules for every tracer (details in the briefs, section "Common rules"):
#   - Server first. Every public function is a user* / campaign / gm / creator / appOwner wrapper from
#     convex/lib/functions.ts; access only through permissionFor (`need:`) or isAppOwner (one helper); args + returns
#     validators, no v.any; indexed bounded reads; new fields are optional (widen, rule 7); growing tables have a
#     back-reference index and a cleanup path (campaign purge or a batched self-rescheduling cron).
#   - Each server tracer has its own authz area file tests/convex/authz/config-<area>.entries.ts (+ .test.ts); tests
#     assert ConvexError.data.code. Only G1 (co-GM role, class `creator`) and AD0 (role appOwner, class `appOwner`)
#     change the shared harness.
#   - Mutations send single-field intents ({ key, value }), never a whole settings object; optimistic updates on every
#     switch (rule 12). Settings save on change; no Save button.
#   - No rule switches (Book / Variant / Manual): CAMPAIGN_OPTIONS in src/lib/frames/options.ts stay as they are.
plan: config
waves:
  # ================================================================== PART A
  # ------------------------------------------------------------------ wave 1: foundation
  - wave: 1
    tracers:
      - id: S0
        title: "Part A data foundation: campaign table settings, archive stamp, co-GM role field (members and email invites), preferences / UI state / drafts / hand-fold tables, error codes, pure defaults"
        part: A
        size: M
        mode: add
        requires_plan: journal
        after: JX2
        goal: "The data Part A needs exists with defaults and is cleaned up with its campaign: a campaign carries typed table settings and an archive stamp, a member row and an email invite can be a co-GM, a user has one preferences row, per-key UI state rows and drafts, per-character hand folds have a table; campaigns.get returns the resolved settings; nothing in the UI changes"
        depends_on: []
        owns:
          - convex/tables/campaigns.ts
          - convex/lib/validators/campaigns.ts
          - convex/lib/validators/preferences.ts
          - convex/campaigns.ts
          - convex/cleanup.ts
          - src/lib/config/**
          - src/lib/errors/config.ts
          - src/lib/errors/app-error.ts
          - src/lib/convex-errors.ts
          - tests/unit/config-defaults.test.ts
          - tests/unit/config-legacy-prefs.test.ts
          - tests/convex/config-foundation.test.ts
          - tests/convex/cleanup.test.ts
          - tests/convex/schema-guard.test.ts
          - docs/data-model.md
          - docs/tasks/TASK-CONFIG-S0.md
        reads:
          - reference/designs/config/Settings.dc.html
          - src/lib/frames/options.ts
          - convex/lib/cardHand.ts
          - convex/lib/permissions.ts
          - src/components/party/dice/settings.ts
          - src/components/combat-map/actions/hand/index.tsx
          - docs/best-practices.md
        acceptance:
          - "Widen only (rule 7, CD4): campaigns gains tableSettings? = v.object of optional fields playersSeeFear (bool), outOfRange ('ask' | 'refuse'), spotlightToPlayers (bool), lorekeeperWeb (bool), lorekeeperAsk ('everyone' | 'gm'), fearAtStart ('carry' | 'pcs'), sessionOpensOn ('journal' | 'combatMap'), autoSessionLog (bool) (no clock field: Q4 d keeps the clock manual); and archivedAt? (number). campaignMembers gains role? = v.literal('coGm'); campaignInvites gains role? = v.literal('coGm') (Q8 b). Typed validators in convex/lib/validators/campaigns.ts, no JSON blob"
          - "New tables in convex/tables/campaigns.ts (already composed by convex/schema.ts, so schema.ts is untouched): userPreferences { userId, dice3d?, diceSound?, diceVolume? (0-100), reduceMotion? (bool), textSize? ('small' | 'medium' | 'large'), spotlightPing? (bool), legacyImportedAt?, updatedAt } with by_user; userUiState { userId, key ('tokenNames' | 'rangeRings' | 'adversarySort' | 'environmentSort' | 'rollFeedCollapsed' | 'gmRollFormCollapsed' | 'freeRollFormOpen'), value (typed union: bool | sort literal | array of at most 50 token id strings), updatedAt } with by_user_key, one row per key so a flip never rewrites the preferences row that prefs-sync reads (CD10, rule 6); userDrafts { userId, kind ('characterWizard' | 'customFrame'), campaignId?, schemaVersion, data (JSON text <= 64 KB, parsed with zod on the client: rule 7's schemaVersion blob, no v.any), updatedAt } with by_user_kind_campaign and by_campaign; handFolds { userId, campaignId, characterId, updatedAt } (row = folded) with by_user_character and by_campaign. No campaignPresence table: presence is the @convex-dev/presence component (Q11 b, PR1)"
          - "src/lib/config/campaign-settings.ts: TABLE_SETTING_DEFAULTS (playersSeeFear true, outOfRange 'ask' = today's behaviour, spotlightToPlayers false, lorekeeperWeb true, lorekeeperAsk 'everyone', fearAtStart 'carry' (CB p.154), sessionOpensOn 'journal', autoSessionLog true) and resolveTableSettings(stored); src/lib/config/preferences.ts: PREFERENCE_DEFAULTS, UI_STATE_DEFAULTS and the resolvers; src/lib/config/legacy-prefs.ts: readLegacyPrefs(storage) parses every browser-saved key the app writes today (Q15 b): dcm.dice.settings, dh.combat.handHidden:<campaignId>:<characterId>, dh.combat.names, dh.combat.rings, dcm:adversary-sort, dcm:environment-sort, dcm:roll-feed-collapsed, dcm:gm-roll-form-collapsed, dcm:free-roll-form-open, dh.characterWizard.<campaignId>, dh.customDraft (bad JSON / blocked storage / foreign keys = nothing), and lists the dead HUD key dcm:combat-hud for deletion; unit-tested. Convex Auth's __convexAuth* keys and the level-up draft in sessionStorage are not preferences and stay (briefs, Q15 note)"
          - "campaigns.get's summary gains settings (the resolved table settings) and archived (bool); returns validator updated; every existing campaigns test passes"
          - "cleanup.ts purges handFolds and userDrafts by campaign (bounded take, as the other per-campaign tables); cleanup.test.ts covers both; schema-guard.test.ts records a retention decision for each new table (userDrafts: campaign-scoped and bounded per user; P2 adds its retention entry with the cron)"
          - "src/lib/errors/config.ts holds the Part A codes with messages (CAMPAIGN_ARCHIVED, CO_GM_NOT_MEMBER, CO_GM_CREATOR_ONLY, SETTING_INVALID, LOREKEEPER_GM_ONLY, COMBAT_TARGET_OUT_OF_RANGE) and joins the AppErrorCode union in app-error.ts; tests assert codes"
          - "docs/data-model.md documents every new field and table; lint, typecheck, vitest pass"
      - id: S1
        title: "Settings panel and Preferences popover shell: gear + avatar in the art header and the Combat Map app bar, five-section slide-over, slot stubs, URL state"
        part: A
        size: M
        mode: add
        requires_plan: journal
        after: JX2
        goal: "Every campaign page ends its header with a gear (GM and co-GM) and an avatar (everyone): in the tall art header and in the Combat Map's app bar (HUD H9.A placeholders replaced); the gear opens the 'Campaign settings' slide-over with the design's five-section nav and footer, the avatar opens the Preferences popover; every section and row is a stub slot; the existing Players button keeps working"
        depends_on: []
        owns:
          - src/components/app-bar/account.tsx
          - src/components/app-bar/app-bar.css
          - tests/unit/app-bar.test.tsx
          - tests/e2e/app-bar.spec.ts
          - src/components/config/shell/**
          - src/components/config/slots.ts
          - src/components/config/config.css
          - src/components/config/sections/table/index.tsx
          - src/components/config/sections/rules/index.tsx
          - src/components/config/sections/players/index.tsx
          - src/components/config/sections/lorekeeper/index.tsx
          - src/components/config/sections/sessions/index.tsx
          - src/components/config/prefs/index.tsx
          - src/components/config/presence-beat.tsx
          - src/components/config/spotlight-ping.tsx
          - src/app/(gm)/campaigns/[campaignId]/campaign-shell.tsx
          - tests/unit/config/s1-*.test.tsx
          - tests/e2e/config/helpers.ts
          - tests/e2e/config-shell.spec.ts
          - docs/tasks/TASK-CONFIG-S1.md
        reads:
          - reference/designs/config/Settings.dc.html
          - src/components/brand/**
          - src/app/(gm)/campaigns/[campaignId]/players-dialog.tsx
          - src/components/journal/slots.ts
          - src/components/brand/glass-button.ts
          - src/components/app-bar/index.tsx
          - docs/tasks/TASK-HUD-H9.A.md
          - tests/e2e/a11y.ts
        acceptance:
          - "Two places, one component each: CampaignSettingsButton and PreferencesButton in src/components/app-bar/account.tsx replace H9.A's placeholders (same export names, so app-bar/index.tsx is not edited; the gear's interim Players popover and both 'on the way' notes go) and the art header (campaign-shell.tsx) renders the same two components after the nav; gear (aria-label 'Campaign settings', aria-expanded) shown when campaign.role is 'gm' (creator and co-GM), avatar (aria-label 'Preferences'; H9.A's portrait / 'GM' face kept) for everyone; 40px in the art header, the bar's 44px touch targets at tablet width; the board's 'Settings and Preferences live here' callout is not built"
          - "Buttons and controls use glassButtonClass() from src/components/brand/glass-button.ts (gear / avatar role 'tool', icon; Sign out role 'neutral'), not brandButton (plan header)"
          - "Gear opens a right slide-over dialog (640px, focus trapped, Esc closes, reduced motion = no slide): kicker '<campaign name> · GM only', H2 'Campaign settings', side nav Table / House rules / Players / Lorekeeper / Sessions (aria-current), the section slot, and the footer 'Changes save as you make them and reach every player at once.'; URL state ?settings=table|rules|players|lorekeeper|sessions (bad value -> table), closing removes it"
          - "Avatar opens the Preferences popover: avatar + name + 'Game Master' / 'Player' · campaign, the label 'Saved to your account · follows you to every device' (never 'Only on this device'), the prefs slot, an App admin link slot (renders nothing), 'Campaign settings' link (GM), Sign out (the existing sign-out action)"
          - "slots.ts documents every slot (file, owning tracer, exported name, props) like src/components/journal/slots.ts; each stub keeps its name and props; presence-beat.tsx and spotlight-ping.tsx are mounted once in the shell and render nothing yet"
          - "Each slot sits in its own error boundary (CL1); config-shell.spec.ts: GM and player open what they may (player sees no gear) from the art header (dashboard) and from the Combat Map's app bar (1440x900 and 1024x768), keyboard only, axe passes, 390x844 (phone: the art header only); app-bar.spec.ts and app-bar.test.tsx updated for the real gear / avatar; lint, typecheck, tests pass"
  # ------------------------------------------------------------------ wave 2: server
  - wave: 2
    tracers:
      - id: G1
        title: "Co-GM permission core: role coGm, the creator rank, creator wrappers, setCoGm, archived-campaign write guard, authz role + class"
        part: A
        size: L
        mode: add
        goal: "The campaign creator can make a member a co-GM and back, or invite someone by email straight in as co-GM (Q8 b); a co-GM passes every GM wrapper (permission 'owner') but not the new creator-only rank, so they can't delete, restore, purge or archive the campaign, manage co-GMs or remove the creator; campaign mutation wrappers refuse writes on an archived campaign; the authz matrix runs every entry for a co-GM too"
        depends_on: [S0]
        owns:
          - convex/lib/permissions.ts
          - convex/lib/functions.ts
          - convex/campaigns.ts
          - convex/members.ts
          - convex/lib/inviteEmail.ts
          - tests/convex/authz/harness.ts
          - tests/convex/authz/world.ts
          - tests/convex/authz/synth.ts
          - tests/convex/authz-matrix.test.ts
          - tests/convex/authz/core.entries.ts
          - tests/convex/authz/config-cogm.entries.ts
          - tests/convex/authz/config-cogm.test.ts
          - tests/convex/co-gm.test.ts
          - tests/convex/archived-guard.test.ts
          - tests/convex/functions.test.ts
          - docs/tasks/TASK-CONFIG-G1.md
        reads:
          - convex/tables/campaigns.ts
          - src/lib/config/**
          - src/lib/errors/config.ts
          - tests/convex/authz/**
          - docs/best-practices.md
        acceptance:
          - "permissions.ts: Role = 'gm' | 'coGm' | 'player'; campaignRole returns 'coGm' for a member row with role 'coGm'; rolePermission('coGm') = 'owner'; a campaign-only rank 'creator' above 'owner' (CampaignPermission = Permission | 'creator', never stored in grants) that only the campaign's ownerId gets; atLeast handles it; no other file compares roles (rule 2)"
          - "functions.ts: need accepts 'creator'; creatorQuery / creatorMutation / keyedCreatorMutation (need fixed to 'creator'); campaign mutation wrappers throw CAMPAIGN_ARCHIVED when campaign.archivedAt is set unless the option archived: 'allow' is given; queries still read archived campaigns; the wrapper table in the file header lists the new options"
          - "campaigns.ts: get maps owner-or-better to role 'gm' and adds isCreator (bool) to the summary, so every GM screen works for a co-GM unchanged; remove, restore and purge need 'creator' (restore / purge via permissionFor(..., 'creator')); markOpened passes archived: 'allow'"
          - "members.ts: setCoGm creatorMutation { userId, coGm: bool } (CO_GM_NOT_MEMBER for a non-member; idempotent); roster rows gain coGm (bool); removePlayer may remove a player (owner) but a co-GM only with 'creator' (CO_GM_CREATOR_ONLY); removing or leaving also deletes the member's handFolds rows (presence: PR1 lists members only, so a removed member drops out); leave works for a co-GM"
          - "Co-GM by email (Q8 b): members.invite gains asCoGm? (bool); asCoGm true needs 'creator' (CO_GM_CREATOR_ONLY otherwise, as Q7: only the creator makes co-GMs) and stores the invite with role 'coGm'; the invite email says 'as co-GM'; accepting it in campaigns.markOpened creates the member row with role 'coGm'; until accepted, campaignAccess treats the invited account as an invited player (no GM rights before they join); revokeInvite unchanged; co-gm.test.ts covers invite, accept and a co-GM's attempt to invite a co-GM"
          - "Authz harness: world role coGm (a member with role coGm); class defaults: gm -> coGm 'ok'; new class 'creator' (anon UNAUTHENTICATED, outsider NOT_FOUND, player FORBIDDEN, coGm FORBIDDEN, gm ok) with allowedClasses for the creator wrappers; core.entries.ts moves campaigns.remove / restore / purge to 'creator'; config-cogm area covers setCoGm"
          - "co-gm.test.ts: a co-GM runs a GM mutation (Fear, session start), can't delete / archive / setCoGm / remove the creator; demoting returns them to player; archived-guard.test.ts: a write on an archived campaign is CAMPAIGN_ARCHIVED, markOpened and queries still work; lint, typecheck, full vitest (matrix included) pass"
      - id: S2
        title: "Campaign settings server: one single-field setter for the table settings"
        part: A
        size: S
        mode: add
        goal: "A GM or co-GM changes one table setting at a time and every member's campaigns.get updates at once"
        depends_on: [S0]
        owns:
          - convex/campaignSettings.ts
          - tests/convex/campaign-settings.test.ts
          - tests/convex/authz/config-settings.entries.ts
          - tests/convex/authz/config-settings.test.ts
          - docs/tasks/TASK-CONFIG-S2.md
        reads:
          - convex/campaigns.ts
          - convex/lib/validators/campaigns.ts
          - src/lib/config/**
        acceptance:
          - "campaignSettings.set gmMutation { change } where change is a v.union of one object per field ({ key: 'playersSeeFear', value: v.boolean() }, { key: 'outOfRange', value: 'ask' | 'refuse' }, ...), patching only that field of tableSettings; a no-op change writes nothing; returns null"
          - "Unknown or wrong-typed change fails the args validator; archived campaign -> CAMPAIGN_ARCHIVED (G1's guard, once merged; until then a test marked todo)"
          - "Authz entries (class gm); tests assert codes; lint, typecheck, vitest pass"
      - id: P1
        title: "Preferences server: the account's preferences, single-field setter, one-time legacy import, hand folds"
        part: A
        size: S
        mode: add
        goal: "A signed-in user reads and changes their preferences on the account, imports the old browser values once, and folds or unfolds a character's hand on the server"
        depends_on: [S0]
        owns:
          - convex/preferences.ts
          - tests/convex/preferences.test.ts
          - tests/convex/authz/config-prefs.entries.ts
          - tests/convex/authz/config-prefs.test.ts
          - docs/tasks/TASK-CONFIG-P1.md
        reads:
          - convex/tables/campaigns.ts
          - convex/lib/validators/preferences.ts
          - src/lib/config/**
        acceptance:
          - "preferences.get userQuery returns the resolved preferences (defaults when no row) plus legacyImported (bool); preferences.set userMutation { change } single-field union (dice3d, diceSound, diceVolume 0-100 integer, reduceMotion, textSize, spotlightPing), creating the row on first write"
          - "preferences.importLegacy userMutation { dice3d?, diceSound?, folds: array (max 50) of { campaignId, characterId } }: runs once per account (legacyImportedAt), sets only fields still unset, ignores folds for campaigns or characters the caller can't see (permissionFor view on the character's campaign) and never fails for them"
          - "preferences.folds campaignQuery view returns the caller's folded character ids in the campaign (bounded); preferences.setFold campaignMutation view, archived 'allow' { characterId, folded } only for a character of that campaign (NOT_FOUND otherwise); never another user's rows"
          - "Authz entries (user / view classes); lint, typecheck, vitest pass"
      - id: P2
        title: "Account UI state and drafts server: token names, range circles, sort orders, roll-panel folds, character wizard and custom frame drafts (Q15 b)"
        part: A
        size: S
        mode: add
        goal: "Every value the app kept in the browser is kept on the account instead: a signed-in user reads and sets each UI switch one key at a time, and saves, reads and clears a character-wizard draft per campaign and the custom-frame draft; old drafts expire"
        depends_on: [S0]
        owns:
          - convex/uiState.ts
          - convex/drafts.ts
          - convex/draftsRetention.ts
          - convex/crons.ts
          - tests/convex/ui-state.test.ts
          - tests/convex/drafts.test.ts
          - tests/convex/schema-guard.test.ts
          - tests/convex/authz/config-uistate.entries.ts
          - tests/convex/authz/config-uistate.test.ts
          - docs/tasks/TASK-CONFIG-P2.md
        reads:
          - convex/tables/campaigns.ts
          - convex/lib/validators/preferences.ts
          - src/lib/config/**
          - src/app/(gm)/campaigns/[campaignId]/party/new/wizard-logic.ts
          - src/app/(gm)/new/custom-frame-form.tsx
        acceptance:
          - "uiState.get userQuery returns the caller's resolved UI state (defaults for missing keys); uiState.set userMutation { change } single-field union per key (rangeRings: array <= 50 ids, replaced whole because it is one key's value; the client sends the new list for that key only); returns null"
          - "drafts.get userQuery { kind, campaignId? } (characterWizard needs permissionFor view on the campaign, NOT_FOUND otherwise); drafts.save userMutation { kind, campaignId?, schemaVersion, data } (data <= 64 KB, else INVALID); drafts.clear; never another user's rows"
          - "uiState.importLegacy and drafts.importLegacy userMutation: take the parsed legacy values, set only keys still unset, skip drafts for campaigns the caller can't see, never fail for them; idempotent"
          - "Rule 8: draftsRetention.expire deletes drafts not updated for 90 days in batches of 200 and reschedules itself while a batch was full; crons.ts runs it daily at an odd minute; schema-guard's ALSO_RETENTION list includes userDrafts"
          - "Authz entries (user class; drafts.get view on the campaign); lint, typecheck, vitest pass"
      - id: PR1
        title: "Presence with the @convex-dev/presence component: heartbeat, disconnect and the GM's online list"
        part: A
        size: S
        mode: add
        needs: dependency-ok
        goal: "An open campaign tab keeps the caller present in the campaign's room through the @convex-dev/presence component (Q11 b), and the GM reads which members are online; identity comes from ctx.user, never from the client's arguments"
        depends_on: [S0]
        owns:
          - convex/convex.config.ts
          - convex/presence.ts
          - convex/cleanup.ts
          - tests/convex/cleanup.test.ts
          - tests/convex/presence.test.ts
          - tests/convex/authz/config-presence.entries.ts
          - tests/convex/authz/config-presence.test.ts
          - docs/tasks/TASK-CONFIG-PR1.md
        reads:
          - convex/campaigns.ts
          - convex/members.ts
          - convex/lib/functions.ts
        acceptance:
          - "Starts only after the user OKs the new dependency. The orchestrator adds @convex-dev/presence to package.json and the lockfile on rebuild first (pinned, pnpm minimumReleaseAge respected, CH11; the always-shared files stay out of tracers), then starts PR1. app.use(presence) in convex.config.ts next to rateLimiter and migrations"
          - "convex/presence.ts wraps the component's heartbeat / list / disconnect in our wrappers (rule 1): heartbeat campaignMutation view (archived 'allow'), room = campaignId, user = ctx.user._id (a userId argument the component's React hook sends is ignored or must equal the caller, else FORBIDDEN; rule 3); disconnect checks the session token belongs to the caller; list gmQuery returns only members' userIds and online flags (removed members filtered out against the member rows), so a player never reads the room"
          - "cleanup.ts removes the campaign's presence room on purge (the component's room removal), cleanup.test.ts covers it; the task doc names the component version and its own timeout (no Date.now() in our queries, CF10)"
          - "Authz entries (anon, outsider, player, coGm, gm); lint, typecheck, vitest pass"
  # ------------------------------------------------------------------ wave 3: settings take effect, UI sections, preferences applied
  - wave: 3
    tracers:
      - id: G2
        title: "Co-GM sweep: every 'is this the GM' check outside permissions.ts goes through the permission-derived role"
        part: A
        size: M
        mode: add
        blocked_on: Q6
        # Q6 answered (a). owns updated 2026-11-05 from a grep of ownerId comparisons (reads moved to *Reads modules);
        # members.ts and lib/permissions.ts are G1's.
        goal: "A co-GM is treated as a GM wherever the code asked 'is the caller the campaign's GM' by comparing with campaign.ownerId (notes, journals, character sheets, photo import, Lorekeeper context, combat requests), while places that need the creator's identity (whose journal is the GM journal, createdBy) keep it"
        depends_on: [G1]
        owns:
          - convex/notesEntries.ts
          - convex/notesThreads.ts
          - convex/notesSharing.ts
          - convex/notesJournals.ts
          - convex/lib/journalState.ts
          - convex/lib/notes.ts
          - convex/lib/characterSheet.ts
          - convex/characters.ts
          - convex/photoImport.ts
          - convex/lib/lorekeeper/context.ts
          - convex/combatRequests.ts
          - convex/charactersReads.ts
          - convex/combatVision.ts
          - convex/lorekeeperAsks.ts
          - convex/lib/cardHand.ts
          - convex/lib/combatHud.ts
          - convex/lib/combatMovement.ts
          - convex/lib/combatTokenViews.ts
          - src/lib/domain/notes/visibility.ts
          - src/lib/domain/notes/authors.ts
          - tests/convex/co-gm-sweep.test.ts
          - docs/tasks/TASK-CONFIG-G2.md
        reads:
          - convex/lib/permissions.ts
          - convex/lib/functions.ts
          - docs/best-practices.md
        acceptance:

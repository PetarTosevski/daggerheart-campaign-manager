<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day &amp; Night Icon Ideas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d1417}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;text-align:center}
.ic-box{position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.ic-name{font-size:12px;line-height:1.25;color:#c8d3d0}
</style>
</helmet>
<div style="min-height: 100vh; background: #0d1417; color: #e6ecea; font-family: 'IBM Plex Sans', sans-serif; padding: 40px 48px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.24em; color: #9fb2b6">Dashboard · Time arch</div>
<h1 style="margin: 0; font-family: 'Cinzel', serif; font-size: 38px; font-weight: 900">Day &amp; Night Icon Ideas</h1>
<p style="margin: 0; font-size: 15px; color: #9fb2b6; max-width: 860px">Five icon sets for the seven stages of the Long Day and the Long Night. Pick a set (or mix pieces) and it goes onto the dashboard arch.</p>
</header>
<sc-for list="{{ sets }}" as="set" hint-placeholder-count="5">
<section aria-label="{{ set.name }}" style="padding: 20px 24px; border-radius: 16px; background: #121b1f; border: 1px solid #253338; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap"><span style="font-family: 'Cinzel', serif; font-size: 24px; font-weight: 900; color: #e3b45a">{{ set.num }}</span><span style="font-family: 'Cinzel', serif; font-size: 22px; font-weight: 700">{{ set.name }}</span><span style="font-size: 14px; color: #9fb2b6">{{ set.note }}</span></div>
<sc-for list="{{ set.rows }}" as="row" hint-placeholder-count="2">
<div style="display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap">
<span style="width: 70px; padding-top: 22px; font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700; color: {{ row.color }}">{{ row.label }}</span>
<sc-for list="{{ row.icons }}" as="ic" hint-placeholder-count="7">
<div class="ic"><div class="ic-box" style="{{ ic.box }}"><svg viewBox="0 0 48 48" width="100%" height="100%" aria-hidden="true" style="position: absolute; inset: 0"><path d="{{ ic.p0.d }}" fill="{{ ic.p0.f }}" stroke="{{ ic.p0.s }}" stroke-width="{{ ic.p0.w }}" opacity="{{ ic.p0.o }}" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{ ic.p1.d }}" fill="{{ ic.p1.f }}" stroke="{{ ic.p1.s }}" stroke-width="{{ ic.p1.w }}" opacity="{{ ic.p1.o }}" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{ ic.p2.d }}" fill="{{ ic.p2.f }}" stroke="{{ ic.p2.s }}" stroke-width="{{ ic.p2.w }}" opacity="{{ ic.p2.o }}" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{ ic.p3.d }}" fill="{{ ic.p3.f }}" stroke="{{ ic.p3.s }}" stroke-width="{{ ic.p3.w }}" opacity="{{ ic.p3.o }}" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{ ic.p4.d }}" fill="{{ ic.p4.f }}" stroke="{{ ic.p4.s }}" stroke-width="{{ ic.p4.w }}" opacity="{{ ic.p4.o }}" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{ ic.p5.d }}" fill="{{ ic.p5.f }}" stroke="{{ ic.p5.s }}" stroke-width="{{ ic.p5.w }}" opacity="{{ ic.p5.o }}" stroke-linecap="round" stroke-linejoin="round"></path></svg><span aria-hidden="true" style="{{ ic.orb }}"></span></div><span class="ic-name">{{ ic.name }}</span></div>
</sc-for>
</div>
</sc-for>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    const f = (n) => Number(n.toFixed(2));
    const circ = (cx, cy, r) => 'M ' + f(cx - r) + ' ' + f(cy) + ' a ' + r + ' ' + r + ' 0 1 0 ' + f(2 * r) + ' 0 a ' + r + ' ' + r + ' 0 1 0 ' + f(-2 * r) + ' 0 Z';
    const cres = (cx, cy, r, k) => { k = k ?? 0.6; return 'M ' + f(cx) + ' ' + f(cy - r) + ' A ' + r + ' ' + r + ' 0 1 0 ' + f(cx) + ' ' + f(cy + r) + ' A ' + f(r * k) + ' ' + r + ' 0 1 1 ' + f(cx) + ' ' + f(cy - r) + ' Z'; };
    const rays = (cx, cy, r1, r2, n, off) => Array.from({ length: n }, (_, i) => { const a = (i / n) * Math.PI * 2 + (off || 0); return 'M ' + f(cx + r1 * Math.cos(a)) + ' ' + f(cy + r1 * Math.sin(a)) + ' L ' + f(cx + r2 * Math.cos(a)) + ' ' + f(cy + r2 * Math.sin(a)); }).join(' ');
    const starburst = (cx, cy, r1, r2, n) => 'M ' + Array.from({ length: n * 2 }, (_, i) => { const r = i % 2 ? r1 : r2; const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2; return f(cx + r * Math.cos(a)) + ' ' + f(cy + r * Math.sin(a)); }).join(' L ') + ' Z';
    const spark = (x, y, s) => 'M ' + x + ' ' + f(y - s) + ' L ' + f(x + s * 0.25) + ' ' + f(y - s * 0.25) + ' L ' + f(x + s) + ' ' + y + ' L ' + f(x + s * 0.25) + ' ' + f(y + s * 0.25) + ' L ' + x + ' ' + f(y + s) + ' L ' + f(x - s * 0.25) + ' ' + f(y + s * 0.25) + ' L ' + f(x - s) + ' ' + y + ' L ' + f(x - s * 0.25) + ' ' + f(y - s * 0.25) + ' Z';
    const dots = (pts) => pts.map(([x, y]) => 'M ' + x + ' ' + y + ' l 0.01 0').join(' ');
    const P = (d, fill, stroke, w, o) => ({ d: d || 'M 0 0', f: fill || 'none', s: stroke || 'none', w: w || 0, o: o ?? 1 });
    const pad = (arr) => { const o = {}; for (let i = 0; i < 6; i++) o['p' + i] = arr[i] || P(); return o; };
    const DAYN = ['Dawn', 'Sunrise', 'Morning', 'High Noon', 'Afternoon', 'Sunset', 'Nautical Twilight'];
    const NIGHTN = ['Nightfall', 'Moonrise', 'Deep Night', 'Midnight', 'Witching Hour', 'Small Hours', 'Nautical Dawn'];
    // body position across the sky for stages 0..6
    const POS = [[9, 40], [13, 33], [17, 22], [24, 13], [31, 22], [35, 33], [39, 41]];
    const HZ = 34;

    // A · Woodcut
    const woodcut = (night, k) => {
      const ink = night ? '#cdd6ff' : '#f2c76b';
      const [x, y] = k === 0 ? [12, 35] : k === 6 ? [36, 36] : POS[k]; const below = k === 0 || k === 6;
      const ground = P('M 4 ' + HZ + ' H 44 M 8 ' + (HZ + 4) + ' H 40 M 13 ' + (HZ + 8) + ' H 35', null, ink, 1.6, 0.85);
      if (!night) {
        const body = k === 3 ? P(starburst(24, 18, 7, 13, 12), ink) : P(starburst(x, y, 4.5, 8.5, 10), ink, null, 0, below ? 0.45 : 1);
        const core = P(circ(k === 3 ? 24 : x, k === 3 ? 18 : y, k === 3 ? 4.5 : 3), '#1a1408');
        const mask = P('M 0 ' + HZ + ' H 48 V 48 H 0 Z', '#121b1f');
        return pad([body, core, mask, ground, k === 6 ? P(spark(10, 10, 2.5) + ' ' + spark(36, 8, 2) + ' ' + spark(24, 6, 1.6), ink) : null]);
      }
      const ph = [0.75, 0.55, 0.3, 0, -0.3, -0.55, -0.75][k];
      const body = k === 3 ? P(circ(24, 17, 9), ink) : P(cres(x, y, 7, Math.abs(ph)), ink, null, 0, below ? 0.5 : 1);
      const hatch = P('M ' + (x - 3) + ' ' + (y - 3) + ' l 4 4 M ' + (x - 4) + ' ' + y + ' l 3 3', null, '#121b1f', 1, k === 3 ? 0 : 0.8);
      const mask = P('M 0 ' + HZ + ' H 48 V 48 H 0 Z', '#121b1f');
      const stars = P(spark(8, 8, 2.5) + ' ' + spark(40, 10, 2) + (k >= 2 && k <= 4 ? ' ' + spark(34, 28, 1.6) + ' ' + spark(12, 26, 1.4) : ''), ink, null, 0, k === 6 ? 0.4 : 1);
      return pad([body, hatch, mask, ground, stars, k === 4 ? P('M 30 6 c 4 2 6 6 4 11', null, '#b48cff', 1.6) : null]);
    };

    // B · Sky windows
    const SKYD = [['#2c2a55', '#e98a6b'], ['#7fb5e6', '#f6b26b'], ['#8ec5f0', '#e3f2ff'], ['#2f7fd6', '#a9d4ff'], ['#6ba8e0', '#f3d7a0'], ['#7a2e5c', '#f07a3c'], ['#141a44', '#4a3a7a']];
    const SKYN = [['#0f1230', '#3a2d63'], ['#141a40', '#3a3060'], ['#080b22', '#141a3d'], ['#03051a', '#0d1230'], ['#140826', '#3a1458'], ['#0e1430', '#22305a'], ['#1c2a5a', '#8a6a9a']];
    const sky = (night, k) => {
      const [top, bot] = (night ? SKYN : SKYD)[k]; const [x, y] = POS[k];
      const box = 'border-radius: 50%; overflow: hidden; border: 3px solid ' + (night ? '#8a93c9' : '#c9a24a') + '; background: linear-gradient(180deg, ' + top + ', ' + bot + '); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);';
      const body = night ? P(k === 3 ? circ(24, 16, 7) : cres(x, y, 6, [0.75, 0.55, 0.3, 0, 0.35, 0.55, 0.8][k]), k === 4 ? '#d9b8ff' : '#eef1ff')
        : P(circ(x, y, k === 3 ? 7 : 6), ['#ffd1a8', '#ffc36b', '#fff2b8', '#ffffff', '#ffe08a', '#ff8a4a', '#ff9a6a'][k]);
      const glow = night ? null : P(circ(x, y, k === 3 ? 12 : 10), ['#ffb38a', '#ffc36b', '#fff2b8', '#ffffff', '#ffe08a', '#ff7a3a', '#ff9a6a'][k], null, 0, 0.25);
      const stars = night || k === 6 || k === 0 ? P(dots([[8, 10], [38, 8], [30, 20], [14, 24], [42, 22]]), null, '#ffffff', 1.6, k === 6 || (night && k === 6) ? 0.5 : 0.9) : null;
      const ground = P('M 0 ' + HZ + ' Q 12 ' + (HZ - 3) + ' 24 ' + HZ + ' T 48 ' + (HZ - 1) + ' V 48 H 0 Z', night ? '#05060f' : '#1c2a1a');
      const cloud = night && k === 4 ? P('M 10 26 a 4 4 0 0 1 6 -4 a 5 5 0 0 1 9 2 a 3.5 3.5 0 0 1 0 7 H 12 a 3 3 0 0 1 -2 -5 Z', '#2a1a40', null, 0, 0.9) : null;
      return { ...pad([glow, body, cloud, stars, ground]), box };
    };

    // C · Alchemical sigils
    const sigil = (night, k) => {
      const c = night ? '#b8c2ff' : '#e3b45a';
      const frame = P(circ(24, 24, 20), null, c, 1.4, 0.8);
      const hz = P('M 6 30 H 42', null, c, 1.4);
      const ticks = P(Array.from({ length: k + 1 }, (_, i) => 'M ' + (24 - k * 2.5 + i * 5) + ' 37 v 3').join(' '), null, c, 1.6);
      const [x, y0] = POS[k]; const y = 30 - (30 - y0) * 0.8;
      let body;
      if (!night) body = P(circ(x, y, 4.5) + ' ' + circ(x, y, 0.9), null, c, 1.5);
      else body = P(k === 3 ? circ(24, 15, 5) : cres(x, y, 5, 0.55), null, c, 1.5);
      const accent = !night ? (k === 3 ? P(rays(24, 15, 7, 9.5, 8), null, c, 1.4) : P('M ' + x + ' ' + (y - 6) + ' v -2.5', null, c, 1.4, k === 0 || k === 6 ? 0 : 1))
        : P(dots([[14, 12], [34, 11], [24, 8]]), null, c, 1.8, k === 3 ? 1 : 0.6);
      const arrow = (k === 1 || k === 5) ? P(k === 1 ? 'M 24 22 v -6 M 21.5 18.5 L 24 16 L 26.5 18.5' : 'M 24 16 v 6 M 21.5 19.5 L 24 22 L 26.5 19.5', null, c, 1.4) : null;
      return pad([frame, hz, ticks, body, accent, arrow]);
    };

    // D · Orbit dial
    const orbit = (night, k) => {
      const c = night ? '#a9b8ff' : '#ffcf6a'; const dim = 'rgba(255, 255, 255, 0.22)';
      const a = Math.PI - (k / 6) * Math.PI; const r = 17; const x = 24 + r * Math.cos(a); const y = 34 - r * Math.sin(a);
      const track = P('M 7 34 A 17 17 0 0 1 41 34', null, dim, 2);
      const lit = k === 0 ? null : P('M 7 34 A 17 17 0 0 1 ' + f(x) + ' ' + f(y), null, c, 2.6);
      const hz = P('M 3 34 H 45', null, c, 1.2, 0.6);
      const ticks = P(Array.from({ length: 7 }, (_, i) => { const t = Math.PI - (i / 6) * Math.PI; return 'M ' + f(24 + 20 * Math.cos(t)) + ' ' + f(34 - 20 * Math.sin(t)) + ' L ' + f(24 + 22.5 * Math.cos(t)) + ' ' + f(34 - 22.5 * Math.sin(t)); }).join(' '), null, dim, 1.2);
      const body = night ? P(k === 3 ? circ(x, y, 5) : cres(x, y, 5, [0.8, 0.6, 0.35, 0, 0.35, 0.6, 0.8][k]), c) : P(circ(x, y, 4.5) + ' ' + rays(x, y, 6, 8, 8), c, c, 1.3);
      const label = P(night ? dots([[24, 42]]) : 'M 22 42 h 4', null, c, 2, 0.6);
      return pad([track, ticks, lit, hz, body, label]);
    };

    // E · Glowing orbs (pure CSS)
    const orbs = (night, k) => {
      let st;
      if (!night) {
        const S = [[20, '#ffb8a0', '#c0566a', 10], [28, '#ffd27a', '#e0782a', 16], [32, '#fffbe0', '#ffd25a', 18], [38, '#ffffff', '#ffe27a', 26], [32, '#fff0b0', '#f0a83a', 18], [30, '#ff9a5a', '#a8282a', 18], [22, '#b9a6ff', '#3a2a7a', 10]][k];
        st = 'position: absolute; left: 50%; top: 50%; width: ' + S[0] + 'px; height: ' + S[0] + 'px; margin: ' + (-S[0] / 2) + 'px 0 0 ' + (-S[0] / 2) + 'px; border-radius: 50%; background: radial-gradient(circle at 38% 35%, ' + S[1] + ', ' + S[2] + '); box-shadow: 0 0 ' + S[3] + 'px ' + Math.round(S[3] / 3) + 'px ' + S[1] + (k === 6 ? ', 0 0 0 4px rgba(185, 166, 255, 0.25)' : '') + ';';
      } else {
        const shade = [26, 18, 10, 0, -8, -16, -24][k];
        const tint = k === 4 ? '#e6ccff' : '#eef1ff';
        st = 'position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, ' + tint + ', #9aa4d6); box-shadow: inset ' + shade + 'px 0 0 2px #0b0f2a, 0 0 ' + (k === 3 ? 22 : 10) + 'px ' + (k === 4 ? 'rgba(200, 140, 255, 0.7)' : 'rgba(170, 185, 255, 0.5)') + ';' + (k === 0 || k === 6 ? ' opacity: 0.65;' : '');
      }
      return { ...pad([]), orb: st, box: 'border-radius: 50%; background: radial-gradient(circle, ' + (night ? '#141a3d' : '#2a2014') + ' 0%, transparent 70%);' };
    };

    const build = (fn) => [false, true].map((night) => ({ label: night ? 'Night' : 'Day', color: night ? '#a9b8ff' : '#ffcf6a',
      icons: Array.from({ length: 7 }, (_, k) => ({ box: '', orb: 'display: none;', ...fn(night, k), name: (night ? NIGHTN : DAYN)[k] })) }));
    const sets = [
      { num: 'A', name: 'Woodcut', note: 'Bold engraved suns and moons rising over a hatched horizon', fn: woodcut },
      { num: 'B', name: 'Sky Windows', note: 'Round windows onto the sky, so the color tells you the hour', fn: sky },
      { num: 'C', name: 'Alchemical Sigils', note: 'Thin gold glyphs, with tick marks counting the day', fn: sigil },
      { num: 'D', name: 'Orbit Dial', note: 'The sun or moon travels its own little arc, showing exactly where we are', fn: orbit },
      { num: 'E', name: 'Glowing Orbs', note: 'Soft painted lights: the sun changes heat and the moon waxes and wanes', fn: orbs }
    ].map((s) => ({ num: s.num, name: s.name, note: s.note, rows: build(s.fn) }));
    return { sets };
  }
}
</script>
</body>
</html>

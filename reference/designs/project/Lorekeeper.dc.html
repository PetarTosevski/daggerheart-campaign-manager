  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

card{padding:16px;border-radius:14px;background:#141e22;border:1px solid #253338;display:flex;flex-direction:column;gap:10px}\n.lk-h{margin:0;font-family:'Cinzel',serif;font-size:16px;font-weight:700;letter-spacing:.04em}\n.lk-lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9fb2b6}\n.lk-muted{color:#9fb2b6;font-size:13.5px;line-height:1.5}\n.lk-src{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:10px;background:#0f171a;border:1px solid #1f2b30}\n.lk-book{width:34px;height:44px;border-radius:3px 6px 6px 3px;box-shadow:inset 3px 0 0 rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.4)}\n.lk-pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}\n.lk-ok{background:#1d3a2a;color:#9fe7bb}\n.lk-amber{background:#3a2c12;color:#f3cf86}\n.lk-red{background:#3a1c1c;color:#ffb4a8}\n.lk-chat{display:flex;flex-direction:column;min-height:calc(100vh - 140px);border-radius:16px;border:1px solid #253338;background:radial-gradient(1200px 500px at 50% -10%,rgba(227,180,90,.07),transparent 60%),#0b1214;overflow:hidden}\n.lk-chathead{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid #1f2b30;background:rgba(10,16,18,.6)}\n.lk-sigil{width:52px;height:52px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#3a2a12,#120c05);border:2px solid #c9a24a;box-shadow:0 0 0 4px rgba(201,162,74,.12),0 0 24px rgba(227,180,90,.18)}\n.lk-name{font-family:'Cinzel',serif;font-size:22px;font-weight:900;letter-spacing:.06em;margin:0}\n.lk-stream{flex:1;padding:22px 24px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}\n.lk-q{align-self:flex-end;max-width:70%;display:flex;flex-direction:column;align-items:flex-end;gap:4px}\n.lk-qb{padding:10px 14px;border-radius:14px 14px 4px 14px;background:#24343a;border:1px solid #33464d;font-size:15px;line-height:1.5}\n.lk-who{font-size:1 ><path d=\"M18 12l-1 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"flex: 1; min-width: 0\"><h2 class=\"lk-name\">The Lorekeeper<\u002Fh2><span class=\"lk-muted\">Keeper of your rulebooks · answers rule questions<\u002Fspan><\u002Fdiv><button type=\"button\" class=\"lk-act\" style=\"color: #e6ecea; border-color: #33444a\" aria-label=\"Close\">✕<\u002Fbutton><\u002Fdiv>\n<div class=\"lk-stream\" role=\"log\" aria-live=\"polite\">\n<sc-for list=\"{{ msgs }}\" as=\"m\" hint-placeholder-count=\"3\"><div style=\"display: contents\">\n<sc-if value=\"{{ m.isQ }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"lk-q\"><span class=\"lk-who\">{{ m.who }}<\u002Fspan><div class=\"lk-qb\">{{ m.text }}<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ m.isThinking }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"lk-a\"><span class=\"lk-mini\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"#e3b45a\" stroke-width=\"1.6\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 9c4-2 8-2 12 1v15c-4-3-8-3-12-1Z\" fill=\"rgba(227,180,90,.15)\"><\u002Fpath><path d=\"M28 9c-4-2-8-2-12 1v15c4-3 8-3 12-1Z\" fill=\"rgba(227,180,90,.08)\"><\u002Fpath><path d=\"M19 5l7-3-4 8-4 2Z\" fill=\"#e3b45a\" stroke=\"none\"><\u002Fpath><path d=\"M18 12l-1 2\"><\u002Fpath><\u002Fsvg><\u002Fspan><div class=\"lk-thinking\"><span class=\"lk-dots\" aria-hidden=\"true\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan>{{ m.text }}<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ m.isA }}\" hint-placeholder-val=\"{{ true }}\"><div class=\"lk-a\"><span class=\"lk-mini\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"#e3b45a\" stroke-width=\"1.6\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 9c4-2 8-2 12 1v15c-4-3-8-3-12-1Z\" fill=\"rgba(227,180,90,.15)\"><\u002Fpath><path d=\"M28 9c-4-2-8-2-12 1v15c4-3 8-3 12-1Z\" fill=\"rgba(227,180,90,.08)\"><\u002Fpath><path d=\"M19 5l7-3-4 8-4 2Z\" fill=\"#e3b45a\" stroke=\"none\"><\u002Fpath><path d=\"M18 12l-1 2\"><\u002Fpath><\u002Fsvg><\u002Fspan><div class=\"lk-ab\">\n<span class=\"{{ m.vCls }}\"><span aria-hidden=\"true\">{{ m.vIcon }}<\u002Fspan>{{ m.verdict }}<\u002Fspan>\n<p>{{ m.text }}<\u002Fp>\n<sc-for list=\"{{ m.quotes }}\" as=\"qq\" hint-placeholder-count=\"1\"><div style=\"display: flex; flex-direction: column; gap: 6px\"><blockquote class=\"lk-quote\">{{ qq.text }}<\u002Fblockquote><div class=\"lk-cite\"><span class=\"lk-chip\">📖 {{ qq.src }}<\u002Fspan><span>{{ qq.sec }}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<sc-if value=\"{{ m.hasCall }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"lk-call\"><span class=\"lk-lbl\" style=\"color: #8a5a12\">Suggested GM call<\u002Fspan><p style=\"font-size: 16.5px\">{{ m.call }}<\u002Fp><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ m.hasWeb }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"lk-web\"><div class=\"lk-disc\"><span aria-hidden=\"true\">⚠<\u002Fspan><span><strong>From the internet · unofficial.<\u002Fstrong> {{ m.disc }}<\u002Fspan><\u002Fdiv><sc-for list=\"{{ m.web }}\" as=\"w\" hint-placeholder-count=\"2\"><div class=\"lk-res\"><strong>{{ w.title }}<\u002Fstrong><span class=\"d\">{{ w.site }}<\u002Fspan><p>{{ w.text }}<\u002Fp><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n<div class=\"lk-acts\"><sc-for list=\"{{ m.acts }}\" as=\"ac\" hint-placeholder-count=\"2\"><button type=\"button\" class=\"lk-act\">{{ ac }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"lk-compose\">\n<div class=\"lk-sugs\"><sc-for list=\"{{ sugs }}\" as=\"sg\" hint-placeholder-count=\"4\"><button type=\"button\" class=\"lk-sug\" sc-camel-on-click=\"{{ sg.ask }}\">{{ sg.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<div class=\"lk-inrow\"><textarea class=\"lk-in\" rows=\"1\" placeholder=\"Ask The Lorekeeper a rules question…\" value=\"{{ draft }}\" sc-camel-on-change=\"{{ setDraft }}\" aria-label=\"Your question\"><\u002Ftextarea><button type=\"button\" class=\"lk-send\" sc-camel-on-click=\"{{ send }}\">Ask<\u002Fbutton><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap\"><span class=\"lk-lbl\">If the books don’t say<\u002Fspan><div class=\"lk-toggle\" role=\"group\" aria-label=\"Internet search\"><button type=\"button\" aria-pressed=\"{{ webOn }}\" sc-camel-on-click=\"{{ webYes }}\">Search the internet too<\u002Fbutton><button type=\"button\" aria-pressed=\"{{ webOff }}\" sc-camel-on-click=\"{{ webNo }}\">Books only<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Faside>\n<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ isPage }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display: contents\">\n<header class=\"lk-top\"><div class=\"lk-topin\"><div class=\"lk-brand\">DAGGERHEART<\u002Fdiv><nav class=\"lk-nav\" aria-label=\"Campaign sections\"><sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"9\"><a href=\"{{ n.href }}\" aria-current=\"{{ n.cur }}\">{{ n.label }}<\u002Fa><\u002Fsc-for><\u002Fnav><\u002Fdiv><\u002Fheader>\n<main class=\"lk-main\">\n<aside class=\"lk-side\">\n<section class=\"lk-card\" aria-label=\"Library\"><div style=\"display: flex; justify-content: space-between; align-items: center\"><h2 class=\"lk-h\">Library<\u002Fh2><button type=\"button\" class=\"lk-act\" style=\"color: #e6ecea; border-color: #33444a\">＋ Add PDF<\u002Fbutton><\u002Fdiv>\n<span class=\"lk-muted\">The Lorekeeper only answers from these books. Turn one off to leave it out.<\u002Fspan>\n<sc-for list=\"{{ books }}\" as=\"b\" hint-placeholder-count=\"4\"><div class=\"lk-src\"><span class=\"lk-book\" aria-hidden=\"true\" style=\"{{ b.cover }}\"><\u002Fspan><div style=\"min-width: 0\"><div style=\"font-weight: 600; font-size: 14px\">{{ b.name }}<\u002Fdiv><div class=\"lk-muted\" style=\"font-size: 12px\">{{ b.sub }}<\u002Fdiv><\u002Fdiv><span class=\"{{ b.pillCls }}\">{{ b.state }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fsection>\n<section class=\"lk-card\" aria-label=\"How answers are marked\"><h2 class=\"lk-h\">How I answer<\u002Fh2>\n<div class=\"lk-legend\"><span class=\"lk-pill lk-ok\">From the rules<\u002Fspan><span>Quoted from your books, with the book and section.<\u002Fspan><span class=\"lk-pill lk-amber\">Rules unclear<\u002Fspan><span>The books touch on it but don’t settle it. You get what they say and a suggested GM call.<\u002Fspan><span class=\"lk-pill lk-red\">Not in your books<\u002Fspan><span>Nothing found. Results from the internet follow, clearly marked as unofficial.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n<section class=\"lk-card\" aria-label=\"Table rulings\"><div style=\"display: flex; justify-content: space-between; align-items: center\"><h2 class=\"lk-h\">Table rulings<\u002Fh2><span class=\"lk-muted\" style=\"font-size: 12px\">{{ rulingCount }}<\u002Fspan><\u002Fdiv>\n<span class=\"lk-muted\">Calls your GM pinned. The Lorekeeper quotes these before the internet.<\u002Fspan>\n<sc-for list=\"{{ rulings }}\" as=\"r\" hint-placeholder-count=\"2\"><div class=\"lk-ruling\"><strong>{{ r.title }}<\u002Fstrong><span class=\"lk-muted\" style=\"font-size: 13px\">{{ r.text }}<\u002Fspan><span class=\"lk-lbl\" style=\"font-size: 10px\">{{ r.meta }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fsection>\n<\u002Faside>\n<section class=\"lk-chat\" aria-label=\"The Lorekeeper\">\n<div class=\"lk-chathead\"><div class=\"lk-sigil\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"#e3b45a\" stroke-width=\"1.6\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 9c4-2 8-2 12 1v15c-4-3-8-3-12-1Z\" fill=\"rgba(227,180,90,.15)\"><\u002Fpath><path d=\"M28 9c-4-2-8-2-12 1v15c4-3 8-3 12-1Z\" fill=\"rgba(227,180,90,.08)\"><\u002Fpath><path d=\"M19 5l7-3-4 8-4 2Z\" fill=\"#e3b45a\" stroke=\"none\"><\u002Fpath><path d=\"M18 12l-1 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"flex: 1; min-width: 0\"><h1 class=\"lk-name\">The Lorekeeper<\u002Fh1><span class=\"lk-muted\">Keeper of your rulebooks · answers rule questions<\u002Fspan><\u002Fdiv><span class=\"lk-pill lk-ok\" style=\"font-size: 12px\">{{ indexText }}<\u002Fspan><\u002Fdiv>\n<div class=\"lk-stream\" role=\"log\" aria-live=\"polite\">\n<sc-for list=\"{{ msgs }}\" as=\"m\" hint-placeholder-count=\"3\"><div style=\"display: contents\">\n<sc-if value=\"{{ m.isQ }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"lk-q\"><span class=\"lk-who\">{{ m.who }}<\u002Fspan><div class=\"lk-qb\">{{ m.text }}<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ m.isThinking }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"lk-a\"><span class=\"lk-mini\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"#e3b45a\" stroke-width=\"1.6\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 9c4-2 8-2 12 1v15c-4-3-8-3-12-1Z\" fill=\"rgba(227,180,90,.15)\"><\u002Fpath><path d=\"M28 9c-4-2-8-2-12 1v15c4-3 8-3 12-1Z\" fill=\"rgba(227,180,90,.08)\"><\u002Fpath><path d=\"M19 5l7-3-4 8-4 2Z\" fill=\"#e3b45a\" stroke=\"none\"><\u002Fpath><path d=\"M18 12l-1 2\"><\u002Fpath><\u002Fsvg><\u002Fspan><div class=\"lk-thinking\"><span class=\"lk-dots\" aria-hidden=\"true\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan>{{ m.text }}<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ m.isA }}\" hint-placeholder-val=\"{{ true }}\"><div class=\"lk-a\"><span class=\"lk-mini\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"#e3b45a\" stroke-width=\"1.6\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 9c4-2 8-2 12 1v15c-4-3-8-3-12-1Z\" fill=\"rgba(227,180,90,.15)\"><\u002Fpath><path d=\"M28 9c-4-2-8-2-12 1v15c4-3 8-3 12-1Z\" fill=\"rgba(227,180,90,.08)\"><\u002Fpath><path d=\"M19 5l7-3-4 8-4 2Z\" fill=\"#e3b45a\" stroke=\"none\"><\u002Fpath><path d=\"M18 12l-1 2\"><\u002Fpath><\u002Fsvg><\u002Fspan><div class=\"lk-ab\">\n<span class=\"{{ m.vCls }}\"><span aria-hidden=\"true\">{{ m.vIcon }}<\u002Fspan>{{ m.verdict }}<\u002Fspan>\n<p>{{ m.text }}<\u002Fp>\n<sc-for list=\"{{ m.quotes }}\" as=\"qq\" hint-placeholder-count=\"1\"><div style=\"display: flex; flex-direction: column; gap: 6px\"><blockquote class=\"lk-quote\">{{ qq.text }}<\u002Fblockquote><div class=\"lk-cite\"><span class=\"lk-chip\">📖 {{ qq.src }}<\u002Fspan><span>{{ qq.sec }}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<sc-if value=\"{{ m.hasCall }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"lk-call\"><span class=\"lk-lbl\" style=\"color: #8a5a12\">Suggested GM call<\u002Fspan><p style=\"font-size: 16.5px\">{{ m.call }}<\u002Fp><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ m.hasWeb }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"lk-web\"><div class=\"lk-disc\"><span aria-hidden=\"true\">⚠<\u002Fspan><span><strong>From the internet · unofficial.<\u002Fstrong> {{ m.disc }}<\u002Fspan><\u002Fdiv><sc-for list=\"{{ m.web }}\" as=\"w\" hint-placeholder-count=\"2\"><div class=\"lk-res\"><strong>{{ w.title }}<\u002Fstrong><span class=\"d\">{{ w.site }}<\u002Fspan><p>{{ w.text }}<\u002Fp><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n<div class=\"lk-acts\"><sc-for list=\"{{ m.acts }}\" as=\"ac\" hint-placeholder-count=\"2\"><button type=\"button\" class=\"lk-act\">{{ ac }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"lk-compose\">\n<div class=\"lk-sugs\"><sc-for list=\"{{ sugs }}\" as=\"sg\" hint-placeholder-count=\"4\"><button type=\"button\" class=\"lk-sug\" sc-camel-on-click=\"{{ sg.ask }}\">{{ sg.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<div class=\"lk-inrow\"><textarea class=\"lk-in\" rows=\"1\" placeholder=\"Ask The Lorekeeper a rules question…\" value=\"{{ draft }}\" sc-camel-on-change=\"{{ setDraft }}\" aria-label=\"Your question\"><\u002Ftextarea><button type=\"button\" class=\"lk-send\" sc-camel-on-click=\"{{ send }}\">Ask<\u002Fbutton><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap\"><span class=\"lk-lbl\">If the books don’t say<\u002Fspan><div class=\"lk-toggle\" role=\"group\" aria-label=\"Internet search\"><button type=\"button\" aria-pressed=\"{{ webOn }}\" sc-camel-on-click=\"{{ webYes }}\">Search the internet too<\u002Fbutton><button type=\"button\" aria-pressed=\"{{ webOff }}\" sc-camel-on-click=\"{{ webNo }}\">Books only<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1100}}\">\nconst CFG = {\"name\": \"The Lorekeeper\", \"short\": \"Lorekeeper\", \"layout\": \"page\", \"convo\": \"full\"};\nconst A = {\n  crit: { kind: 'ok', verdict: 'From the rules', text: 'Yes. When your Hope Die and Fear Die land on the same number, that’s a critical success: you succeed automatically, gain a Hope and clear a Stress. On an attack, you also deal critical damage: add the highest possible result of your damage dice to the roll.',\n    quotes: [{ text: 'If your Duality Dice show matching results, you get a critical success… you gain a Hope and clear a Stress.', src: 'Core Rulebook', sec: 'Core Mechanics → Critical Success' }, { text: 'Critical damage: add the maximum possible value of your damage dice to your damage roll.', src: 'Core Rulebook', sec: 'Combat → Damage' }],\n    acts: ['Open in the book', 'Pin as table ruling', 'Copy'] },\n  hex: { kind: 'unclear', verdict: 'Rules unclear', text: 'The Witch’s Hex says what one Hex does, but nothing says whether two Hexes from different Witches add together on the same target. The book doesn’t settle it, so this one is the GM’s call.',\n    quotes: [{ text: 'Mark a Stress to temporarily Hex a target within Far range. While Hexed, the target gains a penalty to their damage rolls and Difficulty equal to your tier.', src: 'Hope & Fear', sec: 'Witch → Class Feature: Hex' }],\n    call: 'Count only the biggest Hex penalty on a target. Most tables treat the same condition from two sources as not stacking.', acts: ['Ask the GM', 'Pin as table ruling', 'Copy'] },\n  breath: { kind: 'web', verdict: 'Not in your books', text: 'I couldn’t find anything in your books about holding your breath or drowning. Here’s what other players do. None of it is a rule: check with your GM before you rely on it.',\n    disc: 'These are other people’s readings and house rules found online, not text from Daggerheart. Your GM decides.',\n    web: [{ title: 'Holding breath underwater — how does your table run it?', site: 'reddit.com · r/daggerheart', text: 'Most replies run it as a countdown: the GM sets a short count, and each failed Agility or Strength roll ticks it down or marks a Stress.' },\n      { title: 'Underwater scenes without new rules', site: 'Community Discord · rules channel', text: 'Treat lack of air as escalating Stress; when Stress is full, the character marks Hit Points instead.' },\n      { title: 'Borrowing from other games', site: 'Blog post', text: 'Some GMs borrow D&D 5e’s guideline (about a minute plus Constitution) and translate it to rounds. Not Daggerheart rules.' }],\n    acts: ['Ask the GM', 'Pin as table ruling', 'Copy'] },\n  range: { kind: 'ok', verdict: 'From the rules', text: 'Close is up to 6 squares away on a grid. For reference: Melee is 1 square, Very Close 3, Close 6 and Far 12; anything beyond is Very Far.',\n    quotes: [{ text: 'Melee: 1 square · Very Close: 3 squares · Close: 6 squares · Far: 12 squares · Very Far: 13 or more.', src: 'Core Rulebook', sec: 'Combat → Range on a grid' }], acts: ['Show on Combat Map', 'Copy'] }\n};\nconst ASK = { crit: 'If my Hope and Fear dice match on an attack, do I deal extra damage?', hex: 'Two of us are Witches. Do our Hexes stack on the same bandit?', breath: 'How long can my character hold their breath underwater?', range: 'How far away is Close range?' };\nconst WHO = { crit: 'Vex', hex: 'Moss', breath: 'Oriel', range: 'Brannoc' };\nconst CONVOS = { full: ['crit', 'hex', 'breath'], drawer: ['range', '+thinking:crit'], mobile: ['hex'] };\nconst pick = (t) => { const s = String(t).toLowerCase(); if (/crit|match|double/.test(s)) return 'crit'; if (/hex|stack/.test(s)) return 'hex'; if (/range|close|far|melee|square/.test(s)) return 'range'; return 'breath'; };\nclass Component extends DCLogic {\n  renderVals() {\n    const st = this.state || {};\n    const base = []; (CONVOS[CFG.convo] || []).forEach((k) => { if (k.indexOf('+thinking:') === 0) { const q = k.split(':')[1]; base.push({ q, who: WHO[q], text: ASK[q] }); base.push({ thinking: true }); } else { base.push({ q: k, who: WHO[k], text: ASK[k] }); base.push({ a: k }); } });\n    const log = base.concat(st.extra || []);\n    const ask = (key, text, who) => { const extra = (this.state.extra || []).concat([{ q: key, who: who || 'You', text: text || ASK[key] }, { thinking: true }]); this.setState({ extra, draft: '' }); setTimeout(() => { const ex = (this.state.extra || []).slice(); const i = ex.map((m) => !!m.thinking).lastIndexOf(true); if (i >= 0) ex[i] = { a: (st.web === false && key === 'breath') ? 'nobooks' : key }; this.setState({ extra: ex }); }, 1300); };\n    const msgs = log.map((m) => {\n      const blank = { isQ: false, isA: false, isThinking: false, who: '', text: '', verdict: '', vCls: '', vIcon: '', quotes: [], hasCall: false, call: '', hasWeb: false, web: [], disc: '', acts: [] };\n      if (m.text && !m.a) return { ...blank, isQ: true, who: m.who, text: m.text };\n      if (m.thinking) return { ...blank, isThinking: true, text: 'Searching your books…' };\n      if (m.a === 'nobooks') return { ...blank, isA: true, verdict: 'Not in your books', vCls: 'lk-verdict lk-v-red', vIcon: '✕', text: 'I couldn’t find this in your books, and internet search is off. Ask your GM, or turn on “Search the internet too”.', acts: ['Ask the GM'] };\n      const a = A[m.a]; return { ...blank, isA: true, verdict: a.verdict, vCls: 'lk-verdict ' + (a.kind === 'ok' ? 'lk-v-ok' : a.kind === 'unclear' ? 'lk-v-amber' : 'lk-v-red'), vIcon: a.kind === 'ok' ? '✓' : a.kind === 'unclear' ? '?' : '✕',\n        text: a.text, quotes: a.quotes || [], hasCall: !!a.call, call: a.call || '', hasWeb: !!a.web, web: a.web || [], disc: a.disc || '', acts: a.acts }; });\n    const NAV = [['Dashboard', 'CampaignHub.dc.html'], ['Party', 'Party.dc.html'], ['World', 'World.dc.html'], ['Characters & Locations', 'Codex.dc.html'], ['Adversaries', 'Adversaries.dc.html'], ['Combat Map', 'Combat.dc.html'], ['Sessions', 'Sessions.dc.html'], ['Notes', 'Notes.dc.html'], [CFG.short, '#']];\n    const web = st.web !== false;\n    return {\n      isPage: CFG.layout !== 'drawer', isDrawer: CFG.layout === 'drawer',\n      underStyle: 'background: #0d1417;',\n      nav: NAV.map(([label, href]) => ({ label, href, cur: label === CFG.short ? 'page' : 'false' })),\n      books: [['Daggerheart Core Rulebook', 'Rules, classes, adversaries', 'linear-gradient(160deg,#7a2e28,#3a1210)', 'Indexed'], ['Hope & Fear', 'Assassin, Brawler, Warlock, Witch', 'linear-gradient(160deg,#5b4a8f,#1e1930)', 'Indexed'], ['The Witherwild', 'Campaign frame', 'linear-gradient(160deg,#3f6b4f,#14261c)', 'Indexed'], ['House rules (notes)', 'Your Notes tab', 'linear-gradient(160deg,#6a5236,#2a1f14)', 'Off']].map(([name, sub, g, s]) => ({ name, sub, cover: 'background: ' + g + ';', state: s, pillCls: 'lk-pill ' + (s === 'Off' ? 'lk-red' : 'lk-ok') })),\n      rulings: [{ title: 'Hexes don’t stack', text: 'Only the biggest Hex penalty applies to a target.', meta: 'Pinned by the GM · Session 4' }, { title: 'Swimming in heavy armour', text: 'Agility rolls to swim are made with disadvantage.', meta: 'Pinned by the GM · Session 2' }], rulingCount: '2 pinned',\n      indexText: '3 books indexed',\n      msgs,\n      sugs: [['crit', 'Critical hits'], ['range', 'How far is Close?'], ['hex', 'Do Hexes stack?'], ['breath', 'Holding breath']].map(([k, label]) => ({ label, ask: () => ask(k) })),\n      draft: st.draft || '', setDraft: (e) => this.setState({ draft: e.target.value }), send: () => { const t = String(this.state.draft || '').trim(); if (t) ask(pick(t), t); },\n      webOn: web ? 'true' : 'false', webOff: web ? 'false' : 'true', webYes: () => this.setState({ web: true }), webNo: () => this.setState({ web: false })\n    };\n  }\n}\n\n<\u002Fscript>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

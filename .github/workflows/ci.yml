name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit + Convex tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The web half of `pnpm lint` / `pnpm typecheck`; the mobile job runs
      # the app's half, in parallel, so neither job nears its timeout.
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm test

  mobile:
    name: Phone app (apps/mobile) lint, typecheck, jest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Jest's transform cache and the harness's Convex validator export (apps/mobile/jest.config.js,
      # test/harness/convex-returns.ts): a warm run skips the Babel transforms of React Native and Expo, most of a
      # cold run. Keyed per commit, restored from the newest run on the same lockfile.
      - name: Cache jest transforms and the Convex validator export
        uses: actions/cache@v4
        with:
          path: apps/mobile/node_modules/.cache
          key: mobile-jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            mobile-jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # eslint ., tsc --noEmit and jest --ci inside apps/mobile (the extra argument reaches jest, the script's last
      # command): every core of the runner runs tests.
      - run: pnpm --filter @dualityheart/mobile run check --maxWorkers=100%

  e2e:
    name: Playwright e2e (local Convex backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers and the Convex local backend binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/convex/binaries
          key: e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium

      # Creates the throwaway local backend with a freshly generated test
      # secret and JWT key pair; no repository secrets are used.
      - run: pnpm e2e:setup
      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
